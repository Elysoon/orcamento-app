<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Proposta · ESM Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.09);--red:#F22B0C;--graf:#262626;--ok:#2e8b45;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Lato,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.bar{height:6px;background:linear-gradient(90deg,var(--red) 0 35%,var(--graf) 35%)}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
header img{height:64px}
header .t{margin-left:auto;text-align:right;border-right:4px solid var(--red);padding-right:10px}
header .t b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
header .t span{font-size:12.5px;color:var(--muted)}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05)}
.muted{color:var(--muted)}
.it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it:last-child{border-bottom:0}
.it .d{flex:1;min-width:0}
.it .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.it small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pk label{position:relative;display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center}
.pk input{position:absolute;opacity:0}
.pk label:has(input:checked){border-color:var(--red);background:#fff7f5}
.pk i{font-style:normal;position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:980px;white-space:nowrap}
.pk b{font-size:15px}.pk span{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pk ul{margin:6px 0 0;padding-left:18px;text-align:left;font-size:12.5px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;accent-color:var(--red);flex:0 0 auto}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--graf);color:#fff;border-radius:16px;padding:16px 18px}
.tot small{color:#c7c7cc;display:block;font-size:12px}
.tot b{font-size:26px;font-variant-numeric:tabular-nums}
#tp b{font-size:inherit}
.pay{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pay img{width:150px;height:150px;image-rendering:pixelated;border-radius:8px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:980px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px;background:#f0f0f3;color:var(--fg);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.f,textarea.f{width:100%;font:inherit;border:1px solid #d2d2d7;border-radius:12px;padding:12px 13px;background:#fff}
textarea.f{min-height:80px;resize:vertical}
canvas.sig{width:100%;height:180px;background:#fffff0;border-radius:14px;touch-action:none;display:block;box-shadow:inset 0 0 0 1px var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.photos figure{margin:0}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.photos figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.note{white-space:pre-wrap;background:#f6f4ee;border-left:3px solid var(--red);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px}
.done{text-align:center;padding:30px 18px}
.done .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;color:#fff;background:var(--ok)}
.stars{display:flex;justify-content:center;gap:8px;margin:16px 0}
.stars button{font-size:40px;background:none;border:0;color:#d2d2d7;cursor:pointer;padding:0;line-height:1}
.stars button.on{color:#FFB400}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding-top:8px}
.warn{background:#fff4e5;color:#8a5300;border-radius:12px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<div class="bar"></div>
<main class="wrap" id="app"><div class="card"><p class="muted" style="margin:0">Carregando…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";
const DB_URL="https://esm-orcamento-default-rtdb.firebaseio.com";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
let CUR="R$";const money=v=>CUR+" "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fx=v=>(+v||0).toLocaleString("pt-BR",{maximumFractionDigits:3});
const P=new URLSearchParams(location.search),PT=P.get("p"),ST=P.get("s");
async function get(path){const r=await fetch(`${DB_URL}/${path}.json`);if(!r.ok)throw new Error(r.status);return r.json()}
async function put(path,v){const r=await fetch(`${DB_URL}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw new Error(r.status);return r.json()}
function fail(msg){$("#app").innerHTML=`<div class="card done"><div class="ic" style="background:#8e8e93">!</div><h1 style="font-size:22px">${esc(msg)}</h1><p class="muted">Confira o link recebido ou fale com a empresa que enviou.</p></div>`}
function head(e,title,sub){return`<header><img src="${e.logo}" alt="${esc(e.name)}"><div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></div></header>`}
function foot(e){return`<footer>${esc(e.name)}${e.cnpj?" · CNPJ "+esc(e.cnpj):""}<br>${[e.phone,e.email,e.site].filter(Boolean).map(esc).join(" · ")}</footer>`}
function pixPayload(key,name,city,amount,txid){const f=(id,v)=>id+String(v.length).padStart(2,"0")+v,cl=s=>norm(s).toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
 const k=(()=>{let s=String(key||"").trim();const d=s.replace(/\D/g,"");if(s.includes("@")||/^[0-9a-f-]{32,36}$/i.test(s))return s;if(/^\+/.test(s))return"+"+d;if(d.length===11||d.length===14)return d;if(d.length===10)return"+55"+d;return s})();
 let p=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",k))+f("52","0000")+f("53","986")+(amount>0?f("54",(+amount).toFixed(2)):"")+f("58","BR")+f("59",cl(name).slice(0,25)||"RECEBEDOR")+f("60",cl(city).slice(0,15)||"BELEM")+f("62",f("05",String(txid||"***").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***"))+"6304";
 let c=0xFFFF;for(let i=0;i<p.length;i++){c^=p.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return p+c.toString(16).toUpperCase().padStart(4,"0")}
function qr(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createDataURL(5,2)}catch(_){return""}}
function sigPad(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const g=c.getContext("2d");g.scale(d,d);g.strokeStyle="#111";g.lineWidth=2.6;g.lineCap="round";g.lineJoin="round";let on=false;c.empty=true;
 const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);on=true;c.empty=false;const[x,y]=p(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke()};c.onpointermove=e=>{if(!on)return;const[x,y]=p(e);g.lineTo(x,y);g.stroke()};c.onpointerup=c.onpointercancel=()=>on=false;
 c.clear=()=>{g.clearRect(0,0,c.width,c.height);c.empty=true};
 c.b64=()=>{const o=document.createElement("canvas"),k=Math.min(1,500/c.width);o.width=c.width*k;o.height=c.height*k;o.getContext("2d").drawImage(c,0,0,o.width,o.height);return o.toDataURL("image/png").split(",")[1]}}

/* ---------- proposta ---------- */
async function proposal(){
 let node;try{node=await get("propostas/"+PT)}catch(_){return fail("Não foi possível carregar a proposta.")}
 if(!node||!node.d)return fail("Proposta não encontrada.");
 const {empresa:e,q}=JSON.parse(node.d);CUR=e.cur||"R$";document.title=`Proposta${q.num?" Nº "+q.num:""} · ${e.name}`;
 if(!node.resposta)put(`propostas/${PT}/visto`,{".sv":"timestamp"}).catch(()=>{});
 const its=q.itens||[],pk=(q.pacotes||[]).length>0,lv=o=>(+o.q||0)*(+o.p||0);
 const st={pk:q.pkRec||0,opc:new Set()};
 const total=()=>{let s=its.filter(o=>!o.o&&!(pk&&o.pk>=0)).reduce((a,o)=>a+lv(o),0);if(pk)s+=its.filter(o=>!o.o&&o.pk===st.pk).reduce((a,o)=>a+lv(o),0);its.forEach((o,i)=>{if(o.o&&st.opc.has(i))s+=lv(o)});return Math.max(0,s-(+q.desc||0))};
 const data=new Date(+q.data||Date.now()),venc=new Date(data.getTime()+(q.val||7)*864e5),expired=Date.now()>venc;
 const itemRow=o=>`<div class="it"><div class="d">${esc(o.d)}<small>${fx(o.q)} × ${money(o.p)}${o.t==="s"?" · serviço":""}</small></div><div class="v">${money(lv(o))}</div></div>`;
 const com=its.filter(o=>!o.o&&!(pk&&o.pk>=0)),opts=its.map((o,i)=>[o,i]).filter(([o])=>o.o);
 const r=node.resposta;
 $("#app").innerHTML=`${head(e,"Proposta",`${q.num?"Nº "+q.num+" · ":""}${data.toLocaleDateString("pt-BR")}`)}
 <div><p class="muted" style="margin:0">Proposta para</p><h1>${esc(q.cliente)}</h1>${q.end?`<p class="muted" style="margin:4px 0 0">${esc(q.end)}</p>`:""}</div>
 ${expired&&!r?`<div class="warn">Esta proposta venceu em ${venc.toLocaleDateString("pt-BR")}. Você ainda pode responder, e a empresa confirma os valores.</div>`:""}
 ${com.length?`<div class="card"><h2>${pk?"Incluído em todas as opções":"Itens e serviços"}</h2>${com.map(itemRow).join("")}</div>`:""}
 ${pk?`<div class="card"><h2>Escolha a sua opção</h2><div class="pk">${q.pacotes.map((n,j)=>{const ex=its.filter(o=>!o.o&&o.pk===j);return`<label>${j===(q.pkRec||0)?"<i>Recomendado</i>":""}<input type="radio" name="pk" value="${j}" ${j===st.pk?"checked":""}><b>${esc(n)}</b><span data-pkt="${j}"></span>${ex.length?`<ul>${ex.map(o=>`<li>${fx(o.q)} × ${esc(o.d)}</li>`).join("")}</ul>`:""}</label>`}).join("")}</div></div>`:""}
 ${opts.length?`<div class="card"><h2>Adicionais opcionais</h2>${opts.map(([o,i])=>`<label class="opt"><input type="checkbox" data-op="${i}"><span style="flex:1">${esc(o.d)}<small class="muted" style="display:block">${fx(o.q)} × ${money(o.p)}</small></span><b style="font-variant-numeric:tabular-nums">+ ${money(lv(o))}</b></label>`).join("")}</div>`:""}
 <div class="tot"><div><small>Total${q.desc>0?" com desconto de "+money(q.desc):""}</small><b id="tt"></b></div><div style="text-align:right;font-size:13px" id="tp"></div></div>
 ${q.manut>0?`<div class="card"><h2>Plano de manutenção mensal (opcional)</h2><p style="margin:0"><b>${money(q.manut)}/mês</b>${q.manutD?" · "+esc(q.manutD):""}</p></div>`:""}
 ${(e.pix&&q.pix)||e.payLink?`<div class="card"><h2>Pagamento</h2><div class="pay">${e.pix&&q.pix?`<img id="pq" alt="QR Code Pix">`:""}<div style="flex:1;min-width:200px"><p style="margin:0 0 8px" id="pv"></p>${e.pix&&q.pix?`<button class="btn" id="pc">Copiar Pix copia e cola</button>`:""}${e.payLink?`<p style="margin:10px 0 0"><a class="btn" href="${esc(e.payLink)}" target="_blank" rel="noopener">Pagar com cartão ou boleto</a></p>`:""}</div></div></div>`:""}
 ${(q.fotos||[]).length?`<div class="card"><h2>Registro do local</h2><div class="photos">${q.fotos.map(f=>`<figure><img src="${f.img}" alt=""><figcaption>${esc(f.cap||"")}</figcaption></figure>`).join("")}</div></div>`:""}
 ${q.obs?`<div class="card"><h2>Condições</h2><div class="note">${esc(q.obs)}</div><p class="muted" style="margin:10px 0 0;font-size:13px">Válida até ${venc.toLocaleDateString("pt-BR")}.</p></div>`:""}
 <div id="resp"></div>${foot(e)}`;
 const upd=()=>{const t=total();$("#tt").textContent=money(t);const en=q.sinal>0?Math.round(t*q.sinal)/100:0,rest=t-en;
  $("#tp").innerHTML=q.sinal>0?`Entrada ${q.sinal}%: <b>${money(en)}</b><br>Saldo: ${money(rest)}${q.parc>1?` em ${q.parc}×`:""}`:q.parc>1?`Em ${q.parc}× de ${money(t/q.parc)}`:"";
  document.querySelectorAll("[data-pkt]").forEach(x=>{const j=+x.dataset.pkt,sv=st.pk;st.pk=j;x.textContent=money(total());st.pk=sv});
  if($("#pq")){const amt=en>0?en:t;const code=pixPayload(e.pix,e.pixNome||e.razao||e.name,e.pixCidade||"Belem",amt,"ORC"+(q.num||""));$("#pq").src=qr(code);$("#pv").innerHTML=`Pix ${en>0?"da entrada":""}: <b>${money(amt)}</b><br><span class="muted" style="font-size:13px">Chave: ${esc(e.pix)}${e.pixNome?" · "+esc(e.pixNome):""}</span>`;$("#pc").onclick=()=>{navigator.clipboard.writeText(code).then(()=>{$("#pc").textContent="Copiado ✓"},()=>prompt("Copie o código:",code))}}
  else if($("#pv"))$("#pv").innerHTML=`Valor: <b>${money(en>0?en:t)}</b>${en>0?" (entrada)":""}`};
 document.querySelectorAll("input[name=pk]").forEach(x=>x.onchange=()=>{st.pk=+x.value;upd()});
 document.querySelectorAll("[data-op]").forEach(x=>x.onchange=()=>{x.checked?st.opc.add(+x.dataset.op):st.opc.delete(+x.dataset.op);upd()});
 upd();
 const R=$("#resp");
 const thanks=(a,nome)=>{const msg=a==="aprovado"?`Olá! Aprovei a proposta${q.num?" Nº "+q.num:""}.`:a==="recusado"?`Olá! Respondi a proposta${q.num?" Nº "+q.num:""}.`:`Olá! Pedi uma alteração na proposta${q.num?" Nº "+q.num:""}.`;const ph=String(e.phone||"").replace(/\D/g,"");
  R.innerHTML=`<div class="card done"><div class="ic" style="background:${a==="aprovado"?"var(--ok)":a==="recusado"?"#8e8e93":"#0a64c8"}">${a==="aprovado"?"✓":a==="recusado"?"✕":"✎"}</div><h1 style="font-size:22px">${a==="aprovado"?"Proposta aprovada":a==="recusado"?"Resposta enviada":"Pedido de alteração enviado"}</h1><p class="muted">${a==="aprovado"?`Obrigado${nome?", "+esc(nome.split(" ")[0]):""}! A ${esc(e.name)} vai entrar em contato para combinar a instalação.`:`A ${esc(e.name)} recebeu a sua resposta.`}</p>${ph.length>=10?`<a class="btn pri" href="https://wa.me/${ph.startsWith("55")?ph:"55"+ph}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:""}</div>`};
 if(r){return thanks(r.acao,r.nome)}
 R.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0">Aprovar a proposta</h2>
  <input class="f" id="nm" placeholder="Seu nome completo" autocomplete="name"><div><p class="muted" style="margin:0 0 6px;font-size:13px">Assine com o dedo na área abaixo</p><canvas class="sig" id="sg"></canvas><button class="btn" id="sgc" style="margin-top:8px;padding:8px 14px;font-size:13px">Limpar assinatura</button></div>
  <p class="muted" style="margin:0;font-size:12.5px">Ao aprovar, você concorda com os itens, valores e condições desta proposta.</p>
  <button class="btn ok" id="ap">Aprovar proposta</button>
  <textarea class="f" id="cm" placeholder="Quer mudar algo? Escreva aqui"></textarea>
  <div class="row"><button class="btn" id="al">Pedir alteração</button><button class="btn" id="rc" style="color:var(--muted)">Recusar</button></div></div>`;
 const sg=$("#sg");sigPad(sg);$("#sgc").onclick=()=>sg.clear();
 const send=async(acao)=>{const nome=$("#nm").value.trim(),coment=$("#cm").value.trim();
  if(acao==="aprovado"&&(!nome||sg.empty)){alert("Informe seu nome e assine para aprovar.");return}
  if(acao==="alteracao"&&!coment){alert("Escreva o que você quer mudar.");$("#cm").focus();return}
  document.querySelectorAll("#resp button").forEach(b=>b.disabled=true);
  try{await put(`propostas/${PT}/resposta`,{acao,pacote:pk?st.pk:-1,opc:[...st.opc],nome,coment,assin:acao==="aprovado"?sg.b64():"",total:total(),em:{".sv":"timestamp"}});thanks(acao,nome);scrollTo({top:R.offsetTop-20,behavior:"smooth"})}
  catch(_){document.querySelectorAll("#resp button").forEach(b=>b.disabled=false);alert("Não foi possível enviar. Verifique a internet e tente de novo.")}};
 $("#ap").onclick=()=>send("aprovado");$("#al").onclick=()=>send("alteracao");$("#rc").onclick=()=>send("recusado");
}

/* ---------- pesquisa de satisfação ---------- */
async function survey(){
 let node;try{node=await get("pesquisas/"+ST)}catch(_){return fail("Não foi possível carregar a pesquisa.")}
 if(!node||!node.d)return fail("Pesquisa não encontrada.");
 const d=JSON.parse(node.d),e=d.empresa;document.title=`Avaliação · ${e.name}`;
 if(node.resposta){$("#app").innerHTML=`${head(e,"Avaliação",d.num?"OS Nº "+d.num:"")}<div class="card done"><div class="ic">✓</div><h1 style="font-size:22px">Obrigado pela avaliação!</h1></div>${foot(e)}`;return}
 let n=0;
 $("#app").innerHTML=`${head(e,"Avaliação",d.num?"OS Nº "+d.num:"")}<div class="card" style="text-align:center"><p class="muted" style="margin:0">Olá, ${esc(String(d.cliente||"").split(" ")[0])}!</p><h1 style="font-size:22px">Como foi o atendimento${d.servico?` em "${esc(d.servico)}"`:""}?</h1>
 <div class="stars">${[1,2,3,4,5].map(i=>`<button data-s="${i}" aria-label="${i} estrela${i>1?"s":""}">★</button>`).join("")}</div>
 <textarea class="f" id="cm" placeholder="Quer deixar um comentário? (opcional)"></textarea><button class="btn pri" id="ok" style="margin-top:12px;width:100%" disabled>Enviar avaliação</button></div>${foot(e)}`;
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{n=+b.dataset.s;document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",+x.dataset.s<=n));$("#ok").disabled=false});
 $("#ok").onclick=async()=>{$("#ok").disabled=true;try{await put(`pesquisas/${ST}/resposta`,{nota:n,coment:$("#cm").value.trim(),em:{".sv":"timestamp"}});$("#app").innerHTML=`${head(e,"Avaliação",d.num?"OS Nº "+d.num:"")}<div class="card done"><div class="ic">✓</div><h1 style="font-size:22px">Obrigado pela avaliação!</h1><p class="muted">A sua opinião ajuda a ${esc(e.name)} a melhorar.</p></div>${foot(e)}`}catch(_){$("#ok").disabled=false;alert("Não foi possível enviar. Tente de novo.")}};
}
if(PT)proposal();else if(ST)survey();else fail("Link incompleto.");
</script>
</body>
</html>
