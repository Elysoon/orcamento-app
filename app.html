<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: app de uma coluna, barra inferior fixa; tudo em tinta sobre papel, sem cor de marca */
:root{
  --paper:#f4f4f2; --surface:#ffffff; --ink:#151515; --ink2:#3a3a38; --muted:#6c6c68; --line:#deded9; --soft:#ececE8;
  --hl:#151515; --hl-ink:#ffffff;
  --f-display:"Schibsted Grotesk",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --nav:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111111; --surface:#1a1a19; --ink:#f0f0ec; --ink2:#cfcfca; --muted:#9a9a94; --line:#2d2d2b; --soft:#232322; --hl:#f0f0ec; --hl-ink:#111111; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111111; --surface:#1a1a19; --ink:#f0f0ec; --ink2:#cfcfca; --muted:#9a9a94; --line:#2d2d2b; --soft:#232322; --hl:#f0f0ec; --hl-ink:#111111; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;flex:1;min-width:0;text-wrap:balance}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li:active{background:var(--soft)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--ink);border:1px dashed var(--muted)}
.btn:focus-visible,.li:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg,.btn svg,.nav svg,.li svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
/* estado do documento sem cor: forma e preenchimento */
.st{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--ink2)}
.st.s-full{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.st.s-out{background:transparent;color:var(--ink)}
.st.s-dash{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.st.s-x{text-decoration:line-through;color:var(--muted);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.inv{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.kpi.inv .eyebrow{color:inherit;opacity:.7}
h2{font-family:var(--f-display);font-size:17px;margin:20px 0 8px;letter-spacing:-.01em}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.nav button{background:none;border:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
nav.nav button.on{color:var(--ink)}
nav.nav button.on svg{stroke-width:2.4}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:18px;background:var(--hl);color:var(--hl-ink);border:0;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
/* folhas (telas sobrepostas) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;animation:up .18s ease-out}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .bar h3{flex:1;margin:0;font-family:var(--f-display);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(40px + env(safe-area-inset-bottom,0px))}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg .box{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom,0px));background:var(--hl);color:var(--hl-ink);padding:10px 16px;border-radius:999px;z-index:80;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface)}
.line .lh{display:flex;gap:8px;align-items:flex-start}
.line .lh input{font-weight:600}
.line .lf{display:grid;grid-template-columns:70px 64px 1fr auto;gap:6px;align-items:center}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.tot.big{font-family:var(--f-display);font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb-x{position:relative}
.thumb-x button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:999px;border:0;background:var(--hl);color:var(--hl-ink);font-weight:800;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{border-color:var(--ink)}
.cal button.sel{background:var(--hl);color:var(--hl-ink)}
.cal button i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:9px;background:currentColor}
.sig{width:100%;height:200px;border:1px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.banner{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars .b span{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0}
.bars .in{background:var(--ink)}
.bars .outb{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 6px);border:1px solid var(--muted)}
.pair{display:flex;gap:4px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px}
.logo-mark{width:64px;height:64px;border-radius:18px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px}
.gate{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px}.seg button{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:700;color:var(--muted);cursor:pointer;min-height:42px}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.preview iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink2)}
.note svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;margin-top:1px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+span{background:var(--acc,var(--hl))}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.lp{cursor:default;padding:8px 10px;gap:8px}
.lp.drag{background:var(--soft);box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:2}
.lp .icon{border:0;background:none;width:36px;height:36px}
.grip{cursor:grab;color:var(--muted)}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.tile svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile span{font-weight:600;font-size:14px}
.tile b{grid-column:1 / -1;font-size:17px;margin-top:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.li.fld{border:1px solid var(--line);border-radius:10px;padding:10px 12px;gap:8px}
.li.fld .t.wr{white-space:normal}
.li.fld>svg{color:var(--muted);flex:none}
.cron{display:grid;gap:4px;background:var(--soft);border-radius:10px;padding:8px 10px}
.cron div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.chip.dpc{display:inline-flex;align-items:center;gap:6px;cursor:default}
.chip.dpc input{width:54px;padding:3px 6px;border-radius:8px;font-size:13px}
</style>

<div id="app"></div>
<div id="layer"></div>

/* valor por extenso (reais) */
function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(n===0)return'';if(n===100)return'cem';const p=[];const C=Math.floor(n/100),r=n%100;if(C)p.push(c[C]);if(r){if(r<20)p.push(u[r]);else{const D=Math.floor(r/10),U=r%10;p.push(U?d[D]+' e '+u[U]:d[D])}}return p.join(' e ')};
  const inteiro=n=>{if(n===0)return'zero';const grupos=[['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];const parts=[];let i=0,lastSmall=false;
    while(n>0){const g=n%1000;if(g){let t=ate999(g);if(i===1)t=g===1?'mil':t+' mil';else if(i>1)t=t+' '+(g===1?grupos[i][0]:grupos[i][1]);parts.unshift({t,g,i})}n=Math.floor(n/1000);i++}
    let out='';parts.forEach((p,k)=>{if(k===0)out=p.t;else{const lastG=p.g;out+=((p.i===0&&(lastG<100||lastG%100===0))?' e ':(p.i===0?', ':' e '))+p.t}});return out};
  v=Math.round(Math.abs(v)*100);const r=Math.floor(v/100),ce=v%100;let s='';
  if(r){s=inteiro(r)+(r===1?' real':(r%1000000===0?' de reais':' reais'))}
  if(ce){s+=(s?' e ':'')+ate999(ce)+(ce===1?' centavo':' centavos')}
  return s||'zero reais';
}

function migrar(x){

  x.perfis=lista(x.perfis).filter(Boolean);
  if(!x.perfis.length){const p=Object.assign(perfilBlank(),legado||{});p.id=uid();if(legado&&legado.corPdf)p.cor=legado.corPdf;if(x.seq)p.seq=Object.assign(SEQ0(),x.seq);x.perfis=[p]}

  x.perfis=x.perfis.map(p0=>{const p=Object.assign(perfilBlank(),p0);if(!p0.id)p.id=uid();if(!p0.cor&&p0.corPdf)p.cor=p0.corPdf;delete p.corPdf;
    p.formas=lista(p0.formas).length?lista(p0.formas):mkLista(FORMAS_PAD,['Pix']);p.conds=lista(p0.conds).length?lista(p0.conds):mkLista(CONDS_PAD,[]);
    p.seq=Object.assign(SEQ0(),p0.seq||{});return p});
  if(!x.perfis.some(p=>p.id===x.perfilId))x.perfilId=x.perfis[0].id;

function totals(d){
  let prod=0,serv=0;(d.itens||[]).forEach(it=>{const t=itTot(it);if(it.tipo==='s')serv+=t;else prod+=t});
  const sub=prod+serv;let desc=d.descTipo==='%'?sub*num(d.desconto)/100:num(d.desconto);desc=Math.min(Math.max(desc,0),sub);const acr=num(d.acrescimo),frete=num(d.frete);
  const base=Math.max(0,sub-desc+acr+frete);const imp=base*Math.max(0,num(d.imposto))/100;

/* Entrada + parcelas: linhas do cronograma de pagamento (valores em centavos exatos, a última parcela fecha a conta). */
function cronograma(d,total){
  const pct=Math.min(100,Math.max(0,num(d.entrada)));const n=Math.max(1,Math.min(60,Math.round(num(d.parcelas))||1));
  if(!pct&&n<=1)return[];
  const ent=Math.round(total*pct)/100;const resto=Math.round((total-ent)*100)/100;const rows=[];
  if(ent>0)rows.push({l:'Entrada ('+fnum(pct,pct%1?1:0)+'%)',v:ent,q:'na aprovação'});
  if(resto>0){const base=d.venc1||addDays(d.data||today(),30);const par=Math.floor(resto/n*100)/100;let acc=0;
    for(let i=0;i<n;i++){const v=i===n-1?Math.round((resto-acc)*100)/100:par;acc+=v;
      rows.push({l:n>1?`Parcela ${i+1}/${n}`:'Saldo',v,q:n===1&&!d.venc1?'na entrega':'venc. '+fdate(addMonths(base,i))})}}
  return rows}

      const mids=rows.map(r=>r.offsetTop+r.offsetHeight/2);let to=i0;row.classList.add('drag');g.setPointerCapture(ev.pointerId);
      g.onpointermove=e=>{const dy=e.clientY-y0;row.style.transform=`translateY(${dy}px)`;const centro=mids[i0]+dy;to=0;rows.forEach((r,i)=>{if(i!==i0&&mids[i]<centro)to++});if(to>i0)to=Math.min(to,rows.length-1);

  draw();
}

        <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="fLanc" style="width:auto" ${d._lancar!==false?'checked':''}> Lançar como entrada no financeiro</label></div>`:''}
      ${tipo==='CTR'?`<div class="card stack"><span class="eyebrow">Texto do contrato</span><div class="muted" style="font-size:13px">Campos entre chaves são preenchidos sozinhos no PDF: {cliente}, {valor}, {itens}, {prazo}, {data_extenso}…</div><textarea id="fTxt" style="min-height:280px;font-size:14px">${esc(d.texto)}</textarea></div>`:''}
      ${tipo!=='REC'?`<div class="card stack">${pf.separar?sec('i','Produtos')+'<hr class="sep">'+sec('s','Serviços'):sec('i','Itens e serviços')}</div>
      <div class="card stack"><span class="eyebrow">Valores</span>
        <div id="fTot">${totHtml(t)}</div>
        <div class="g2"><button type="button" class="tile" id="tDesc">${ic('tag')}<span>Descontos</span><b>${money(t.desc)}</b></button><button type="button" class="tile" id="tFrete">${ic('truck')}<span>Frete</span><b>${money(t.frete)}</b></button></div>
        <div class="g2"><label class="f">Acréscimo / deslocamento<input id="fAcr" inputmode="decimal" value="${esc(fnum(d.acrescimo))}"></label><label class="f">Impostos (%) sobre o total<input id="fImp" inputmode="decimal" value="${esc(num(d.imposto)?fnum(d.imposto,num(d.imposto)%1?2:0):'')}" placeholder="0"></label></div></div>
      <div class="card stack"><span class="eyebrow">Pagamento</span>
        <button type="button" class="li fld" id="fFormas"><div class="grow"><div class="s">Formas de pagamento</div><div class="t wr">${esc(nomesSel(d.formas)||'Nenhuma selecionada')}</div></div>${ic('chev')}</button>
        <button type="button" class="li fld" id="fConds"><div class="grow"><div class="s">Condições de pagamento</div><div class="t wr">${esc(nomesSel(d.conds)||'Nenhuma selecionada')}</div></div>${ic('chev')}</button>
        <div class="g3"><label class="f">Entrada (%)<input id="fEnt" inputmode="decimal" value="${esc(num(d.entrada)?fnum(d.entrada,num(d.entrada)%1?2:0):'')}" placeholder="0"></label><label class="f">Parcelas<input id="fParc" inputmode="numeric" value="${esc(d.parcelas>1?d.parcelas:'')}" placeholder="1"></label><label class="f">1º vencimento<input type="date" id="fVenc" value="${esc(d.venc1||'')}"></label></div>
        <div id="fCron" class="muted" style="font-size:13px">${cronHtml(cr)}</div>
        <label class="f">Outras condições de pagamento<textarea id="fPag" style="min-height:56px">${esc(d.pagamento)}</textarea></label></div>
      <div class="card stack"><span class="eyebrow">Prazo, garantia e observações</span>
        <label class="f">Prazo de execução / entrega<input id="fPrazo" value="${esc(d.prazo)}" placeholder="Ex.: 5 dias úteis"></label>
        <label class="f">Garantia<textarea id="fGar" style="min-height:56px">${esc(d.garantia)}</textarea></label>
        <label class="f">Observações<textarea id="fObs" style="min-height:56px">${esc(d.obs)}</textarea></label>
        <label class="f">Termos e condições (página do PDF)<textarea id="fTer" style="min-height:90px" placeholder="Vem do perfil da empresa. Edite aqui só para este documento.">${esc(d.termos)}</textarea></label></div>
      <div class="card stack"><span class="eyebrow">Aparência do PDF</span>
        <div class="g2"><label class="f">Modelo<select id="fMod"><option value="">Padrão da empresa (${MODELOS[MODEL_DEFAULT(pf)].n})</option>${Object.entries(MODELOS).map(([k,v])=>`<option value="${k}" ${d.modelo===k?'selected':''}>${v.n}</option>`).join('')}</select></label>
        <label class="f">Capa<select id="fCapa"><option value="" ${d.capa===''||d.capa==null?'selected':''}>Padrão da empresa (${pf.capa?'com capa':'sem capa'})</option><option value="1" ${d.capa==='1'?'selected':''}>Com capa</option><option value="0" ${d.capa==='0'?'selected':''}>Sem capa</option></select></label></div>
        <label class="f">QR Code do Pix<select id="fQr"><option value="" ${!d.qr?'selected':''}>Padrão da empresa (${pf.qrPix!==false?'mostrar':'ocultar'})</option><option value="1" ${d.qr==='1'?'selected':''}>Mostrar</option><option value="0" ${d.qr==='0'?'selected':''}>Ocultar</option></select></label>
        <button type="button" class="btn ghost" id="fPrev">${ic('eye')}Ver como ficou (PDF)</button></div>`:''}

        ${d.fotos.length?`<div class="thumbs">${d.fotos.map((f,i)=>`<div class="thumb-x"><img src="${f.src}" alt="Foto ${i+1}"><button data-delfoto="${i}" aria-label="Remover foto">×</button></div>`).join('')}</div>`:'<div class="muted" style="font-size:13px">Fotos do local ou do serviço entram no PDF.</div>'}</div>
      <div class="card stack"><span class="eyebrow">Assinaturas</span>
        <div class="row"><div class="grow"><b>Cliente</b><div class="muted" style="font-size:13px">${d.assinCliente?'Assinado no aparelho':'Peça para o cliente assinar na tela'}</div></div>${d.assinCliente?`<img src="${d.assinCliente}" alt="Assinatura" style="height:40px;background:#fff;border-radius:6px">`:''}<button class="btn sm ghost" id="fSig">${ic('pen')}${d.assinCliente?'Refazer':'Assinar'}</button></div>
        <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="fSigE" style="width:auto" ${d.assinEmpresa?'checked':''}> Incluir minha assinatura salva</label></div>
    </div>`;
    bindEd();
  };
  const cronHtml=cr=>cr.length?`<div class="cron">${cr.map(r=>`<div><span>${esc(r.l)} · ${esc(r.q)}</span><b class="tab">${money(r.v)}</b></div>`).join('')}</div>`:'Sem entrada nem parcelas: o PDF mostra só as formas e condições escolhidas.';
  const totHtml=t=>`${P().separar?`<div class="tot"><span class="muted">Produtos</span><span>${money(t.prod)}</span></div><div class="tot"><span class="muted">Serviços</span><span>${money(t.serv)}</span></div>`:`<div class="tot"><span class="muted">Subtotal</span><span>${money(t.sub)}</span></div>`}
    ${t.desc?`<div class="tot"><span class="muted">Desconto</span><span>- ${money(t.desc)}</span></div>`:''}${t.acr?`<div class="tot"><span class="muted">Acréscimo</span><span>${money(t.acr)}</span></div>`:''}${t.frete?`<div class="tot"><span class="muted">Frete</span><span>${money(t.frete)}</span></div>`:''}${t.imp?`<div class="tot"><span class="muted">${esc(d.impostoNome||'Impostos')} (${fnum(d.imposto,num(d.imposto)%1?2:0)}%)</span><span>${money(t.imp)}</span></div>`:''}<div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>`;
  const refreshTot=()=>{const x=$('#fTot',body);if(x)x.innerHTML=totHtml(totals(d));const cr=$('#fCron',body);if(cr)cr.innerHTML=cronHtml(cronograma(d,totals(d).total))};
  const collect=()=>{const v=id=>{const e=$('#'+id,body);return e?e.value:undefined};
    if(v('fData')!==undefined)d.data=v('fData');if(v('fVal')!==undefined)d.validade=v('fVal');if(v('fSt')!==undefined)d.status=v('fSt');
    ['fEq:equipamento','fDef:defeito','fLaudo:laudo','fRef:referente','fForma:forma','fTxt:texto','fPag:pagamento','fPrazo:prazo','fGar:garantia','fObs:obs','fTer:termos','fMod:modelo','fCapa:capa','fQr:qr','fVenc:venc1'].forEach(p=>{const[a,b]=p.split(':');const x=v(a);if(x!==undefined)d[b]=x});
    if(v('fValor')!==undefined)d.valor=num(v('fValor'));if(v('fAcr')!==undefined)d.acrescimo=num(v('fAcr'));if(v('fImp')!==undefined)d.imposto=Math.max(0,num(v('fImp')));
    if(v('fEnt')!==undefined)d.entrada=Math.min(100,Math.max(0,num(v('fEnt'))));if(v('fParc')!==undefined)d.parcelas=Math.max(1,Math.min(60,Math.round(num(v('fParc')))||1));
    const se=$('#fSigE',body);if(se)d.assinEmpresa=se.checked;const fl=$('#fLanc',body);if(fl)d._lancar=fl.checked;};
  function bindEd(){
    $('#fCli',body).onclick=()=>{collect();pickCliente(id=>{d.clienteId=id;render()})};
    const fp=$('#fPerfil',body);if(fp)fp.onchange=()=>{collect();d.perfilId=fp.value;const e=P();
      Object.assign(d,{pagamento:e.condicoes,formas:e.formas.filter(x=>x.on).map(x=>x.nome),conds:e.conds.filter(x=>x.on).map(x=>x.nome),garantia:e.garantia,termos:e.termos,obs:e.obs,validade:addDays(d.data||today(),num(e.validade)||15)});render();toast('Padrões de '+(e.nome||'empresa')+' aplicados')};
    $$('[data-k]',body).forEach(inp=>inp.oninput=()=>{const it=d.itens[inp.dataset.i];const k=inp.dataset.k;it[k]=(k==='qtd'||k==='preco'||k==='dp')?num(inp.value):inp.value;
      const s=$(`[data-sub="${inp.dataset.i}"]`,body);if(s)s.textContent=money(itTot(it));refreshTot()});
    $$('[data-del]',body).forEach(b=>b.onclick=()=>{collect();d.itens.splice(+b.dataset.del,1);render()});
    $$('[data-showdesc]',body).forEach(b=>b.onclick=()=>{collect();d.itens[+b.dataset.showdesc]._showDesc=true;render()});
    $$('[data-showdp]',body).forEach(b=>b.onclick=()=>{collect();d.itens[+b.dataset.showdp]._showDp=true;render();const x=$(`[data-i="${b.dataset.showdp}"][data-k=dp]`,body);if(x)x.focus()});
    $$('[data-area]',body).forEach(b=>b.onclick=()=>{collect();const it=d.itens[+b.dataset.area];areaDlg(it,a=>{it.qtd=a;it.un='m²';render()})});
    $$('[data-addman]',body).forEach(b=>b.onclick=()=>{collect();d.itens.push({id:uid(),nome:'',tipo:b.dataset.addman,un:'un',qtd:1,preco:0,desc:''});render();const ins=$$('[data-k=nome]',body);ins[ins.length-1]?.focus()});
    $$('[data-addcat]',body).forEach(b=>b.onclick=()=>{collect();pickCatalogo(b.dataset.addcat,sel=>{sel.forEach(x=>d.itens.push({id:uid(),cid:x.id,nome:x.nome,tipo:x.tipo,un:x.un,qtd:x._q||1,preco:x.preco,custo:x.custo,desc:x.desc||''}));render()})});
    const td=$('#tDesc',body);if(td)td.onclick=()=>{collect();valorDlg('Desconto',{valor:d.desconto,pct:true,tipo:d.descTipo||'R$',nota:'Em reais ou em porcentagem do subtotal.'},(v,t)=>{d.desconto=v;d.descTipo=t;render()})};
    const tf=$('#tFrete',body);if(tf)tf.onclick=()=>{collect();valorDlg('Frete',{valor:d.frete},v=>{d.frete=v;render()})};
    ['fAcr','fImp','fEnt','fParc','fVenc'].forEach(id=>{const e=$('#'+id,body);if(e)e.oninput=e.onchange=()=>{collect();refreshTot()}});
    const ff=$('#fFormas',body);if(ff)ff.onclick=()=>{collect();listaPag('formas',P(),d.formas,n=>{d.formas=n;render()})};
    const fc=$('#fConds',body);if(fc)fc.onclick=()=>{collect();listaPag('conds',P(),d.conds,n=>{d.conds=n;render()})};
    const fv=$('#fValor',body);if(fv)fv.oninput=()=>{$('#fExt',body).textContent=extenso(num(fv.value))};
    const pv=$('#fPrev',body);if(pv)pv.onclick=()=>{collect();pdfAcao(Object.assign({},d,{num:d.num||P().seq[tipo],itens:d.itens.filter(i=>i.nome.trim())}),'preview')};
    $('#fFoto',body).onchange=async e=>{collect();for(const f of e.target.files){d.fotos.push(await resizeImg(f,1280,.72))}render()};
    $$('[data-delfoto]',body).forEach(b=>b.onclick=()=>{collect();d.fotos.splice(+b.dataset.delfoto,1);render()});
    $('#fSig',body).onclick=()=>{collect();assinar('Assinatura do cliente',src=>{d.assinCliente=src;render()})};
  }
  $('#dSave',el).onclick=()=>{
    collect();d.itens=d.itens.filter(i=>i.nome.trim()).map(i=>{delete i._showDesc;delete i._showDp;return i});
    if(!d.num&&!podeCriar())return;
    if(!d.num){const pf=perfilDe(d);d.num=pf.seq[tipo]++}
    const lancar=tipo==='REC'&&d._lancar!==false&&isNew;delete d._lancar;
    const i=S.docs.findIndex(x=>x.id===d.id);const antes=i>=0?S.docs[i]:null;if(i>=0)S.docs[i]=d;else S.docs.unshift(d);
    if(lancar&&num(d.valor)>0)S.fin.unshift({id:uid(),tipo:'E',desc:'Recibo '+docNum(d)+(cli(d.clienteId)?' – '+cli(d.clienteId).nome:''),valor:num(d.valor),data:d.data,pago:true,cat:'Recebimentos',clienteId:d.clienteId,docId:d.id,forma:d.forma});
    estoqueAplicar(d,antes);
    save();topSheetClose();toast(T.n+' salvo');go(view);
    if(isNew)verDoc(d.id);
  };
  render();
}
function estoqueAplicar(d,antes){}
function verDoc(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;const T=TIPOS[d.tipo];const c=cli(d.clienteId);const t=totals(d);
  const el=sheet(T.n+' '+docNum(d),'',{actions:`<button class="icon" id="vEdit" aria-label="Editar">${ic('pen')}</button>`});
  const body=$('.body',el);
  const lines=(d.itens||[]).map(it=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><div style="font-weight:600">${esc(it.nome)}</div><div class="muted tab" style="font-size:13px">${fnum(it.qtd,num(it.qtd)%1?2:0)} ${esc(it.un)} × ${money(it.preco)}${it.tipo==='s'?' · serviço':''}</div></div><b class="tab">${money(itTot(it))}</b></div>`).join('');
  const conv=d.tipo==='ORC'?[['OS','Gerar ordem de serviço'],['PED','Gerar pedido'],['CTR','Gerar contrato'],['REC','Gerar recibo']]:d.tipo==='OS'||d.tipo==='PED'?[['REC','Gerar recibo'],['CTR','Gerar contrato']]:[];
  body.innerHTML=`<div class="stack">
    <div class="card stack"><div class="row"><span class="st ${ST_STYLE[d.status]||'s-out'}">${esc(d.status)}</span><span class="grow"></span><span class="muted">${fdate(d.data)}</span></div>
      <div><div class="eyebrow">Cliente</div><div style="font-weight:700;font-size:17px">${esc(c?c.nome:'Sem cliente')}</div>${c&&c.tel?`<div class="muted">${esc(c.tel)}</div>`:''}</div>
      <div style="font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em" class="tab">${money(t.total)}</div>
      ${d.tipo==='REC'?`<div class="muted">${esc(extenso(t.total))}</div>`:''}</div>
    <div class="g2"><button class="btn" id="vShare">${ic('share')}Enviar PDF</button><button class="btn ghost" id="vWa">${ic('wa')}WhatsApp</button><button class="btn ghost" id="vPrev">${ic('eye')}Ver PDF</button><button class="btn ghost" id="vDl">${ic('dl')}Baixar PDF</button></div>
    ${T.st.length>1?`<div class="card stack"><span class="eyebrow">Mudar situação</span><div class="chips">${T.st.map(s=>`<button class="chip ${s===d.status?'on':''}" data-setst="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`:''}
    ${lines?`<div class="card">${lines}<div style="margin-top:8px">${t.desc?`<div class="tot"><span class="muted">Desconto</span><span>- ${money(t.desc)}</span></div>`:''}${t.acr?`<div class="tot"><span class="muted">Acréscimo</span><span>${money(t.acr)}</span></div>`:''}${t.frete?`<div class="tot"><span class="muted">Frete</span><span>${money(t.frete)}</span></div>`:''}${t.imp?`<div class="tot"><span class="muted">${esc(d.impostoNome||'Impostos')}</span><span>${money(t.imp)}</span></div>`:''}</div></div>`:''}
    ${conv.length?`<div class="card stack"><span class="eyebrow">Próximo passo</span>${conv.map(([k,l])=>`<button class="li" data-conv="${k}" style="padding-left:0">${ic('convert')}<span class="grow t">${l}</span></button>`).join('')}
      ${d.tipo==='ORC'?`<button class="li" id="vFin" style="padding-left:0">${ic('cash')}<span class="grow t">Lançar conta a receber</span></button><button class="li" id="vAg" style="padding-left:0">${ic('cal')}<span class="grow t">Agendar execução</span></button>`:''}</div>`:''}
    <div class="row wrapr"><button class="btn ghost sm" id="vDup">${ic('copy')}Duplicar</button><button class="btn danger sm" id="vDel">${ic('trash')}Excluir</button></div>
  </div>`;
  $('#vEdit',el).onclick=()=>{topSheetClose();editDoc(d)};
  $('#vShare',body).onclick=()=>pdfAcao(d,'share');$('#vPrev',body).onclick=()=>pdfAcao(d,'preview');$('#vDl',body).onclick=()=>pdfAcao(d,'download');
  $('#vWa',body).onclick=()=>{const fone=onlyDigits(c&&c.tel);const msg=`Olá${c?' '+c.nome.split(' ')[0]:''}! Segue ${T.n.toLowerCase()} nº ${docNum(d)} de ${perfilDe(d).nome||'nossa empresa'}, no valor de ${money(t.total)}.${d.tipo==='ORC'&&d.validade?' Válido até '+fdate(d.validade)+'.':''} O PDF vai em seguida.`;
    window.open(`https://wa.me/${fone?(fone.length<=11?'55'+fone:fone):''}?text=${encodeURIComponent(msg)}`,'_blank');if(d.tipo==='ORC'&&d.status==='Rascunho'){d.status='Enviado';save()}};
  $$('[data-setst]',body).forEach(b=>b.onclick=()=>{d.status=b.dataset.setst;save();topSheetClose();verDoc(d.id);go(view)});
  $$('[data-conv]',body).forEach(b=>b.onclick=()=>{const k=b.dataset.conv;topSheetClose();
    const base={perfilId:d.perfilId,clienteId:d.clienteId,itens:JSON.parse(JSON.stringify(d.itens||[])),desconto:d.desconto,descTipo:d.descTipo,acrescimo:d.acrescimo,pagamento:d.pagamento,prazo:d.prazo,garantia:d.garantia,obs:d.obs,origemId:d.id,fotos:[]};
    if(k==='REC'){base.valor=t.total;base.referente=`${T.n} nº ${docNum(d)}`+((d.itens||[]).length?': '+(d.itens||[]).slice(0,4).map(i=>i.nome).join(', '):'');base.itens=[]}
    novoDoc(k,base)});
  const vf=$('#vFin',body);if(vf)vf.onclick=()=>{editFin({tipo:'E',desc:`${T.n} ${docNum(d)}${c?' – '+c.nome:''}`,valor:t.total,data:addDays(today(),7),pago:false,cat:'Serviços',clienteId:d.clienteId,docId:d.id})};
  const va=$('#vAg',body);if(va)va.onclick=()=>editEvento({titulo:'Execução – '+(c?c.nome:T.n+' '+docNum(d)),clienteId:d.clienteId,local:c?c.end:'',docId:d.id,data:addDays(today(),1),hora:'08:00'});
  $('#vDup',body).onclick=()=>{topSheetClose();const n=JSON.parse(JSON.stringify(d));n.id=uid();n.num=null;n.data=today();n.status=T.st[0];n.assinCliente='';n.createdAt=Date.now();editDoc(n,true)};
  $('#vDel',body).onclick=async()=>{if(await ask(`Excluir ${T.n.toLowerCase()} ${docNum(d)}? Não dá para desfazer.`,{ok:'Excluir'})){S.docs=S.docs.filter(x=>x.id!==d.id);save();topSheetClose();go(view);toast('Excluído')}};
}

/* seletores */
function pickCliente(cb){
  const el=sheet('Escolher cliente',`<div class="stack"><input id="pq" type="search" placeholder="Buscar cliente"><button class="btn ghost" id="pNew">${ic('plus')}Novo cliente</button><div class="list" id="pl"></div></div>`);
  const r=()=>{const q=$('#pq',el).value.toLowerCase();const cs=S.clientes.filter(c=>!q||c.nome.toLowerCase().includes(q)||(c.tel||'').includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#pl',el).innerHTML=cs.length?cs.map(c=>`<button class="li" data-c="${c.id}"><span class="avatar">${initials(c.nome)}</span><div class="grow"><div class="t">${esc(c.nome)}</div><div class="s">${esc(c.tel||'')}</div></div></button>`).join(''):'<div class="empty" style="border:0">Nenhum cliente encontrado.</div>';
    $$('[data-c]',el).forEach(b=>b.onclick=()=>{topSheetClose();cb(b.dataset.c)})};
  $('#pq',el).oninput=r;r();

}

function pdfNome(d){const c=cli(d.clienteId);return `${TIPOS[d.tipo].n}-${docNum(d)}${c?'-'+c.nome:''}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_')+'.pdf'}
async function pdfAcao(d,modo){
  let pdf;try{pdf=await gerarPdf(d)}catch(err){toast(err.message||'Não consegui gerar o PDF');return}
  const blob=pdf.output('blob');const nome=pdfNome(d);const file=new File([blob],nome,{type:'application/pdf'});
  if(modo==='share'){try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});if(d.tipo==='ORC'&&d.status==='Rascunho'){d.status='Enviado';save()}return}}catch(e){if(e.name==='AbortError')return}
    toast('Este navegador não compartilha arquivos. Baixando o PDF.');modo='download'}
  const url=URL.createObjectURL(blob);
  if(modo==='download'){const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return}
  const el=sheet(nome,`<div class="preview stack"><iframe src="${url}" title="Prévia do PDF"></iframe><a class="btn ghost" href="${url}" target="_blank" rel="noopener">${ic('eye')}Abrir em tela cheia</a></div>`);
}

  const el=sheet('Importar catálogo',`<div class="stack"><div class="card stack"><b>Planilha CSV</b><div class="muted" style="font-size:14px">Colunas aceitas, nesta ordem: <span class="num">tipo;nome;unidade;preco;custo;categoria</span>. Em “tipo” use <i>item</i>/<i>produto</i> ou <i>serviço</i>. Separador ponto e vírgula ou vírgula. A primeira linha pode ser o cabeçalho.</div>
    <label class="btn">${ic('up')}Escolher arquivo CSV<input type="file" id="kcsv" accept=".csv,text/csv,text/plain" hidden></label><div id="kres" class="muted"></div></div>
    <div class="card stack"><b>Exportar</b><button class="btn ghost" id="kexp">${ic('dl')}Baixar catálogo em CSV</button></div></div>`);
  $('#kcsv',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;let txt=await f.text();txt=txt.replace(/^\uFEFF/,'');const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
    const rows=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())});
    if(rows.length&&/nome|descri/i.test(rows[0].join(' ')))rows.shift();
    const ex=new Set(S.catalogo.map(c=>c.nome.toLowerCase()));let add=0,dup=0;
    rows.forEach(r=>{let[tipo,nome,un,preco,custo,cat]=r;if(r.length===2){nome=r[0];preco=r[1];tipo='item'}if(!nome)return;if(ex.has(nome.toLowerCase())){dup++;return}ex.add(nome.toLowerCase());
      S.catalogo.push({id:uid(),nome,tipo:/serv/i.test(tipo||'')?'s':'i',un:un||'un',preco:num(preco),custo:num(custo),cat:cat||'',desc:'',foto:''});add++});
    save();$('#kres',el).textContent=`${add} itens importados${dup?`, ${dup} já existiam e ficaram como estavam`:''}.`;toast(add+' itens importados')};
  $('#kexp',el).onclick=()=>{const l=['tipo;nome;unidade;preco;custo;categoria',...S.catalogo.map(c=>[c.tipo==='s'?'serviço':'item',c.nome,c.un,fnum(c.preco),fnum(c.custo),c.cat].map(v=>String(v).includes(';')?`"${v}"`:v).join(';'))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+l],{type:'text/csv'}));a.download='catalogo.csv';a.click()};
}

let finF={mes:today().slice(0,7),v:'mes'};
function vFin(m){

  lista.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const mesL=S.fin.filter(f=>f.data&&f.data.startsWith(ym));
  const ent=mesL.filter(f=>f.tipo==='E'&&f.pago).reduce((a,f)=>a+num(f.valor),0),sai=mesL.filter(f=>f.tipo==='S'&&f.pago).reduce((a,f)=>a+num(f.valor),0);
  const rec=S.fin.filter(f=>f.tipo==='E'&&!f.pago).reduce((a,f)=>a+num(f.valor),0),pag=S.fin.filter(f=>f.tipo==='S'&&!f.pago).reduce((a,f)=>a+num(f.valor),0);

  const mx=Math.max(1,...meses.map(x=>Math.max(x.e,x.s)));
  m.innerHTML=`<header class="top"><button class="icon" id="fBack" aria-label="Voltar">${ic('back')}</button><h1>Financeiro</h1></header>
  <div class="row" style="margin-bottom:10px"><button class="icon" id="fP" aria-label="Mês anterior">${ic('back')}</button><b class="grow" style="text-align:center;text-transform:capitalize">${MESES[mo-1]} ${y}</b><button class="icon" id="fN" aria-label="Próximo mês">${ic('back','style="transform:scaleX(-1)"')}</button></div>
  <div class="kpis"><div class="kpi inv"><span class="eyebrow">Saldo do mês</span><b>${money(ent-sai)}</b></div><div class="kpi"><span class="eyebrow">Entradas pagas</span><b>${money(ent)}</b></div><div class="kpi"><span class="eyebrow">Saídas pagas</span><b>${money(sai)}</b></div><div class="kpi"><span class="eyebrow">A receber · a pagar</span><b style="font-size:16px">${money(rec)} · ${money(pag)}</b></div></div>
  <div class="card" style="margin-top:12px"><div class="row"><span class="eyebrow grow">Últimos 6 meses</span><span class="muted" style="font-size:12px">■ entradas &nbsp;▨ saídas</span></div>
    <div class="bars">${meses.map(x=>`<div class="b"><div class="pair"><span class="in" style="height:${x.e/mx*100}%" title="Entradas ${money(x.e)}"></span><span class="outb" style="height:${x.s/mx*100}%" title="Saídas ${money(x.s)}"></span></div><span style="${x.k===ym?'color:var(--ink);font-weight:800':''}">${x.lb}</span></div>`).join('')}</div></div>
  <div class="chips" style="margin:14px 0 10px"><button class="chip ${finF.v==='mes'?'on':''}" data-fv="mes">Lançamentos do mês</button><button class="chip ${finF.v==='rec'?'on':''}" data-fv="rec">A receber</button><button class="chip ${finF.v==='pag'?'on':''}" data-fv="pag">A pagar</button></div>
  ${lista.length?`<div class="list">${lista.map(f=>{const atras=!f.pago&&f.data<today();return`<button class="li" data-f="${f.id}"><span class="avatar" style="${f.tipo==='E'?'background:var(--hl);color:var(--hl-ink)':''}">${f.tipo==='E'?'+':'−'}</span><div class="grow"><div class="t">${esc(f.desc)}</div><div class="s">${fdate(f.data)}${f.cat?' · '+esc(f.cat):''}${f.pago?'':atras?' · <b style="color:var(--ink)">atrasado</b>':' · pendente'}</div></div><b class="tab" style="${f.pago?'':'opacity:.6'}">${f.tipo==='S'?'− ':''}${money(f.valor)}</b></button>`}).join('')}</div>`:`<div class="empty">Nada aqui. Toque em + para lançar uma entrada ou saída.</div>`}`;
  $('#fBack',m).onclick=()=>go('mais');

  $$('[data-fv]',m).forEach(b=>b.onclick=()=>{finF.v=b.dataset.fv;vFin(m)});
  $$('[data-f]',m).forEach(b=>b.onclick=()=>editFin(S.fin.find(f=>f.id===b.dataset.f)));
}

  const cats=[...new Set(['Serviços','Vendas','Recebimentos','Material','Transporte','Ferramentas','Impostos','Aluguel','Salários','Outros',...S.fin.map(x=>x.cat).filter(Boolean)])];

function relatorios(){
  const ano=new Date().getFullYear()+'';
  const orc=S.docs.filter(d=>d.tipo==='ORC'&&(d.data||'').startsWith(ano));const ap=orc.filter(d=>d.status==='Aprovado');
  const porCli={};S.docs.filter(d=>['Aprovado','Concluída','Entregue','Faturado'].includes(d.status)).forEach(d=>{const c=cli(d.clienteId);const k=c?c.nome:'Sem cliente';porCli[k]=(porCli[k]||0)+totals(d).total});
  const porItem={};S.docs.filter(d=>['Aprovado','Concluída','Entregue','Faturado'].includes(d.status)).forEach(d=>(d.itens||[]).forEach(i=>{porItem[i.nome]=porItem[i.nome]||{q:0,v:0};porItem[i.nome].q+=num(i.qtd);porItem[i.nome].v+=num(i.qtd)*num(i.preco)}));
  const topC=Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,5);const topI=Object.entries(porItem).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const mxC=Math.max(1,...topC.map(x=>x[1]));
  const custo=S.docs.filter(d=>d.status==='Aprovado'||d.status==='Concluída').reduce((a,d)=>a+(d.itens||[]).reduce((s,i)=>s+num(i.qtd)*num(i.custo),0),0);
  const venda=S.docs.filter(d=>d.status==='Aprovado'||d.status==='Concluída').reduce((a,d)=>a+totals(d).total,0);
  sheet('Relatórios '+ano,`<div class="stack">
    <div class="kpis"><div class="kpi"><span class="eyebrow">Orçamentos no ano</span><b>${orc.length}</b></div><div class="kpi"><span class="eyebrow">Taxa de aprovação</span><b>${orc.length?Math.round(ap.length/orc.length*100):0}%</b></div>
    <div class="kpi"><span class="eyebrow">Ticket médio aprovado</span><b>${money(ap.length?ap.reduce((a,d)=>a+totals(d).total,0)/ap.length:0)}</b></div><div class="kpi inv"><span class="eyebrow">Lucro estimado</span><b>${money(venda-custo)}</b><span style="font-size:12px;opacity:.7">venda menos custo dos itens</span></div></div>
    <div class="card stack"><span class="eyebrow">Clientes que mais compraram</span>${topC.length?topC.map(([n,v])=>`<div><div class="row"><span class="grow" style="font-weight:600">${esc(n)}</span><b class="tab">${money(v)}</b></div><div style="height:6px;background:var(--soft);border-radius:9px;margin-top:4px"><div style="height:100%;width:${v/mxC*100}%;background:var(--ink);border-radius:9px"></div></div></div>`).join(''):'<span class="muted">Sem vendas fechadas ainda.</span>'}</div>
    <div class="card stack"><span class="eyebrow">Itens e serviços que mais faturaram</span>${topI.length?topI.map(([n,o])=>`<div class="row"><span class="grow">${esc(n)}</span><span class="muted tab">${fnum(o.q,o.q%1?2:0)}×</span><b class="tab">${money(o.v)}</b></div>`).join(''):'<span class="muted">Sem dados.</span>'}</div></div>`);
}

  ['clientes','catalogo','agenda','fin'].forEach(k=>{const ids=new Set(r[k].map(i=>i.id));(local[k]||[]).filter(i=>!i.demo&&!ids.has(i.id)).forEach(i=>r[k].push(i))});

  const ids=new Set(r.docs.map(d=>d.id));
  (local.docs||[]).filter(d=>!d.demo&&!ids.has(d.id)).forEach(d=>{const pf=r.perfis.find(p=>p.id===d.perfilId)||r.perfis.find(p=>p.id===r.perfilId);d.perfilId=pf.id;d.num=pf.seq[d.tipo]++;r.docs.push(d)});
  r.updatedAt=Date.now();return r}

function novoCodigo(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>a[x%a.length]).join('');return `ORC-${r(4)}-${r(4)}`}

    <p class="muted" style="margin:0">Sua conta <b style="color:var(--ink)">${esc(Cloud.user.email)}</b> foi recebida. Assim que ela for liberada, o app abre aqui sozinho.</p></div>
    <button class="btn block" id="gChk">${ic('check')}Verificar agora</button>
    <form class="card stack" id="gV"><div class="eyebrow">Recebeu um voucher?</div><input id="gCod" placeholder="ORC-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;font-family:var(--f-mono)"><div id="gVErr" class="muted" role="alert"></div><button class="btn ghost block" type="submit">Ativar com voucher</button></form>
    <button class="btn ghost sm" id="gOut" style="align-self:center">Sair e entrar com outra conta</button></div>`;
  const chk=async btn=>{if(btn)btn.textContent='Verificando…';await Cloud.checarLicenca();if(!ativo()&&btn){btn.innerHTML=ic('check')+'Verificar agora';toast('Ainda aguardando liberação.')}};
  $('#gChk',g).onclick=e=>chk(e.currentTarget);
  $('#gV',g).onsubmit=async e=>{e.preventDefault();const er=$('#gVErr',g);er.textContent='Ativando…';try{await Cloud.resgatar($('#gCod',g).value);gate()}catch(x){er.textContent=x.message}};
  $('#gOut',g).onclick=async()=>{if(await ask('Sair desta conta?',{ok:'Sair'})){Cloud.sair();S=blank();save(false);gate()}};
  gateTimer=setInterval(()=>{if(document.visibilityState==='visible')chk(null)},15000);
}
// Administrador: mostra em Mais quantas contas aguardam liberação.
async function contarAguardando(){if(!Cloud.admin)return;try{const[us,ls]=await Promise.all([Cloud.get('usuarios'),Cloud.get('licencas')]);
  const n=Object.keys(us||{}).filter(id=>id!==Cloud.user.uid&&!((ls||{})[id]&&ls[id].ativo)).length;const el=$('#mAdmS');if(el)el.innerHTML=n?`<b style="color:var(--ink)">${n} ${n===1?'conta aguardando':'contas aguardando'} liberação</b>`:'Nenhuma conta aguardando';}catch(e){}}

/* ======================= início ======================= */
function boot(){
  load();applyTema();shell();
  try{history.replaceState({base:1},'')}catch(e){}guarda();
  if(S.demo){S=blank();save(false)}
  gate();
  go(view);
  try{const nv=new URLSearchParams(location.search).get('novo');if(nv&&TIPOS[nv]){prefs.set('visto',true);$$('#layer .sheet').forEach(x=>x.remove());novoDoc(nv)}}catch(e){}
  if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  setInterval(checkLembretes,60000);setTimeout(checkLembretes,3000);
  if(Cloud.user){Cloud.registrar();Cloud.sync()}
  window.addEventListener('online',()=>Cloud.push());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Cloud.user)Cloud.sync()});
}
boot();
</script>
