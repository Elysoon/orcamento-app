<title>Orçamento App</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: app de uma coluna, barra inferior fixa; tudo em tinta sobre papel, sem cor de marca */
:root{
  --paper:#f4f4f2; --surface:#ffffff; --ink:#151515; --ink2:#3a3a38; --muted:#6c6c68; --line:#deded9; --soft:#ececE8;
  --hl:#151515; --hl-ink:#ffffff;
  --f-display:"Schibsted Grotesk",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --nav:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111111; --surface:#1a1a19; --ink:#f0f0ec; --ink2:#cfcfca; --muted:#9a9a94; --line:#2d2d2b; --soft:#232322; --hl:#f0f0ec; --hl-ink:#111111; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111111; --surface:#1a1a19; --ink:#f0f0ec; --ink2:#cfcfca; --muted:#9a9a94; --line:#2d2d2b; --soft:#232322; --hl:#f0f0ec; --hl-ink:#111111; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;flex:1;min-width:0;text-wrap:balance}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li:active{background:var(--soft)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--ink);border:1px dashed var(--muted)}
.btn:focus-visible,.li:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg,.btn svg,.nav svg,.li svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
/* estado do documento sem cor: forma e preenchimento */
.st{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--ink2)}
.st.s-full{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.st.s-out{background:transparent;color:var(--ink)}
.st.s-dash{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.st.s-x{text-decoration:line-through;color:var(--muted);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.inv{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.kpi.inv .eyebrow{color:inherit;opacity:.7}
h2{font-family:var(--f-display);font-size:17px;margin:20px 0 8px;letter-spacing:-.01em}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.nav button{background:none;border:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
nav.nav button.on{color:var(--ink)}
nav.nav button.on svg{stroke-width:2.4}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:18px;background:var(--hl);color:var(--hl-ink);border:0;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
/* folhas (telas sobrepostas) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;animation:up .18s ease-out}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .bar h3{flex:1;margin:0;font-family:var(--f-display);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(40px + env(safe-area-inset-bottom,0px))}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg .box{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom,0px));background:var(--hl);color:var(--hl-ink);padding:10px 16px;border-radius:999px;z-index:80;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface)}
.line .lh{display:flex;gap:8px;align-items:flex-start}
.line .lh input{font-weight:600}
.line .lf{display:grid;grid-template-columns:70px 64px 1fr auto;gap:6px;align-items:center}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.tot.big{font-family:var(--f-display);font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb-x{position:relative}
.thumb-x button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:999px;border:0;background:var(--hl);color:var(--hl-ink);font-weight:800;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{border-color:var(--ink)}
.cal button.sel{background:var(--hl);color:var(--hl-ink)}
.cal button i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:9px;background:currentColor}
.sig{width:100%;height:200px;border:1px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.banner{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars .b span{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0}
.bars .in{background:var(--ink)}
.bars .outb{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 6px);border:1px solid var(--muted)}
.pair{display:flex;gap:4px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px}
.logo-mark{width:64px;height:64px;border-radius:18px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px}
.gate{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px}.seg button{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:700;color:var(--muted);cursor:pointer;min-height:42px}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.preview iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
</style>

<div id="app"></div>
<div id="layer"></div>

const ic=(n,a='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" ${a}>${I[n]||''}</svg>`;

/* ======================= utilitários ======================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

const fnum=(v,d=2)=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

const money=v=>{const m=S.empresa.moeda||'R$';try{return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:MOEDAS[m]||'BRL'})}catch(e){return m+' '+fnum(v)}};

const initials=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* valor por extenso (reais) */
function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(n===0)return'';if(n===100)return'cem';const p=[];const C=Math.floor(n/100),r=n%100;if(C)p.push(c[C]);if(r){if(r<20)p.push(u[r]);else{const D=Math.floor(r/10),U=r%10;p.push(U?d[D]+' e '+u[U]:d[D])}}return p.join(' e ')};
  const inteiro=n=>{if(n===0)return'zero';const grupos=[['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];const parts=[];let i=0,lastSmall=false;
    while(n>0){const g=n%1000;if(g){let t=ate999(g);if(i===1)t=g===1?'mil':t+' mil';else if(i>1)t=t+' '+(g===1?grupos[i][0]:grupos[i][1]);parts.unshift({t,g,i})}n=Math.floor(n/1000);i++}
    let out='';parts.forEach((p,k)=>{if(k===0)out=p.t;else{const lastG=p.g;out+=((p.i===0&&(lastG<100||lastG%100===0))?' e ':(p.i===0?', ':' e '))+p.t}});return out};
  v=Math.round(Math.abs(v)*100);const r=Math.floor(v/100),ce=v%100;let s='';
  if(r){s=inteiro(r)+(r===1?' real':(r%1000000===0?' de reais':' reais'))}
  if(ce){s+=(s?' e ':'')+ate999(ce)+(ce===1?' centavo':' centavos')}
  return s||'zero reais';
}

  $$('[data-fs]',m).forEach(b=>b.onclick=()=>{filtro.st=b.dataset.fs;vDocs(m)});

  bindRows(m);
}

        ${it.desc||it._showDesc?`<textarea data-i="${i}" data-k="desc" placeholder="Detalhes do item" style="min-height:50px">${esc(it.desc)}</textarea>`:`<button class="chip" data-showdesc="${i}" style="justify-self:start">+ detalhes</button>`}</div>`).join(''):`<div class="empty" style="padding:12px">Nenhum ${tp==='s'?'serviço':'produto'}.</div>`}`};

      </div>
      ${tipo==='OS'?`<div class="card stack"><span class="eyebrow">Atendimento</span><label class="f">Equipamento / local<input id="fEq" value="${esc(d.equipamento)}"></label><label class="f">Problema relatado<textarea id="fDef">${esc(d.defeito)}</textarea></label><label class="f">Laudo técnico / serviço executado<textarea id="fLaudo">${esc(d.laudo)}</textarea></label></div>`:''}

  };
  const totHtml=t=>`${S.empresa.separar?`<div class="tot"><span class="muted">Produtos</span><span>${money(t.prod)}</span></div><div class="tot"><span class="muted">Serviços</span><span>${money(t.serv)}</span></div>`:`<div class="tot"><span class="muted">Subtotal</span><span>${money(t.sub)}</span></div>`}
    ${t.desc?`<div class="tot"><span class="muted">Desconto</span><span>− ${money(t.desc)}</span></div>`:''}${t.acr?`<div class="tot"><span class="muted">Acréscimo</span><span>${money(t.acr)}</span></div>`:''}<div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>`;
  const refreshTot=()=>{const x=$('#fTot',body);if(x)x.innerHTML=totHtml(totals(d))};
  const collect=()=>{const v=id=>{const e=$('#'+id,body);return e?e.value:undefined};
    if(v('fData')!==undefined)d.data=v('fData');if(v('fVal')!==undefined)d.validade=v('fVal');if(v('fSt')!==undefined)d.status=v('fSt');
    ['fEq:equipamento','fDef:defeito','fLaudo:laudo','fRef:referente','fForma:forma','fTxt:texto','fPag:pagamento','fPrazo:prazo','fGar:garantia','fObs:obs'].forEach(p=>{const[a,b]=p.split(':');const x=v(a);if(x!==undefined)d[b]=x});
    if(v('fValor')!==undefined)d.valor=num(v('fValor'));if(v('fDesc')!==undefined)d.desconto=num(v('fDesc'));if(v('fDescT')!==undefined)d.descTipo=v('fDescT');if(v('fAcr')!==undefined)d.acrescimo=num(v('fAcr'));

  function bindEd(){

    const fv=$('#fValor',body);if(fv)fv.oninput=()=>{$('#fExt',body).textContent=extenso(num(fv.value))};

  }
  $('#dSave',el).onclick=()=>{
    collect();d.itens=d.itens.filter(i=>i.nome.trim()).map(i=>{delete i._showDesc;return i});
    if(!d.num&&!podeCriar())return;
    if(!d.num)d.num=S.seq[tipo]++;
    const lancar=tipo==='REC'&&d._lancar!==false&&isNew;delete d._lancar;

    save();topSheetClose();toast(T.n+' salvo');go(view);

/* seletores */
function pickCliente(cb){
  const el=sheet('Escolher cliente',`<div class="stack"><input id="pq" type="search" placeholder="Buscar cliente"><button class="btn ghost" id="pNew">${ic('plus')}Novo cliente</button><div class="list" id="pl"></div></div>`);
  const r=()=>{const q=$('#pq',el).value.toLowerCase();const cs=S.clientes.filter(c=>!q||c.nome.toLowerCase().includes(q)||(c.tel||'').includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#pl',el).innerHTML=cs.length?cs.map(c=>`<button class="li" data-c="${c.id}"><span class="avatar">${initials(c.nome)}</span><div class="grow"><div class="t">${esc(c.nome)}</div><div class="s">${esc(c.tel||'')}</div></div></button>`).join(''):'<div class="empty" style="border:0">Nenhum cliente encontrado.</div>';
    $$('[data-c]',el).forEach(b=>b.onclick=()=>{topSheetClose();cb(b.dataset.c)})};
  $('#pq',el).oninput=r;r();
  $('#pNew',el).onclick=()=>{topSheetClose();editCliente(null,id=>cb(id))};
}
function pickCatalogo(tipo,cb){

  const cv=$('#sg',d);const r=cv.getBoundingClientRect();const k=window.devicePixelRatio||1;cv.width=r.width*k;cv.height=r.height*k;const g=cv.getContext('2d');g.scale(k,k);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  let dw=false,used=false,last;const P=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{dw=true;used=true;last=P(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dw)return;const p=P(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p};cv.onpointerup=()=>dw=false;

}
function trimCanvas(cv){const g=cv.getContext('2d');const{width:w,height:h}=cv;const px=g.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){if(px[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}}
  if(x1<=x0)return cv.toDataURL();const o=document.createElement('canvas');o.width=x1-x0+12;o.height=y1-y0+12;o.getContext('2d').drawImage(cv,x0-6,y0-6,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}
function resizeImg(file,max,q){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);res({src:c.toDataURL('image/jpeg',q),w,h})};im.onerror=()=>res({src:'',w:0,h:0});im.src=fr.result};fr.readAsDataURL(file)})}

    <div class="bars">${meses.map(x=>`<div class="b"><div class="pair"><span class="in" style="height:${x.e/mx*100}%" title="Entradas ${money(x.e)}"></span><span class="outb" style="height:${x.s/mx*100}%" title="Saídas ${money(x.s)}"></span></div><span style="${x.k===ym?'color:var(--ink);font-weight:800':''}">${x.lb}</span></div>`).join('')}</div></div>

function juntar(nuvem,local){const r=normalizar(nuvem);
  ['clientes','catalogo','agenda','fin'].forEach(k=>{const ids=new Set(r[k].map(i=>i.id));(local[k]||[]).filter(i=>!i.demo&&!ids.has(i.id)).forEach(i=>r[k].push(i))});
  const ids=new Set(r.docs.map(d=>d.id));Object.keys(r.seq).forEach(t=>{r.seq[t]=Math.max(r.seq[t],...r.docs.filter(d=>d.tipo===t).map(d=>(d.num||0)+1),1)});
  (local.docs||[]).filter(d=>!d.demo&&!ids.has(d.id)).forEach(d=>{d.num=r.seq[d.tipo]++;r.docs.push(d)});
  if(!r.empresa.nome||r.empresa.nome==='Sua Empresa')r.empresa=Object.assign({},local.empresa);
  r.updatedAt=Date.now();return r}

    const adms={[Cloud.user.uid]:true};
    body.innerHTML=`<div class="stack"><div class="muted" style="font-size:13px">Você está logado como <b style="color:var(--ink)">${esc(Cloud.user.email)}</b></div><div class="kpis"><div class="kpi"><span class="eyebrow">Aguardando</span><b>${ul.filter(([id])=>adms[id]!==true&&!(ls[id]&&ls[id].ativo)).length}</b></div><div class="kpi inv"><span class="eyebrow">Liberadas</span><b>${Object.entries(ls).filter(([k,l])=>l&&l.ativo&&adms[k]!==true).length}</b></div></div>
      <div class="chips"><button class="chip ${aba==='v'?'on':''}" data-ab="v">Vouchers (${livres} livres)</button><button class="chip ${aba==='u'?'on':''}" data-ab="u">Contas</button><button class="chip ${aba==='a'?'on':''}" data-ab="a">Link de afiliado</button></div>
      ${aba==='a'?`<div class="card stack"><div class="muted" style="font-size:14px">Cada afiliado cadastrado no ESM Pay tem um código (aparece em Afiliados). Quem instalar pelo link dele e pagar gera comissão para ele automaticamente.</div>
        <label class="f">Código do afiliado no ESM Pay<input id="afCod" placeholder="ex.: carlos" autocapitalize="none"></label><div id="afOut" class="num" style="font-size:13px;word-break:break-all"></div>
        <div class="g2"><button class="btn ghost" id="afCp">${ic('copy')}Copiar link</button><button class="btn ghost" id="afWa">${ic('wa')}Enviar</button></div></div>`
      :aba==='v'?`<div class="card stack"><div class="row"><label class="f grow">Quantidade<select id="adQ">${[1,5,10,20].map(n=>`<option>${n}</option>`).join('')}</select></label><label class="f grow">Anotação<input id="adN" placeholder="Ex.: cliente João"></label></div><button class="btn" id="adGen">${ic('plus')}Gerar vouchers</button></div>
        ${vl.length?`<div class="list">${vl.map(([c,v])=>{const quem=v.usadoPor?(us[v.usadoPor]&&us[v.usadoPor].email)||'conta '+v.usadoPor.slice(0,6):'';return`<div class="li" style="cursor:default"><div class="grow"><div class="t num" style="${v.usadoPor?'text-decoration:line-through;color:var(--muted)':''}">${esc(c)}</div><div class="s">${v.usadoPor?'Usado por '+esc(quem):'Livre'}${v.nota?' · '+esc(v.nota):''}</div></div>${v.usadoPor?'':`<button class="icon" data-cp="${esc(c)}" aria-label="Copiar">${ic('copy')}</button><a class="icon" href="https://wa.me/?text=${encodeURIComponent('Seu código para ativar o app Orçamento: '+c+'\nAbra https://orcamento-rapido.pages.dev/ → Mais → Conta e nuvem → Ativar acesso completo.')}" target="_blank" rel="noopener" aria-label="Enviar no WhatsApp">${ic('wa')}</a>`}</div>`}).join('')}</div>`:'<div class="empty">Nenhum voucher ainda.</div>'}`
      :`${ul.length?`<div class="list">${ul.map(([id,u])=>{const l=ls[id];const on=l&&l.ativo;const adm=adms[id]===true;const eu=id===Cloud.user.uid;if(adm)return`<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(u.email||id)}${eu?' (você)':''}</div><div class="s">Administrador · acesso completo</div></div></div>`;return`<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(u.email||id)}${eu?' (você)':''}</div><div class="s">${on?'Liberado · '+esc({manual:'por você',voucher:'por voucher',pagamento:'por pagamento'}[l.origem]||l.origem||''):'Aguardando liberação'}${u.ultimoAcesso?' · '+new Date(u.ultimoAcesso).toLocaleDateString('pt-BR'):''}</div></div><button class="btn sm ${on?'ghost':''}" data-tg="${id}" data-on="${on?1:0}">${on?'Desativar':'Liberar'}</button></div>`}).join('')}</div>`:'<div class="empty">Nenhuma conta ainda.</div>'}`}</div>`;
    $$('[data-ab]',body).forEach(b=>b.onclick=()=>{aba=b.dataset.ab;render()});
    $$('[data-cp]',body).forEach(b=>b.onclick=()=>copiar(b.dataset.cp));
    const afc=$('#afCod',body);if(afc){const link=()=>'https://orcamento-rapido.pages.dev/?af='+encodeURIComponent(afc.value.trim().toLowerCase());
      afc.oninput=()=>{$('#afOut',body).textContent=afc.value.trim()?link():''};
      $('#afCp',body).onclick=()=>{if(afc.value.trim())copiar(link())};
      $('#afWa',body).onclick=()=>{if(afc.value.trim())window.open('https://wa.me/?text='+encodeURIComponent('Conheça o app Orçamento: orçamentos, OS, recibos e contratos em PDF direto do celular. '+link()),'_blank')}}
    const g=$('#adGen',body);if(g)g.onclick=async()=>{g.disabled=true;const q=+$('#adQ',body).value,nota=$('#adN',body).value.trim();const up={};for(let i=0;i<q;i++)up[novoCodigo()]={criado:{'.sv':'timestamp'},por:Cloud.user.uid,...(nota?{nota}:{})};
      try{await Cloud.put('vouchers',up,'PATCH');toast(q+' voucher(s) gerado(s)')}catch(e){toast(e.message)}render()};
    $$('[data-tg]',body).forEach(b=>b.onclick=async()=>{const id=b.dataset.tg,on=b.dataset.on==='1';b.disabled=true;b.textContent=on?'Desativando…':'Liberando…';
      try{await Cloud.put('licencas/'+id,on?{ativo:false,desativadoEm:{'.sv':'timestamp'}}:{ativo:true,origem:'manual',email:(us[id]||{}).email||'',em:{'.sv':'timestamp'}},on?'PATCH':'PUT');toast(on?'Conta desativada':'Conta liberada')}catch(e){toast(e.message)}render()});
  };
  render();
}

/* ======================= INSTALAÇÃO ======================= */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='home')go('home')});
function installBanner(){if(isStandalone()||prefs.get('hideInst',false))return'';if(!deferredInstall&&!isIOS())return'';return`<div class="banner"><span class="icon" style="border:0">${ic('install')}</span><div class="grow"><b>Instale no seu celular</b><div class="muted" style="font-size:13px">Abre como aplicativo e funciona sem internet.</div></div><button class="btn sm" id="bInst">Instalar</button><button class="icon" id="bInstX" aria-label="Fechar aviso" style="width:32px;height:32px">${ic('x')}</button></div>`}
function bindInstall(m){const b=$('#bInst',m);if(b)b.onclick=()=>installSheet();const x=$('#bInstX',m);if(x)x.onclick=()=>{prefs.set('hideInst',true);go(view)}}
async function installSheet(){
  if(deferredInstall){deferredInstall.prompt();const r=await deferredInstall.userChoice;deferredInstall=null;if(r.outcome==='accepted')toast('Instalado');go(view);return}
  sheet('Instalar no celular',`<div class="stack">${isStandalone()?'<div class="card"><b>O app já está instalado.</b></div>':''}
    <div class="card stack"><b>Android (Chrome)</b><ol style="margin:0;padding-left:20px;line-height:1.7"><li>Abra o link do app no Chrome.</li><li>Toque nos três pontinhos ⋮ no canto de cima.</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme. O ícone aparece junto dos seus apps.</li></ol></div>
    <div class="card stack"><b>iPhone (Safari)</b><ol style="margin:0;padding-left:20px;line-height:1.7"><li>Abra o link do app no <b>Safari</b>.</li><li>Toque no botão Compartilhar (quadrado com seta para cima).</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol><div class="muted" style="font-size:13px">No iPhone com iOS 16.4 ou mais novo também dá para usar o Chrome: Compartilhar → Adicionar à Tela de Início.</div></div>
    <div class="card stack"><b>Computador</b><div class="muted">No Chrome ou Edge, clique no ícone de instalar na barra de endereço.</div></div></div>`);
}

/* ======================= porta de entrada ======================= */
// Sem conta: tela de Entrar / Criar conta. Com conta ainda não liberada: tela de espera.
let gateTimer=null;
function gate(){
  const old=$('#gate');const precisa=!Cloud.user?'login':!ativo()?'espera':null;
  if(!precisa){if(old){old.remove();clearInterval(gateTimer);gateTimer=null}return}
  if(old&&old.dataset.v===precisa)return;
  if(old)old.remove();clearInterval(gateTimer);gateTimer=null;
  const g=document.createElement('div');g.id='gate';g.className='gate';g.dataset.v=precisa;document.body.appendChild(g);
  if(precisa==='login')gateLogin(g);else gateEspera(g);
}
function gateLogin(g){
  g.innerHTML=`<div class="login">
    <div class="row"><div class="logo-mark" style="width:52px;height:52px;font-size:24px">O</div><div><div class="eyebrow">Orçamento</div><b style="font-family:var(--f-display);font-size:20px">Orçamentos e recibos em PDF</b></div></div>
    <div class="seg" role="tablist"><button type="button" role="tab" class="on" data-aba="entrar">Entrar</button><button type="button" role="tab" data-aba="criar">Criar conta</button></div>
    <form class="card stack" id="gL"><div><b style="font-size:17px">Já tenho conta</b><div class="muted" style="font-size:14px">Entre com o e-mail e a senha que você cadastrou.</div></div>
      <label class="f">E-mail<input id="gLE" type="email" required autocomplete="email" inputmode="email"></label>
      <label class="f">Senha<input id="gLS" type="password" required minlength="6" autocomplete="current-password"></label>
      <div id="gLErr" class="muted" role="alert"></div>
      <button class="btn block" type="submit">Entrar</button>
      <button class="btn ghost sm" type="button" id="gLRes" style="align-self:center">Esqueci minha senha</button></form>
    <form class="card stack" id="gC" hidden><div><b style="font-size:17px">Criar uma conta nova</b><div class="muted" style="font-size:14px">Depois de criar, sua conta passa por uma liberação rápida antes do primeiro uso.</div></div>
      <label class="f">E-mail<input id="gCE" type="email" required autocomplete="email" inputmode="email"></label>
      <label class="f">Senha (mínimo 6 caracteres)<input id="gCS" type="password" required minlength="6" autocomplete="new-password"></label>
      <label class="f">Repita a senha<input id="gCS2" type="password" required minlength="6" autocomplete="new-password"></label>
      <div id="gCErr" class="muted" role="alert"></div>
      <button class="btn block" type="submit">Criar conta</button></form></div>`;
  const abas=$$('[data-aba]',g);
  abas.forEach(b=>b.onclick=()=>{const c=b.dataset.aba==='criar';abas.forEach(x=>x.classList.toggle('on',x===b));$('#gL',g).hidden=c;$('#gC',g).hidden=!c;
    const de=c?$('#gLE',g):$('#gCE',g),para=c?$('#gCE',g):$('#gLE',g);if(!para.value)para.value=de.value;para.focus()});
  const lerr=m=>$('#gLErr',g).textContent=m,cerr=m=>$('#gCErr',g).textContent=m;
  $('#gL',g).onsubmit=async e=>{e.preventDefault();lerr('Entrando…');try{await Cloud.entrar($('#gLE',g).value.trim(),$('#gLS',g).value);await Cloud.checarLicenca();gate();go('home')}catch(x){lerr(x.message)}};
  $('#gLRes',g).onclick=async()=>{const em=$('#gLE',g).value.trim();if(!em){lerr('Digite seu e-mail no campo acima e toque de novo em "Esqueci minha senha".');return}try{await Cloud.reset(em);lerr('Enviamos um link para '+em+' para criar uma senha nova.')}catch(x){lerr(x.message)}};
  $('#gC',g).onsubmit=async e=>{e.preventDefault();const em=$('#gCE',g).value.trim(),s1=$('#gCS',g).value,s2=$('#gCS2',g).value;
    if(s1.length<6){cerr('A senha precisa ter pelo menos 6 caracteres.');return}if(s1!==s2){cerr('As duas senhas não estão iguais.');return}
    cerr('Criando conta…');try{await Cloud.criar(em,s1);await Cloud.checarLicenca();gate();go('home')}catch(x){cerr(x.message)}};
}
function gateEspera(g){
  g.innerHTML=`<div class="login">
    <div class="logo-mark" style="width:52px;height:52px;font-size:24px">O</div>
    <div><div class="eyebrow">Conta criada</div><h1 style="font-family:var(--f-display);font-size:28px;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance">Aguardando liberação</h1>
    <p class="muted" style="margin:0">Sua conta <b style="color:var(--ink)">${esc(Cloud.user.email)}</b> foi recebida. Assim que ela for liberada, o app abre aqui sozinho.</p></div>
    <button class="btn block" id="gChk">${ic('check')}Verificar agora</button>
    <form class="card stack" id="gV"><div class="eyebrow">Recebeu um voucher?</div><input id="gCod" placeholder="ORC-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;font-family:var(--f-mono)"><div id="gVErr" class="muted" role="alert"></div><button class="btn ghost block" type="submit">Ativar com voucher</button></form>
    <button class="btn ghost sm" id="gOut" style="align-self:center">Sair e entrar com outra conta</button></div>`;
  const chk=async btn=>{if(btn)btn.textContent='Verificando…';await Cloud.checarLicenca();if(!ativo()&&btn){btn.innerHTML=ic('check')+'Verificar agora';toast('Ainda aguardando liberação.')}};
  $('#gChk',g).onclick=e=>chk(e.currentTarget);
  $('#gV',g).onsubmit=async e=>{e.preventDefault();const er=$('#gVErr',g);er.textContent='Ativando…';try{await Cloud.resgatar($('#gCod',g).value);gate()}catch(x){er.textContent=x.message}};
  $('#gOut',g).onclick=async()=>{if(await ask('Sair desta conta?',{ok:'Sair'})){Cloud.sair();S=blank();save(false);gate()}};
  gateTimer=setInterval(()=>{if(document.visibilityState==='visible')chk(null)},15000);
}
// Administrador: mostra em Mais quantas contas aguardam liberação.
async function contarAguardando(){if(!Cloud.admin)return;try{const[us,ls]=await Promise.all([Cloud.get('usuarios'),Cloud.get('licencas')]);
  const n=Object.keys(us||{}).filter(id=>id!==Cloud.user.uid&&!((ls||{})[id]&&ls[id].ativo)).length;const el=$('#mAdmS');if(el)el.innerHTML=n?`<b style="color:var(--ink)">${n} ${n===1?'conta aguardando':'contas aguardando'} liberação</b>`:'Nenhuma conta aguardando';}catch(e){}}

/* ======================= início ======================= */
function boot(){
  load();applyTema();shell();
  try{history.replaceState({base:1},'')}catch(e){}guarda();
  if(S.demo){S=blank();save(false)}
  gate();
  go(view);
  try{const nv=new URLSearchParams(location.search).get('novo');if(nv&&TIPOS[nv]){prefs.set('visto',true);$$('#layer .sheet').forEach(x=>x.remove());novoDoc(nv)}}catch(e){}
  if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  setInterval(checkLembretes,60000);setTimeout(checkLembretes,3000);
  if(Cloud.user){Cloud.registrar();Cloud.sync()}
  window.addEventListener('online',()=>Cloud.push());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Cloud.user)Cloud.sync()});
}
boot();
</script>
