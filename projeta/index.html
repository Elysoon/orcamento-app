<style>
/* Layout: app claro e minimalista no estilo Apple — barra translúcida no topo, conteúdo em cartões arredondados, abas na base; documentos A4 claros */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --panel2:#f0f0f3; --line:rgba(0,0,0,.09); --line2:#d2d2d7;
  --fg:#1d1d1f; --muted:#6e6e73; --red:#F22B0C; --red2:#d42308; --graf:#262626;

  --f-body:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:18px; --sh:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.8); --field:#ffffff; --sheet:#ffffff; --hover:#e6e6ea; --canvas:#ebebef; --navc:#8e8e93; --onpress:#ffffff; --hatch:#ececf0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:rgba(255,255,255,.1);--line2:#3a3a3c;--fg:#f5f5f7;--muted:#98989d;--graf:#48484a;--sh:0 1px 2px rgba(0,0,0,.4);--glass:rgba(22,22,24,.82);--field:#1c1c1e;--sheet:#1c1c1e;--hover:#3a3a3c;--canvas:#121214;--navc:#8e8e93;--onpress:#636366;--hatch:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:rgba(255,255,255,.1);--line2:#3a3a3c;--fg:#f5f5f7;--muted:#98989d;--graf:#48484a;--sh:0 1px 2px rgba(0,0,0,.4);--glass:rgba(22,22,24,.82);--field:#1c1c1e;--sheet:#1c1c1e;--hover:#3a3a3c;--canvas:#121214;--navc:#8e8e93;--onpress:#636366;--hatch:#2c2c2e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(242,43,12,.25)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand img{height:26px}
.brand b{color:var(--red);font-weight:700}
.pname{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}

/* abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin:0 auto}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navc);font-size:10.5px;font-weight:700;letter-spacing:.01em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--red)}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.view{padding-block:22px}
.wrapc{max-width:1080px;margin:0 auto}

/* tipografia e base */
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.02em}
h2{font-size:32px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.in-f,select.in-f,textarea.in-f{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;min-width:0;transition:border-color .2s,box-shadow .2s}
.in-f:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(242,43,12,.12)}
textarea.in-f{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:0;border-radius:980px;padding:10px 18px;font-weight:700;font-size:14px;color:var(--fg);transition:background .2s,transform .1s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:none;color:var(--red)}
.btn.ghost:hover{background:rgba(242,43,12,.07)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:980px;background:var(--panel2);color:var(--muted)}
.tag.r{background:rgba(242,43,12,.1);color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:980px;font-weight:700;font-size:13.5px;z-index:90;max-width:90vw;text-align:center;backdrop-filter:blur(10px)}

/* projetos */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hero p{margin:8px 0 0;color:var(--muted);max-width:60ch;font-size:16px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pitem{text-align:left;background:var(--panel);border:0;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .2s}
.pitem:active{transform:scale(.98)}
.pitem.cur{box-shadow:0 0 0 2px var(--red),var(--sh)}
.pitem .t{font-weight:700;font-size:16px;letter-spacing:-.01em}
.pitem .m{font-size:13px;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px}
.feat div{background:var(--panel);border-radius:var(--r);padding:16px;font-size:13.5px;color:var(--muted);box-shadow:var(--sh)}
.feat b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}

/* folhas (modais) */
.sugbox{position:fixed;left:0;right:0;z-index:80;background:var(--sheet);border-top:1px solid var(--line,rgba(127,127,127,.25));box-shadow:0 -10px 30px rgba(0,0,0,.25);border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sugbox .sg-h{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;touch-action:none;cursor:ns-resize}
.sugbox .sg-g{width:44px;height:5px;border-radius:3px;background:var(--muted,#888);opacity:.5;margin:0 auto}
.sugbox .sg-n{font-size:12.5px;color:var(--muted,#888);flex:1}.sugbox .sg-x{background:none;border:0;color:var(--red);font:inherit;font-weight:700;padding:6px}
.sugbox .sg-l{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 8px 8px}
.sugbox .sg-l button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line,rgba(127,127,127,.18));color:var(--fg);font:inherit;font-size:15px;padding:12px 8px;line-height:1.3}
.sugbox .sg-l button:active{background:rgba(127,127,127,.15)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@media (min-width:700px){.modal{align-items:center}}
.sheet{background:var(--sheet);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{border-radius:22px}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.steps{display:flex;gap:6px;margin:8px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--panel2)}
.steps i.on{background:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.opt{text-align:left;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--panel)}
.opt b{font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.thumb{height:118px;border-radius:10px;background:#fff;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.thumb i{position:absolute;display:block;border-radius:2px}

/* planta */
.pl{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.pl{grid-template-columns:1fr 360px;height:calc(100vh - 132px)}}
.cvw{position:relative;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--glass);border-bottom:1px solid var(--line);scrollbar-width:none}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel2);border:0;border-radius:980px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--fg);transition:background .2s}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--graf);color:#fff}
.cvbox{position:relative;height:56vh;min-height:320px;touch-action:none;background:var(--canvas)}
@media (min-width:900px){.cvbox{height:auto;flex:1}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;border-radius:50%;background:var(--glass);color:var(--fg);backdrop-filter:blur(10px);border:0;box-shadow:var(--sh);font-size:18px;font-weight:700}
.hint{position:absolute;left:12px;top:12px;right:64px;font-size:12.5px;background:var(--glass);backdrop-filter:blur(10px);border-radius:14px;padding:8px 12px;pointer-events:none;box-shadow:var(--sh);color:var(--fg)}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}
.side .in{padding-block:18px;display:flex;flex-direction:column;gap:16px}
.dori{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dori div{background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center}
.dori small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.dori b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.cbgrid{display:flex;flex-direction:column;gap:8px}.cbrow{display:flex;gap:8px;align-items:stretch}.cbopt{flex:1;min-width:0;border:0;border-radius:14px;background:var(--panel,#fff);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;text-align:left;font:inherit;font-size:15px;color:var(--fg);display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;border-left:5px solid var(--c)}.cbopt span{font-size:12px}.cbopt[aria-pressed=true]{background:var(--c);color:#fff;box-shadow:none}.cbv{flex:0 0 128px;display:flex;align-items:center;gap:4px;border-radius:14px;background:var(--panel,#fff);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px;font-size:14px}.cbv span{color:var(--muted);white-space:nowrap}.cbv input{width:100%;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);padding:10px 0;text-align:right}span.cbv{justify-content:flex-end}
.finbars{display:flex;gap:10px;align-items:flex-end;height:140px;padding-top:8px}.finbars>div{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%;position:relative;padding-bottom:18px}.finbars span{flex:1;min-height:2px;border-radius:5px 5px 0 0}.finbars small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--mut,#8e8e93)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:0;border-radius:980px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--graf);color:#fff}
.camlist{display:flex;flex-direction:column;gap:6px}
.camrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.camrow .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.camrow .d{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--red)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--red);width:18px;height:18px}

/* orçamento */
.tblw{overflow-x:auto;background:var(--panel);border-radius:var(--r);box-shadow:var(--sh)}
table.bt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:660px}
.bt th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;padding:12px;border-bottom:1px solid var(--line)}
.bt td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.bt td.r,.bt th.r{text-align:right}
.bt input{width:96px;background:var(--bg);border:0;border-radius:9px;padding:7px 9px;text-align:right}
.bt input.q{width:66px}
.bt input.desc{width:100%;text-align:left;background:transparent}
.bt input.desc:focus{background:var(--bg)}
.bt .grp td{background:var(--bg);font-weight:700;font-size:12px;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tot div{background:var(--panel);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tot small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tot b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.tot .big{background:var(--graf);color:#fff}
.tot .big small{color:#c7c7cc}
.tot .big b{color:#fff}

/* documento */
.doctools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.prevwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.pgbox{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 36px rgba(0,0,0,.08);border-radius:4px;overflow:hidden}
.pgbox>.pg{transform-origin:0 0;position:absolute;left:0;top:0}
#exportArea{position:fixed;left:-12000px;top:0}

/* login */
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;background:#262626;color:#FFFFF0;overflow:auto;display:flex;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));font-family:var(--f-body)}
.lg-glow{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) - 30px);width:340px;height:340px;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,rgba(242,43,12,.25) 0,rgba(242,43,12,0) 70%);opacity:0;pointer-events:none}
.lg-col{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
.lg-logo{width:112px;height:auto;opacity:0;transform:scale(.7)}
.lg-brand{font-size:20px;font-weight:700;letter-spacing:.22em;padding:20px 0 4px;text-align:center}
.lg-sub{font-size:14px;color:#B9B9AD;padding-bottom:28px;text-align:center}
.lg-form{width:100%}
.lg-form input{width:100%;background:none;border:0;outline:none;color:#FFFFF0;font-size:16px;padding:14px 0 10px;font-family:inherit}
.lg-form input::placeholder{color:#B9B9AD}
.lg-ln{display:block;height:1px;background:#555;transition:background .2s,height .2s}
.lg-form input:focus+.lg-ln,.lg-pr:focus-within+.lg-ln{background:#F22B0C;height:2px}
.lg-pr{display:flex;align-items:center}
.lg-eye{background:none;border:0;color:#B9B9AD;font-size:12px;font-weight:700;padding:12px 0 12px 12px}
.lg-err{width:100%;color:#F22B0C;font-size:13px;padding-top:12px;opacity:0;transition:opacity .25s;min-height:1em}
.lg-err.on{opacity:1}
.lg-bw{position:relative;width:100%;margin-top:20px;overflow:hidden}
.lg-go{display:block;width:100%;height:52px;background:#F22B0C;color:#fff;border:0;font-size:15px;font-weight:700;letter-spacing:.12em;font-family:inherit}
.lg-prog{position:absolute;left:0;bottom:0;width:90px;height:3px;background:#FFFFF0;display:none}
.lg-prog.on{display:block;animation:lgprog 1s linear infinite}
@keyframes lgprog{from{transform:translateX(-90px)}to{transform:translateX(420px)}}
.lg-links{display:flex;align-items:center;justify-content:center}
.lg-links span{color:#B9B9AD}
.lg-links button,.lg-local,.lg-lk{background:none;border:0;color:#B9B9AD;font-size:13px;padding:14px 10px 10px;font-family:inherit;text-decoration:none;text-align:center}
.lg-status{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.lg-status.fade{animation:lgfade .35s ease}
.lg-stT{font-size:20px;font-weight:700;padding:4px 0 10px}
.lg-stM{font-size:14px;color:#B9B9AD;line-height:1.5;white-space:pre-line;margin-bottom:20px}
.lg-demo{font-size:12px;color:#8d8d84;text-align:center;margin-top:18px}

 const dsc=Object.getOwnPropertyDescriptor(p,"plan");if(!dsc||!dsc.get){delete p.plan;delete p.cams;Object.defineProperty(p,"plan",{get(){return this.floors[this.fi].plan},set(v){this.floors[this.fi].plan=v},enumerable:false,configurable:true});Object.defineProperty(p,"cams",{get(){return this.floors[this.fi].cams},set(v){this.floors[this.fi].cams=v},enumerable:false,configurable:true})}return p}

const libOf=c=>LIB.find(l=>l.id===c.lib)||LIB[0];
function hfov(c){const l=libOf(c);if(l.type==="Fisheye")return 360;if(l.hfov&&!l.lenses.length&&!l.vf)return l.hfov;const f=c.lens||l.lens||2.8;return 2*Math.atan(l.sensorW/(2*f))*180/Math.PI}
const isWifi=c=>libOf(c).tech==="WiFi";
function resH(c){return RESH[libOf(c).mp]||1920}
function doriDist(c,ppm){const h=hfov(c);if(h>=360)return resH(c)/(ppm*Math.PI*2)*1.4;return resH(c)/(2*ppm*Math.tan(h*Math.PI/360))}
function camNo(c){return allCams().indexOf(c)+1}
function cableLen(c){if(isWifi(c))return 0;if(c.cable>0)return c.cable;const fp=floorOf(c).plan,d=fp.dvr;return(Math.abs(c.x-d.x)+Math.abs(c.y-d.y))/fp.scale*1.1+3}
function storage(){
 const cfg=S.cfg;let kbps=0;const per=allCams().map(c=>{if(isWifi(c))return 0;const b=(BITRATE[libOf(c).mp]||1280)*(cfg.codec==="H.265"?1:1.8)*(cfg.fps/15);kbps+=b;return b});
 const gb=kbps*1000/8*3600*cfg.hours*cfg.days*(cfg.motion/100)/1e9;
 const tb=gb*1.1/1000;const opts=[1,2,3,4,6,8,10,12];let hd=opts.find(o=>o>=tb)||12;
 return{per,kbps,mbps:kbps/1000,gb,tb,hd}
}
function bom(){if(isSeg())return segBom();
 const P=k=>S.prices[k]??PRICE_DEF[k];const items=[];const cams=allCams();
 const add=(key,grp,desc,qty,unit,price)=>{if(qty<=0)return;const q=S.qty[key]??qty;items.push({key,grp,desc:S.desc?.[key]||desc,qty:q,auto:qty,unit,price:S.prices[key]??price,base:price})};
 const g={};cams.forEach(c=>{g[c.lib]=(g[c.lib]||0)+1});
 Object.entries(g).forEach(([id,n])=>{const l=LIB.find(x=>x.id===id);add("cam_"+id,"Equipamentos",S.cfg.showBrand?`Câmera ${l.brand} ${l.model} (${TECHN[l.tech]} ${l.mp}MP ${l.type}${l.night!=="IR"?" "+NIGHTN[l.night]:""})`:`Câmera ${l.type} ${TECHN[l.tech]} ${l.mp}MP${l.night!=="IR"?" "+NIGHTN[l.night]:""}`,n,"un",l.price)});
 const wired=cams.filter(c=>!isWifi(c)),wifi=cams.filter(isWifi);
 const nHD=wired.filter(c=>libOf(c).tech==="HD").length,nIP=wired.length-nHD;
 if(wifi.length){add("sd","Equipamentos","Cartão microSD 128 GB para câmera Wi-Fi",wifi.length,"un",P("sd"));const wb=wifi.filter(c=>libOf(c).type==="Bullet").length;add("fonte1","Equipamentos","Fonte 12 V 1 A individual",wb,"un",P("fonte1"))}
 if(wired.length){const ch=[4,8,16,32].find(x=>x>=wired.length)||32;const k=(nHD?"dvr":"nvr")+ch;
  add(k,"Equipamentos",nHD?`Gravador DVR multi-HD ${ch} canais (aceita câmeras IP)`:`Gravador NVR ${ch} canais`,1,"un",P(k));
  const st=storage();add("hd"+st.hd,"Equipamentos",`HD para CFTV ${st.hd} TB (${S.cfg.days} dias de gravação)`,1,"un",P("hd"+st.hd));
 }
 if(nIP){const sw=[4,8,16].find(x=>x>=nIP)||16;add("sw"+sw,"Equipamentos",`Switch PoE ${sw} portas`,Math.ceil(nIP/16)||1,"un",P("sw"+sw))}
 if(nHD)add("fonte","Equipamentos","Fonte colmeia 12 V 10 A",Math.ceil(nHD/8),"un",P("fonte"));
 if(S.cfg.nobreak&&wired.length)add("nobreak","Equipamentos","Nobreak 1200 VA para gravador",1,"un",P("nobreak"));
 const mHD=Math.ceil(cams.filter(c=>libOf(c).tech==="HD").reduce((a,c)=>a+cableLen(c),0));
 const mIP=Math.ceil(cams.filter(c=>libOf(c).tech==="IP").reduce((a,c)=>a+cableLen(c),0));
 add("coax","Infraestrutura","Cabo coaxial bipolar 4 mm 80% malha",mHD,"m",P("coax"));
 add("utp","Infraestrutura","Cabo UTP Cat5e",mIP,"m",P("utp"));
 add("bnc","Infraestrutura","Conector BNC de mola",nHD*2,"un",P("bnc"));
 add("p4","Infraestrutura","Conector P4 macho",nHD,"un",P("p4"));
 add("rj45","Infraestrutura","Conector RJ45 Cat5e",nIP*2,"un",P("rj45"));
 add("caixa","Infraestrutura","Caixa de passagem para câmera",wired.length,"un",P("caixa"));
 add("labCam","Serviços","Instalação e ajuste de câmera",cams.length,"un",P("labCam"));
 add("labM","Serviços","Passagem e organização de cabeamento",mHD+mIP,"m",P("labM"));
 if(cams.length)add("labCfg","Serviços",wired.length?"Configuração do gravador e acesso remoto pelo app":"Configuração das câmeras Wi-Fi no app",1,"vb",P("labCfg"));
 S.extra.forEach(e=>items.push({key:"x_"+e.id,grp:e.grp||"Equipamentos",desc:e.desc,qty:+e.qty||0,unit:e.unit||"un",price:+e.price||0,extra:e}));
 const mk=1+S.cfg.markup/100;
 items.forEach(i=>{i.sale=i.grp==="Serviços"||i.extra?.fixed?i.price:i.price*mk;i.total=i.sale*i.qty;i.cost=i.price*i.qty});
 const mat=items.filter(i=>i.grp!=="Serviços").reduce((a,i)=>a+i.total,0);
 const srv=items.filter(i=>i.grp==="Serviços").reduce((a,i)=>a+i.total,0);
 const cost=items.reduce((a,i)=>a+(i.grp==="Serviços"?0:i.cost),0);
 const sub=mat+srv,disc=sub*S.cfg.discount/100,total=sub-disc;
 return{items,mat,srv,sub,disc,total,cost,margin:total-cost-srv,mHD,mIP}
}

function wizard(cli,seg){
 const w={step:0,type:"proposta",layout:"exec",client:cli?cli.nome:"",cli:cli||null,fromSample:false,seg:SEG[seg]?seg:"cftv"};const SD={proposta:["Proposta Comercial","Escopo, dimensionamento, investimento e condições para aceite."],relatorio:["Relatório","Vistoria, visita, durante ou pós-serviço: texto, materiais, fotos e planta opcional."],projeto:["Projeto Técnico","Memorial, dimensionamento, verificações de norma, planta, materiais e roteiro de execução."]};
 const m=document.createElement("div");m.className="modal";document.body.appendChild(m);
 const draw=()=>{
  const st=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=w.step?"on":""}"></i>`).join("")}</div>`;
  let body="";
  if(w.step===0)body=`<h2>Que documento você vai gerar?</h2><p class="muted">O tipo define as seções do PDF. Dá para mudar depois.</p><div class="opts">${Object.entries(DOCT).map(([k,v])=>`<button class="opt" data-t="${k}" aria-pressed="${w.type===k}"><b>${w.seg==="cftv"?v.n:SD[k][0]}</b><span>${w.seg==="cftv"?v.d:SD[k][1]}</span></button>`).join("")}</div>`;
  if(w.step===1)body=`<h2>Escolha o layout</h2><p class="muted">Visual aplicado a todas as páginas, com logo e dados da ESM.</p><div class="opts">${Object.entries(LAYOUTS).map(([k,v])=>`<button class="opt" data-l="${k}" aria-pressed="${w.layout===k}">${thumb(k)}<b>${v.n}</b><span>${v.d}</span></button>`).join("")}</div>`;
  if(w.step===2)body=`<h2>Cliente e ponto de partida</h2><div class="stack" style="margin-top:12px"><div><label class="lbl" for="wcl">Nome do cliente</label><div class="row" style="flex-wrap:nowrap"><input class="in-f" id="wcl" value="${esc(w.client)}" placeholder="Ex.: Condomínio Jardim Belém" style="flex:1"><button class="btn sm" id="wpc">Cadastrados</button></div>${w.cli?`<span class="muted" style="font-size:12.5px">Vinculado ao cliente cadastrado.</span>`:""}</div>
   <div class="opts">${w.type==="relatorio"?`<button class="opt" data-s="2" aria-pressed="${!!w.noPlan}"><b>Sem planta</b><span>Só texto, materiais e fotos. Ideal para vistoria, visita ou relatório de serviço.</span></button>`:""}<button class="opt" data-s="0" aria-pressed="${!w.fromSample&&!(w.type==="relatorio"&&w.noPlan)}"><b>Planta em branco</b><span>Envie a foto ou PDF convertido da planta, ou desenhe as paredes.</span></button>${w.seg==="cftv"?`<button class="opt" data-s="1" aria-pressed="${w.fromSample}"><b>Partir do exemplo</b><span>Galpão de 32 × 20 m com 7 câmeras já posicionadas.</span></button>`:""}</div></div>`;
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="Novo documento"><div class="row" style="justify-content:space-between"><h3>${segIco(w.seg)} ${esc(SEG[w.seg].short)} · ${w.step+1}/3</h3><button class="btn sm ghost" id="wx">Fechar</button></div>${st}${body}
  <div class="row" style="justify-content:flex-end;margin-top:18px">${w.step?`<button class="btn" id="wb">Voltar</button>`:""}<button class="btn pri" id="wn">${w.step===2?"Começar projeto":"Continuar"}</button></div></div>`;
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{w.type=b.dataset.t;draw()});
  m.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{w.layout=b.dataset.l;draw()});
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{w.client=$("#wcl").value;w.fromSample=b.dataset.s==="1";w.noPlan=b.dataset.s==="2";draw()});
  m.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{if(w.type==="relatorio"&&w.noPlan===undefined){w.noPlan=true;draw()}}));
  const cl=$("#wcl");if(cl)cl.oninput=()=>{w.client=cl.value;if(w.cli&&cl.value!==w.cli.nome)w.cli=null};
  if($("#wpc"))$("#wpc").onclick=()=>clientPick(c=>{w.cli=c;w.client=c.nome;draw()});
  $("#wx").onclick=()=>m.remove();
  if($("#wb"))$("#wb").onclick=()=>{w.step--;draw()};
  $("#wn").onclick=()=>{if(w.step<2){w.step++;draw();return}
   let p;if(w.fromSample){p=sampleProject();const t=defaultTexts(w.type);p.type=w.type;p.meta={...p.meta,...t};p.cfg.showValues=w.type!=="relatorio";if(w.type==="relatorio")p.cams.forEach((c,i)=>c.status=["ok","defeito","substituir","ok","realocar","novo","ok"][i%7])}
   else p=blankProject(w.type,w.layout,w.client.trim());
   if(w.type==="relatorio"){p.cfg.rPlan=!w.noPlan;if(w.noPlan)p.cfg.rCams=false;p.meta.rtipo=p.meta.rtipo||"vistoria";p.meta.intro=RTIPO[p.meta.rtipo].i}
   p.seg=w.seg;if(w.seg!=="cftv"){p.meta.intro=w.type==="relatorio"?p.meta.intro:SEG[w.seg].intro;p.cfg.rCams=false;p.cfg.showBrand=true}
   p.layout=w.layout;delete p.sample;if(w.client.trim()){p.client.name=w.client.trim();p.name=`${w.seg==='cftv'?DOCT[w.type].n:SEG[w.seg].short} — ${w.client.trim()}`}
   if(w.cli)Object.assign(p.client,{cliId:w.cli.id,name:w.cli.nome,doc:w.cli.doc||"",phone:w.cli.tel||"",address:[w.cli.end,w.cli.cidade&&w.cli.cidade+(w.cli.uf?" - "+w.cli.uf:"")].filter(Boolean).join(", ")});
   DB.projects[p.id]=p;DB.order.unshift(p.id);m.remove();openProject(p.id,w.seg!=="cftv"?(w.type==="relatorio"?"dados":SEG[w.seg].noPlan?"orcamento":"planta"):w.fromSample&&!(w.type==="relatorio"&&w.noPlan)?"planta":"dados");save();toast("Projeto criado");
  };
 };
 draw();
}

function fld(id,label,val,ph="",type="text"){return`<div><label class="lbl" for="${id}">${label}</label><input class="in-f" id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}"></div>`}
function area(id,label,val,rows=4){return`<div><label class="lbl" for="${id}">${label}</label><textarea class="in-f" id="${id}" rows="${rows}">${esc(val)}</textarea></div>`}
function vDados(){
 const c=S.client,m=S.meta;
 $("#main").innerHTML=`<section class="view gut"><div class="wrapc stack">
 <div class="card stack"><h3>Documento</h3>
  <div class="grid2">${fld("d_name","Nome do projeto",S.name)}
  <div><label class="lbl" for="d_type">Tipo</label><select class="in-f" id="d_type">${Object.entries(DOCT).map(([k,v])=>`<option value="${k}" ${S.type===k?"selected":""}>${v.n}</option>`).join("")}</select></div>
  <div><label class="lbl" for="d_lay">Layout</label><select class="in-f" id="d_lay">${Object.entries(LAYOUTS).map(([k,v])=>`<option value="${k}" ${S.layout===k?"selected":""}>${v.n}</option>`).join("")}</select></div>
  ${fld("d_num","Número",S.number)}${fld("d_date","Data",S.date,"","date")}${fld("d_val","Validade (dias)",m.validity,"","number")}</div></div>
 <div class="card stack"><div class="row" style="justify-content:space-between"><h3>Cliente</h3><div class="row"><button class="btn sm" id="c_pick">Escolher cliente cadastrado</button>${c.cliId&&DB.col.clients.some(x=>x.id===c.cliId)?`<span class="tag">Vinculado</span>`:`<button class="btn sm ghost" id="c_save">Salvar como cliente</button>`}</div></div><div class="grid2">
  ${fld("c_name","Nome / Razão social",c.name)}${fld("c_doc","CPF / CNPJ",c.doc)}${fld("c_contact","Contato",c.contact)}${fld("c_phone","Telefone",c.phone)}</div>${fld("c_address","Endereço da instalação",c.address)}</div>
 ${S.type==="relatorio"?relCard():""}
 <div class="card stack"><h3>Textos do documento</h3>
  ${area("m_intro",S.type==="proposta"?"Carta de apresentação":"Objetivo / introdução",m.intro,S.type==="relatorio"?3:4)}
  ${S.type!=="proposta"?area("m_recs","Recomendações (uma por linha)",m.recs):""}
  ${area("m_notes","Observações",m.notes,3)}
  ${S.type!=="relatorio"?`<div class="grid2">${fld("m_payment","Pagamento",m.payment)}${fld("m_deadline","Prazo de execução",m.deadline)}${fld("m_warranty","Garantia",m.warranty)}</div>`:""}
 </div>
 <div class="card stack"><h3>Projeto</h3><p class="muted" style="margin:0;font-size:13px">Dados da empresa, logo e opções do PDF ficam na aba Empresa.</p><div class="row"><button class="btn sm" id="exp">Exportar (.json)</button><button class="btn sm" id="dup">Duplicar</button><button class="btn sm ghost" id="del">Excluir projeto</button></div></div>
 </div></section>`;
 const bind=(id,fn)=>{const e=$("#"+id);if(e)e.oninput=()=>{fn(e.value);save()}};
 bind("d_name",v=>S.name=v);bind("d_num",v=>S.number=v);bind("d_date",v=>S.date=v);bind("d_val",v=>m.validity=+v);
 $("#d_type").onchange=e=>{S.type=e.target.value;S.cfg.showValues=S.type!=="relatorio";save();vDados()};
 $("#d_lay").onchange=e=>{S.layout=e.target.value;save()};
 if(S.type==="relatorio")relWire();
 ["name","doc","contact","phone","address"].forEach(k=>bind("c_"+k,v=>c[k]=v));
 ["intro","recs","notes","payment","deadline","warranty"].forEach(k=>bind("m_"+k,v=>m[k]=v));
 $("#c_pick").onclick=()=>clientPick(k=>{Object.assign(c,{cliId:k.id,name:k.nome,doc:k.doc||"",phone:k.tel||"",address:[k.end,k.cidade&&k.cidade+(k.uf?" - "+k.uf:"")].filter(Boolean).join(", ")});save();vDados()});
 if($("#c_save"))$("#c_save").onclick=()=>{if(!c.name.trim()){toast("Informe o nome do cliente.");return}const o={id:newId("clients"),nome:c.name.trim(),tel:c.phone||"",doc:c.doc||"",end:c.address||"",uf:"PA",cidade:"",obs:c.contact?"Contato: "+c.contact:""};upsert("clients",o);c.cliId=o.id;save();vDados();toast("Cliente salvo")};
 $("#exp").onclick=()=>saveFile(`${S.number}.json`,JSON.stringify(S));
 $("#dup").onclick=()=>{const p=JSON.parse(JSON.stringify(S));p.id=uid();p.name+=" (cópia)";delete p.sample;delete p.quoteId;DB.seq++;p.number=`ESM-${new Date().getFullYear()}-${String(DB.seq).padStart(3,"0")}`;p.created=Date.now();DB.projects[p.id]=p;DB.order.unshift(p.id);openProject(p.id,"dados");save();toast("Projeto duplicado")};
 $("#del").onclick=()=>confirmSheet("Excluir projeto?",S.name,"Excluir",()=>{const id=S.id;delete DB.projects[id];DB.order=DB.order.filter(i=>i!==id);markDel("projetos",id);DB.cur=null;ensureProject();inProj=false;render();toast("Projeto excluído")});
}
function shrink(file,max,type="image/jpeg",q=.82){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function relCard(){const m=S.meta,R=rTipo(),f=m.rfotos||[];
 return`<div class="card stack"><h3>Relatório ${NEW}</h3>
 <div><span class="lbl">Tipo de relatório</span><div class="chips">${Object.entries(RTIPO).map(([k,v])=>`<button class="chip" data-rt="${k}" aria-pressed="${(m.rtipo||"vistoria")===k}">${v.n}</button>`).join("")}</div><span class="muted" style="font-size:12.5px">Título no PDF: <b>${esc(R.t)}</b></span></div>
 ${fld("m_resp","Responsável técnico (opcional)",m.resp||"")}

 <div><label class="lbl" for="m_mats">Materiais utilizados (opcional, um por linha)</label><textarea class="in-f" id="m_mats" rows="4" placeholder="Ex.: 2 Câmera dome 1080p&#10;30 m Cabo coaxial&#10;1 Fonte 12 V">${esc(m.mats||"")}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" id="m_matc">+ Do catálogo</button><span class="muted" style="font-size:12.5px">Quantidade no início da linha vira a coluna Qtd.</span></div></div>
 <div><span class="lbl">Fotos do relatório</span><div class="photos-g">${f.map((x,i)=>`<div class="ph-c"><img src="${x.img}" alt="Foto ${i+1}"><input class="in-f" data-rfc="${i}" value="${esc(x.cap||"")}" placeholder="Legenda"><button class="btn sm ghost" data-rfx="${i}">Remover</button></div>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn sm" id="m_rfa">+ Adicionar fotos</button><input type="file" id="m_rff" accept="image/*" multiple hidden></div></div>
 <div class="stack" style="gap:6px"><label class="chk"><input type="checkbox" id="r_plan" ${S.cfg.rPlan?"checked":""}>Incluir a planta no relatório</label><label class="chk"><input type="checkbox" id="r_cams" ${S.cfg.rCams!==false?"checked":""}>Incluir situação das câmeras${allCams().length?` (${allCams().length})`:" (nenhuma na planta)"}</label></div></div>`}
function relWire(){const m=S.meta;
 document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{const old=rTipo();m.rtipo=b.dataset.rt;if(!m.intro||m.intro===old.i||m.intro===defaultTexts("relatorio").intro)m.intro=rTipo().i;save();vDados()});
 [["m_resp","resp"],["m_feito","feito"],["m_mats","mats"]].forEach(([id,k])=>{const e=$("#"+id);if(e)e.oninput=()=>{m[k]=e.value;save()}});
 $("#m_matc").onclick=()=>catalogPick("i",it=>{m.mats=(String(m.mats||"").trim()?m.mats.trim()+"\n":"")+"1 "+it.nome;save();vDados()});
 document.querySelectorAll("[data-rfc]").forEach(i=>i.oninput=()=>{m.rfotos[+i.dataset.rfc].cap=i.value;save()});
 document.querySelectorAll("[data-rfx]").forEach(b=>b.onclick=()=>{m.rfotos.splice(+b.dataset.rfx,1);save();vDados()});
 $("#m_rfa").onclick=()=>$("#m_rff").click();
 $("#m_rff").onchange=async e=>{m.rfotos=m.rfotos||[];for(const f of [...e.target.files].slice(0,12)){try{m.rfotos.push({img:await shrink(f,1100,"image/jpeg",.75),cap:""})}catch(_){}}save();vDados()};
 $("#r_plan").onchange=e=>{S.cfg.rPlan=e.target.checked;save()};$("#r_cams").onchange=e=>{S.cfg.rCams=e.target.checked;save()};

function importDXF(txt){

  if(ent.t==="ARC"&&ent.r){const a0=(ent.a0||0)*Math.PI/180;let a1=(ent.a1||0)*Math.PI/180;if(a1<a0)a1+=Math.PI*2;const n=Math.max(4,Math.ceil((a1-a0)/(Math.PI/12)));for(let k=0;k<n;k++){const p=a0+(a1-a0)*k/n,q=a0+(a1-a0)*(k+1)/n;segs.push([ent.cx+ent.r*Math.cos(p),ent.cy+ent.r*Math.sin(p),ent.cx+ent.r*Math.cos(q),ent.cy+ent.r*Math.sin(q)])}}};

  if(c==="0"){if(v==="VERTEX"&&poly){ent={t:"VERTEX"};continue}if(v==="SEQEND"&&poly){ent=poly;flush();poly=null;ent=null;pts=[];continue}flush();ent={t:v};pts=[];closed=false;if(v==="POLYLINE"){poly=ent}continue}
  if(!ent)continue;const n=parseFloat(v);
  if(ent.t==="LINE"){if(c==="10")ent.x1=n;if(c==="20")ent.y1=n;if(c==="11")ent.x2=n;if(c==="21")ent.y2=n}

  else if(ent.t==="POLYLINE"){if(c==="70")closed=(parseInt(v)&1)===1}

  else if(ent.t==="ARC"){if(c==="10")ent.cx=n;if(c==="20")ent.cy=n;if(c==="40")ent.r=n;if(c==="50")ent.a0=n;if(c==="51")ent.a1=n}
 }flush();

 P.dvr={x:P.w/2,y:P.h/2};planImgSrc="";fitPending=true;sizeCv();loadPlanImg();save();sideP();draw();
 toast(`DXF importado: ${P.walls.length} paredes, ${f1((x1-x0)*unit)} × ${f1((y1-y0)*unit)} m${unit===1?"":" (medidas em "+(unit===.001?"mm":"cm")+")"}. Confira a escala.`);
}

async function runSync(manual){
 if(!authCloud()){if(manual)toast("Entre com sua conta para sincronizar.");return}
 if(SYNC.running){SYNC.again=true;return}
 SYNC.running=true;updSyncUI();
 try{const r=await doSync();DB.syncLast=Date.now();ls("esmp.db",DB);if(manual)toast(`Sincronizado: ${r.pushed} enviados, ${r.pulled} recebidos`);if(r.pulled)refreshAfterPull();checkResponses(true);checkSurveys()}
 catch(e){DB.dirty=true;ls("esmp.db",DB);if(manual)toast(errMsg(e))}
 finally{SYNC.running=false;updSyncUI();if(SYNC.again){SYNC.again=false;runSync(false)}}

async function doSync(){
 syncPrepare();const uid=AUTH.uid,now=Date.now();DB.dirty=false;let pushed=0,pulled=0;
 for(const c of COLS){DB.col[c].forEach(o=>{if(!o.ts)o.ts=now});const r=await mergeCol(uid,c,DB.col[c],DB.del[c]);DB.col[c]=r.arr;DB.del[c]=r.del;pushed+=r.pushed;pulled+=r.pulled}
 // projetos de CFTV (exemplos não vão para a nuvem)
 const samples=Object.values(DB.projects).filter(p=>p.sample);
 const pr=await mergeCol(uid,"projetos",Object.values(DB.projects).filter(p=>!p.sample).map(p=>{if(!p.ts)p.ts=now;return p}),DB.del.projetos);
 const np={};pr.arr.forEach(p=>np[p.id]=p);samples.forEach(p=>np[p.id]=p);DB.projects=np;DB.del.projetos=pr.del;
 DB.order=[...DB.order.filter(id=>np[id]),...Object.keys(np).filter(id=>!DB.order.includes(id)).sort((a,b)=>(np[b].created||0)-(np[a].created||0))];
 pushed+=pr.pushed;pulled+=pr.pulled;
 const cr=await mergeCol(uid,"cameras",DB.customCams.map(c=>{if(!c.ts)c.ts=now;return c}),DB.del.cameras);DB.customCams=cr.arr;DB.del.cameras=cr.del;pushed+=cr.pushed;pulled+=cr.pulled;
 let r=await mergeCfg(uid);pushed+=r[0];pulled+=r[1];
 r=await mergeLogo(uid,now);pushed+=r[0];pulled+=r[1];
 ls("esmp.db",DB);return{pushed,pulled};
}
async function mergeCol(uid,col,arr,del){
 const base=`empresas/${uid}/colecoes/${col}`;const cloud=(await dbReq("GET",base))||{};
 const loc=new Map(arr.map(o=>[String(o.id),o])),dl=new Map(del.map(o=>[String(o.id),o]));
 const ids=new Set([...Object.keys(cloud),...loc.keys(),...dl.keys()]);let pushed=0,pulled=0;
 for(const id of ids){
  const c=cloud[id],l=loc.get(id),d=dl.get(id);const lts=l?(l.ts||0):-1,dts=d?(d.ts||0):-1;
  const lDel=!!d&&dts>=lts,lEff=lDel?dts:lts;if(lDel)loc.delete(id);
  const hasLocal=!!l||!!d,cts=c?(c.ts||0):-1,cDel=!!c&&!!c.del;
  if(!hasLocal){if(c&&!cDel&&c.d){try{loc.set(id,JSON.parse(c.d));pulled++}catch(_){}}continue}
  if(!c||lEff>cts){const put={ts:lEff,del:lDel};if(!lDel)put.d=JSON.stringify(l);await dbReq("PUT",`${base}/${id}`,put);pushed++}
  else if(cts>lEff){if(cDel){loc.delete(id);dl.set(id,{id:isNaN(+id)?id:+id,ts:cts})}else if(c.d){try{loc.set(id,JSON.parse(c.d));dl.delete(id)}catch(_){}}pulled++}
 }
 return{arr:[...loc.values()],del:[...dl.values()],pushed,pulled};
}

function applyCfg(d){const co=DB.company,map={nome:"name",razao:"razao",desc:"desc",end:"end",tel:"phone",email:"email",doc:"cnpj",insc:"insc",cab:"site",insta:"insta",cidade:"city",resp:"resp",pix:"pix",pixNome:"pixNome",pixCidade:"pixCidade",assin:"assin",cond:"cond",payLink:"payLink",equipe:"equipe",checklist:"checklist",propUrl:"propUrl"};
 for(const k in map)if(d[k]!==undefined)co[map[k]]=d[k];["ask","lines","noseq"].forEach(k=>{if(d[k]!==undefined)DB.opt[k]=!!d[k]});if(d.cur!==undefined)DB.opt.cur=+d.cur||0;if(d.libPrice)DB.libPrice=d.libPrice;if(+d.oseq>DB.oseq)DB.oseq=+d.oseq}
async function mergeCfg(uid){
 const path=`empresas/${uid}/config`;const c=(await dbReq("GET",path))||{};const has=Object.keys(c).length>0;
 const cts=has?(c.ts||0):-1,lts=DB.cfgTs||0;let cd={};try{cd=has&&c.d?JSON.parse(c.d):{}}catch(_){}
 const cseq=+cd.seq||0,lseq=DB.qseq||0,seq=Math.max(cseq,lseq);let pushed=0,pulled=0;
 if(!has&&lts===0&&lseq===0)return[0,0];
 if(!has||lts>cts){const d=lts>0?localCfg():{};d.seq=seq;await dbReq("PUT",path,{ts:lts,d:JSON.stringify(d)});pushed++}
 else if(cts>lts){applyCfg(cd);DB.cfgTs=cts;pulled++;if(seq>cseq){cd.seq=seq;await dbReq("PUT",path,{ts:cts,d:JSON.stringify(cd)})}}
 else if(seq>cseq){cd.seq=seq;await dbReq("PUT",path,{ts:cts,d:JSON.stringify(cd)})}
 DB.qseq=seq;return[pushed,pulled];
}
async function mergeLogo(uid,now){
 const path=`empresas/${uid}/logo`;const c=(await dbReq("GET",path))||{};const has=Object.keys(c).length>0,cDel=!!c.del;
 const cts=has?(c.ts||0):-1;let lts=DB.logoTs||0;const file=!!DB.company.logo;
 if(file&&lts===0){lts=now;DB.logoTs=lts}
 if(!file&&lts===0){if(has&&!cDel&&c.d){DB.company.logo="data:image/png;base64,"+c.d;DB.logoTs=cts;return[0,1]}return[0,0]}
 const lDel=!file;
 if(!has||lts>cts){const put={ts:lts,del:lDel};if(!lDel)put.d=String(DB.company.logo).split(",")[1]||"";await dbReq("PUT",path,put);return[1,0]}
 if(cts>lts){DB.company.logo=cDel?"":(c.d?"data:image/png;base64,"+c.d:DB.company.logo);DB.logoTs=cts;return[0,1]}
 return[0,0];
}

/* ================= NOVO (v2.1): funções inspiradas nos apps de proposta pagos ================= */
const NEW='<span class="new">Novo</span>';
const QST={rascunho:{n:"Rascunho",c:"#8e8e93"},enviado:{n:"Enviado",c:"#0a64c8"},aprovado:{n:"Aprovado",c:"#2e8b45"},recusado:{n:"Recusado",c:"#d1291c"},expirado:{n:"Expirado",c:"#c77700"},concluido:{n:"Concluído",c:"#6f42c1"}};
function qStatus(q){const s=q.status||"rascunho";if((s==="rascunho"||s==="enviado")&&q.id&&Date.now()>(+q.id)+(q.val||7)*864e5)return"expirado";return s}
const stPill=s=>`<span class="qst" style="--c:${QST[s].c}">${QST[s].n}</span>`;
const lineV=o=>(+o.q||0)*(+o.p||0);
const hasPk=q=>!!(q.pacotes&&q.pacotes.length);
function qBase(q){return(q.itens||[]).filter(o=>!o.o&&!(hasPk(q)&&o.pk>=0)).reduce((a,o)=>a+lineV(o),0)}
function qPk(q,i){return qBase(q)+(q.itens||[]).filter(o=>!o.o&&o.pk===i).reduce((a,o)=>a+lineV(o),0)}
function qSub(q){return hasPk(q)?qPk(q,q.pkRec||0):(q.itens||[]).filter(o=>!o.o).reduce((a,o)=>a+lineV(o),0)}
function qOpt(q){return(q.itens||[]).filter(o=>o.o).reduce((a,o)=>a+lineV(o),0)}
function qCost(q){return(q.itens||[]).filter(o=>!o.o&&(!hasPk(q)||!(o.pk>=0)||o.pk===(q.pkRec||0))).reduce((a,o)=>a+(+o.c||0)*(+o.q||0),0)}
function qTotal(q){return Math.max(0,qSub(q)-(+q.desc||0))}
function qEntrada(q){const t=qTotal(q);return q.sinal>0?Math.round(t*q.sinal)/100:0}

function pixKey(k){k=String(k||"").trim();const d=k.replace(/\D/g,"");if(k.includes("@")||/^[0-9a-f-]{32,36}$/i.test(k))return k;if(/^\+/.test(k))return"+"+d;if(d.length===11&&!cpfOk(d)&&/^\d{2}9/.test(d))return"+55"+d;if(d.length===11||d.length===14)return d;if(d.length===10||d.length===11)return"+55"+d;if(d.length===12||d.length===13)return"+"+d;return k}
function pixPayload(key,name,city,amount,txid){
 const f=(id,v)=>id+String(v.length).padStart(2,"0")+v,cl=s=>norm(s).toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
 let p=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",pixKey(key)))+f("52","0000")+f("53","986")+(amount>0?f("54",(+amount).toFixed(2)):"")+f("58","BR")+f("59",cl(name).slice(0,25)||"RECEBEDOR")+f("60",cl(city).slice(0,15)||"BELEM")+f("62",f("05",String(txid||"***").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***"))+"6304";
 let crc=0xFFFF;for(let i=0;i<p.length;i++){crc^=p.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF}
 return p+crc.toString(16).toUpperCase().padStart(4,"0");
}

/* valor por extenso (recibo) */
function extenso(v){
 const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
 const t3=n=>{if(n===100)return"cem";const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r<20){if(r)p.push(U[r])}else{p.push(D[Math.floor(r/10)]+(r%10?" e "+U[r%10]:""))}return p.join(" e ")};
 const int=n=>{if(n===0)return"zero";const parts=[];const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000;if(mi)parts.push(t3(mi)+(mi===1?" milhão":" milhões"));if(mil)parts.push(mil===1?"mil":t3(mil)+" mil");if(r)parts.push(t3(r));let s=parts[0]||"";for(let i=1;i<parts.length;i++){const last=i===parts.length-1;s+=(last&&(r<100||r%100===0)?" e ":last&&r?" ":", ")+parts[i]}return s.replace(/\s+/g," ")};
 v=Math.round((+v||0)*100);const re=Math.floor(v/100),ce=v%100;let s="";
 if(re)s=int(re)+(re===1?" real":(re%1e6===0?" de reais":" reais"));if(ce)s+=(s?" e ":"")+int(ce)+(ce===1?" centavo":" centavos");return s||"zero real";
}

function qRow(o,i,q){return`<div class="qrowf${o.o?" opt":""}" data-ri="${i}"><input class="in-f r_d" autocomplete="off" data-sl="dl_${o.t}" value="${esc(o.d)}" placeholder="${o.t==="s"?"Descrição do serviço":"Descrição do item"}"><div class="row" style="flex-wrap:nowrap;gap:8px"><input class="in-f r_q num" inputmode="decimal" value="${fx(o.q)}" style="flex:1;min-width:0" aria-label="Quantidade"><input class="in-f r_p num" inputmode="decimal" value="${o.p?dec(o.p):""}" placeholder="Valor unitário" style="flex:2;min-width:0" aria-label="Valor unitário"><span class="num r_t muted" style="min-width:86px;text-align:right;font-size:13px"></span><button class="btn sm ghost r_x" aria-label="Remover">✕</button></div>
 <div class="row" style="gap:6px"><button type="button" class="chip r_o" aria-pressed="${!!o.o}">Opcional</button>${o.img?`<img class="r_im" src="${o.img}" alt="Foto" style="width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)"><button type="button" class="chip r_f">Trocar foto</button><button type="button" class="chip r_fx" aria-label="Tirar foto">✕</button>`:`<button type="button" class="chip r_f">+ Foto</button>`}${hasPk(q)?`<select class="in-f r_pk" style="width:auto;padding:6px 10px;font-size:13px" aria-label="Pacote"><option value="-1">Todos os pacotes</option>${q.pacotes.map((n,j)=>`<option value="${j}" ${o.pk===j?"selected":""}>Só no ${esc(n)}</option>`).join("")}</select>`:""}</div></div>`}
/* número de 5 dígitos que sobe com saltos aleatórios, como numeração de um orçamento real */
function nextQuoteNum(){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let n=+DB.qseq||0;if(n<10000)n=r(10200,13800);n+=r(3,19);if(n>99999)n=10000+(n%90000);DB.qseq=n;return String(n)}
function saveQuote(q){
 if(!String(q.cliente||"").trim()){toast("Informe o nome do cliente.");return false}
 q.itens=(q.itens||[]).filter(o=>String(o.d||"").trim());
 if(!q.itens.length){q.itens=[{d:"",t:"i",q:1,p:0}];toast("Preencha a descrição de ao menos um item.");return false}
 q.itens.sort((a,b)=>(a.t==="s")-(b.t==="s"));q.status=q.status||"rascunho";
 if(!q.id)q.id=newId("quotes");
 if(DB.opt.noseq)q.num="";else if(!q.num||(/^\d{1,4}$/.test(q.num)&&(q.status||"rascunho")==="rascunho"&&!(q.link&&q.link.t)&&!q.renum)){q.num=nextQuoteNum();q.renum=1}
 const ex=DB.col.quotes.find(x=>x.id===q.id)||{};const o=Object.assign({},ex,q);upsert("quotes",o);QF.q=q;return true;
}

/* ---------- certificado de garantia ---------- */
const garPrazo=m=>m%12===0?`${m/12} ${m/12>1?"anos":"ano"}`:`${m} ${m>1?"meses":"mês"}`;
function addMonthsIso(iso,k){const d=new Date(iso+"T12:00:00");const dia=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+k);const u=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dia,u));return d.toISOString().slice(0,10)}
const certFim=c=>addMonthsIso(c.saida||c.data||today(),Math.max(1,+c.meses||12));
const certTermos=()=>String(DB.company.garCert||"").trim()||String(DB.company.cond||"").trim()||GARANTIA_ESM;

 H(54,`<div class="gcells"><div><small>Emissão</small><b>${fmtDate(c.data)}</b></div><div><small>Saída / entrega</small><b>${fmtDate(ini)}</b></div><div><small>Início da garantia</small><b>${fmtDate(ini)}</b></div><div><small>Término da garantia</small><b>${fmtDate(fim)}</b></div></div>`);

 const termos=String(c.termos==null?certTermos():c.termos).trim();if(termos)H(90,`<h5 class="qsec">Condições da garantia</h5><div class="note">${esc(termos)}</div>`);
 H(150,`<div class="sig qsig"><div>${co.assin?`<img src="data:image/png;base64,${co.assin}" alt="">`:""}<b>${esc(co.name)}</b>${co.resp?`<br>${esc(co.resp)}`:""}</div><div><b>Ciente do cliente</b><br>${esc(c.cliente||"")}</div></div>`);

/* chave do telefone: só dígitos, sem +55 e sem 0 de operadora; celular antigo de 8 dígitos ganha o 9; número sem DDD usa o DDD da empresa (só para comparar) */
const myDDD=()=>{const d=onlyNum(DB.company.phone);const x=d.startsWith("55")&&d.length>=12?d.slice(2):d;return x.length>=10?x.slice(0,2):"91"};
function telKey(t){let d=onlyNum(t);if(!d)return"";if(d.length>=12&&d.startsWith("55"))d=d.slice(2);if(d.length===11&&d[0]==="0")d=d.slice(1);if(d.length>11&&d.startsWith("0"))d=d.replace(/^0+/,"").slice(-11);
 if(d.length===8||d.length===9)d=myDDD()+d;if(d.length===10&&/[6-9]/.test(d[2]))d=d.slice(0,2)+"9"+d.slice(2);return d.length>=10?d:""}
const telFmt=k=>k.length===11?`(${k.slice(0,2)}) ${k.slice(2,7)}-${k.slice(7)}`:k.length===10?`(${k.slice(0,2)}) ${k.slice(2,6)}-${k.slice(6)}`:k;
const nameKey=n=>norm(n).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const cliTels=c=>[c.tel,...(c.tels||[])].map(telKey).filter(Boolean);
function parseVCF(txt){const out=[];txt=txt.replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");/* desdobra linhas */
 const qp=v=>{try{return decodeURIComponent(v.replace(/=\n/g,"").replace(/=([0-9A-F]{2})/gi,"%$1"))}catch(_){return v}};
 txt.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{const o={n:"",tels:[],emails:[]};b.split("\n").forEach(l=>{const i=l.indexOf(":");if(i<0)return;const k=l.slice(0,i).toUpperCase(),raw=l.slice(i+1).trim(),v=/QUOTED-PRINTABLE/.test(k)?qp(raw):raw;
  if(/^FN\b|^FN;/.test(k))o.n=v.replace(/\\,/g,",").replace(/\\;/g,";");else if(/^N\b|^N;/.test(k)&&!o.n)o.n=v.split(";").filter(Boolean).reverse().join(" ");else if(/^(ITEM\d+\.)?TEL/.test(k))o.tels.push(v);else if(/^(ITEM\d+\.)?EMAIL/.test(k))o.emails.push(v)});if(o.n||o.tels.length)out.push(o)});return out}
/* junta os contatos do celular que têm o mesmo número ou e-mail (duplicados dentro da agenda) */
function groupContacts(list){const par=list.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i])),u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[b]=a};const seen={};
 list.forEach((c,i)=>{[...c.tels.map(t=>"t"+telKey(t)),...c.emails.map(e=>"e"+e.toLowerCase().trim())].filter(k=>k.length>3).forEach(k=>{if(seen[k]!=null)u(seen[k],i);else seen[k]=i})});
 const g={};list.forEach((c,i)=>{(g[f(i)]=g[f(i)]||[]).push(c)});
 return Object.values(g).map(arr=>{const tk=[...new Set(arr.flatMap(c=>c.tels.map(telKey)).filter(Boolean))],em=[...new Set(arr.flatMap(c=>c.emails.map(e=>e.toLowerCase().trim())).filter(Boolean))];
  const n=arr.map(c=>c.n.trim()).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||(tk[0]?telFmt(tk[0]):"Sem nome");return{n,tels:tk,emails:em,dup:arr.length}})}

function equipSheet(cli,e){

 ${e.obs?`<p style="white-space:pre-wrap;margin:12px 0 0">${esc(e.obs)}</p>`:""}

 m.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const k=b.dataset.show,x=$(`[data-v="${k}"]`,m),h=b.textContent==="Ver";x.textContent=h?e[k]:"••••••••";b.textContent=h?"Ocultar":"Ver"});
 m.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{const k=b.dataset.cp;copy(e[k],(EQF.find(x=>x[0]===k)||[,"Dado"])[1]+" copiado")});

 $("#es_b",m).onclick=()=>{m.remove();clientSheet(cli)};
 $("#es_e",m).onclick=()=>{m.remove();equipForm(cli,e)};

/* ================= sugestões acima do teclado (no lugar da lista do Android, que cobria a tela) ================= */
const SG={box:null,inp:null,dl:null,h:0};
try{SG.h=+localStorage.getItem("esmp.sugH")||0}catch(_){}
function sgView(){const v=window.visualViewport;return v?{top:v.offsetTop,h:v.height}:{top:0,h:window.innerHeight}}
function sgHide(){if(SG.box){SG.box.remove();SG.box=null}document.body.style.paddingBottom="";SG.inp=null}
function sgPlace(){
 if(!SG.box)return;const v=sgView(),h=Math.max(120,Math.min(SG.h||Math.round(v.h*.42),v.h-90));
 SG.box.style.bottom=Math.max(0,window.innerHeight-(v.top+v.h))+"px";SG.box.style.height=h+"px";
 document.body.style.paddingBottom=(h+40)+"px";
 // leva o campo para logo acima da lista, para ver o que já está escrito
 const r=SG.inp.getBoundingClientRect(),lim=v.top+v.h-h-12;
 if(r.bottom>lim||r.top<v.top+60){let el=SG.inp.parentElement;while(el&&el!==document.body){const cs=getComputedStyle(el);if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight)break;el=el.parentElement}
  const d=r.bottom-lim;(el&&el!==document.body?el:document.scrollingElement).scrollBy(0,d)}
}
function sgShow(){
 const inp=SG.inp;if(!inp)return;const dl=document.getElementById(SG.dl);if(!dl){sgHide();return}
 const q=inp.value.trim(),all=[...dl.options].map(o=>o.value);
 const l=(q?all.filter(n=>hit(n,q)):all).slice(0,80);
 if(!l.length||(l.length===1&&l[0]===inp.value)){if(SG.box){SG.box.remove();SG.box=null;document.body.style.paddingBottom=""}return}
 if(!SG.box){SG.box=document.createElement("div");SG.box.className="sugbox";SG.box.innerHTML=`<div class="sg-h"><span class="sg-n"></span><span class="sg-g" style="flex:0 0 44px"></span><span style="flex:1;text-align:right"><button type="button" class="sg-x">Fechar</button></span></div><div class="sg-l"></div>`;
  document.body.appendChild(SG.box);SG.box.addEventListener("mousedown",e=>e.preventDefault());
  $(".sg-x",SG.box).onclick=()=>{const i=SG.inp;sgHide();if(i)i.blur()};
  // arrastar a barrinha para cima ou para baixo muda a altura da lista
  const hd=$(".sg-h",SG.box);hd.addEventListener("pointerdown",e=>{if(e.target.closest(".sg-x"))return;e.preventDefault();const y0=e.clientY,h0=SG.box.offsetHeight;hd.setPointerCapture(e.pointerId);
   const mv=ev=>{SG.h=Math.max(120,Math.min(h0+(y0-ev.clientY),sgView().h-90));SG.box.style.height=SG.h+"px"};
   const up=()=>{hd.removeEventListener("pointermove",mv);try{localStorage.setItem("esmp.sugH",SG.h)}catch(_){}sgPlace()};
   hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",up,{once:true});hd.addEventListener("pointercancel",up,{once:true})})}
 $(".sg-n",SG.box).textContent=l.length+(l.length>=80?"+":"")+" sugest"+(l.length>1?"ões":"ão")+" · arraste a barra";
 const box=$(".sg-l",SG.box);box.innerHTML=l.map((n,i)=>`<button type="button" data-sg="${i}">${esc(n)}</button>`).join("");box.scrollTop=0;
 box.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{const i=SG.inp;i.value=l[+b.dataset.sg];sgHide();i.dispatchEvent(new Event("input",{bubbles:true}));i.dispatchEvent(new Event("change",{bubbles:true}));i.blur()});
 sgPlace();
}
document.addEventListener("focusin",e=>{const t=e.target;if(!(t instanceof HTMLInputElement))return;
 const id=t.dataset.sl||t.getAttribute("list");if(!id){if(SG.box)sgHide();return}
 if(t.getAttribute("list")){t.dataset.sl=id;t.removeAttribute("list");t.setAttribute("autocomplete","off")}
 SG.inp=t;SG.dl=id;setTimeout(sgShow,250)});
document.addEventListener("input",e=>{if(SG.inp&&e.target===SG.inp&&e.isTrusted)sgShow()});
document.addEventListener("focusout",e=>{if(e.target===SG.inp)setTimeout(()=>{if(document.activeElement!==SG.inp)sgHide()},150)});
if(window.visualViewport)visualViewport.addEventListener("resize",()=>{if(SG.box)sgPlace()});

/* garantia da empresa: os orçamentos antigos tinham uma cópia dela nas observações; aqui ela é tirada
   (a garantia agora vem sempre da aba Empresa) */
function condKnown(){const h=DB.condHist||[];return[...new Set([DB.company.cond,COMPANY_DEF.cond,"Garantia de 90 dias no serviço.",GARANTIA_ESM,...h].map(x=>String(x||"").trim()).filter(Boolean))]}
function quoteObs(q){let t=String(q.obs||"").trim();if(!t)return"";for(const c of condKnown()){if(t===c)return"";if(t.startsWith(c))t=t.slice(c.length).trim();else if(t.endsWith(c))t=t.slice(0,-c.length).trim()}return t}
function syncGarantia(){let n=0;DB.col.quotes.forEach(q=>{const o=quoteObs(q);if(o!==String(q.obs||"").trim()){q.obs=o;q.ts=Date.now();n++}});persist();return n}
function rememberCond(old){old=String(old||"").trim();if(!old)return;DB.condHist=[...new Set([...(DB.condHist||[]),old])].slice(-10)}

function parseNFe(txt){const doc=new DOMParser().parseFromString(txt,"application/xml");if(doc.getElementsByTagName("parsererror").length)throw new Error("Arquivo XML inválido.");
 const g=(el,t)=>{if(!el)return"";const x=el.getElementsByTagName(t)[0];return x?x.textContent.trim():""},n=x=>+String(x||"0").replace(",",".")||0;
 const inf=doc.getElementsByTagName("infNFe")[0];if(!inf)throw new Error("Não é um XML de NF-e (falta infNFe).");
 const emit=inf.getElementsByTagName("emit")[0],ide=inf.getElementsByTagName("ide")[0];
 const itens=[...inf.getElementsByTagName("det")].map(det=>{const pr=det.getElementsByTagName("prod")[0],im=det.getElementsByTagName("imposto")[0],q=n(g(pr,"qCom"))||1;
  const tot=n(g(pr,"vProd"))+n(g(pr,"vFrete"))+n(g(pr,"vSeg"))+n(g(pr,"vOutro"))-n(g(pr,"vDesc"))+n(g(im,"vIPI"))+n(g(im,"vICMSST"));
  return{cod:g(pr,"cProd"),ean:g(pr,"cEAN"),nome:g(pr,"xProd"),ncm:g(pr,"NCM"),un:(g(pr,"uCom")||"un").toLowerCase(),q,custo:Math.round(tot/q*100)/100}});
 return{chave:(inf.getAttribute("Id")||"").replace(/^NFe/,""),forn:g(emit,"xNome"),cnpj:g(emit,"CNPJ"),num:g(ide,"nNF"),data:(g(ide,"dhEmi")||g(ide,"dEmi")).slice(0,10),itens,total:n(g(inf.getElementsByTagName("ICMSTot")[0],"vNF")),dups:[...inf.getElementsByTagName("dup")].map(d=>({n:g(d,"nDup"),venc:g(d,"dVenc"),v:n(g(d,"vDup"))})).filter(d=>d.v>0)}}
function nfeMatch(it,forn){const ok=e=>e&&!/sem gtin/i.test(e);return DB.col.catalog.find(o=>o.tipo!=="s"&&((ok(it.ean)&&o.ean===it.ean)||(it.cod&&o.cod===it.cod&&o.forn===forn)))||DB.col.catalog.find(o=>o.tipo!=="s"&&norm(o.nome).trim()===norm(it.nome).trim())}
async function importNFeFiles(files){for(const f of files){let nf;try{nf=parseNFe(await f.text())}catch(e){toast(e.message||"Não foi possível ler o XML.");continue}await nfeReview(nf)}}
function nfeReview(nf){return new Promise(done=>{const dup=nf.chave&&DB.col.catalog.some(o=>(o.mov||[]).some(m=>m.nf===nf.chave));const rows=nf.itens.map(it=>({it,m:nfeMatch(it,nf.forn),on:true}));let mg=DB.opt.nfMg??50;

 ${dup?`<div class="note" style="margin:0;border-left-color:var(--red)"><b>Esta nota já foi lançada.</b> Lançar de novo soma o estoque outra vez.</div>`:""}
 <div class="grid2"><div><label class="lbl" for="nf_mg">Margem para itens novos (%)</label><input class="in-f num" id="nf_mg" type="number" value="${mg}"></div><label class="chk" style="align-self:end"><input type="checkbox" id="nf_up" checked>Atualizar o custo dos itens que já existem</label></div>

 <div class="camlist">${rows.map((r,i)=>`<label class="camrow" style="cursor:pointer"><input type="checkbox" data-nfi="${i}" checked style="width:20px;height:20px;flex:0 0 auto"><span class="d"><b>${esc(r.it.nome)}</b><br><span class="muted">${f1(r.it.q)} ${esc(r.it.un)} · custo ${brl(r.it.custo)}${r.it.ncm?" · NCM "+esc(r.it.ncm):""}</span><br><span style="font-size:12.5px;color:${r.m?"#2e8b45":"var(--red)"}">${r.m?`Soma ao estoque de “${esc(r.m.nome)}” (${r.m.estoque||0} → ${f1((r.m.estoque||0)+r.it.q)})`:"Novo item no catálogo"}</span></span></label>`).join("")}</div>
 <div class="row" style="justify-content:flex-end"><button class="btn pri" id="nf_ok">Lançar ${rows.length} itens no estoque</button></div></div>`);wireClose(m);
 m.querySelectorAll("[data-nfi]").forEach(c=>c.onchange=()=>{rows[+c.dataset.nfi].on=c.checked;$("#nf_ok",m).textContent=`Lançar ${rows.filter(r=>r.on).length} itens no estoque`});
 m.querySelector("[data-close]").addEventListener("click",()=>done());
 $("#nf_ok",m).onclick=()=>{mg=+$("#nf_mg",m).value||0;DB.opt.nfMg=mg;const up=$("#nf_up",m).checked,mov={nf:nf.chave,num:nf.num,forn:nf.forn,data:nf.data||today()};let nN=0,nU=0;
  rows.filter(r=>r.on).forEach(({it,m:ex})=>{if(ex){const o=Object.assign({},ex);o.estoque=Math.round(((+o.estoque||0)+it.q)*1000)/1000;if(up)o.custo=it.custo;o.cod=o.cod||it.cod;o.ean=o.ean||it.ean;o.ncm=o.ncm||it.ncm;o.forn=o.forn||nf.forn;o.mov=[...(o.mov||[]),Object.assign({q:it.q,custo:it.custo},mov)].slice(-30);upsert("catalog",o);nU++}
   else{upsert("catalog",{id:newId("catalog"),nome:it.nome,tipo:"i",un:it.un,custo:it.custo,preco:Math.round(it.custo*(1+mg/100)*100)/100,estoque:it.q,cod:it.cod,ean:it.ean,ncm:it.ncm,forn:nf.forn,mov:[Object.assign({q:it.q,custo:it.custo},mov)]});nN++}});
  if($("#nf_ap",m)&&$("#nf_ap",m).checked){const ds=nf.dups.length?nf.dups:[{n:"",venc:nf.data||today(),v:nf.total}];ds.forEach((d,i)=>upsert("fin",{id:newId("fin"),tipo:"p",desc:`NF ${nf.num||""} · ${nf.forn||"fornecedor"}${ds.length>1?` (${i+1}/${ds.length})`:""}`,valor:d.v,venc:d.venc||today(),cat:"Materiais e equipamentos",forma:"Boleto",pago:"",nf:nf.chave}))}
  m.remove();toast(`Nota ${nf.num||""} lançada: ${nU} itens atualizados, ${nN} novos`);done();if(tab==="catalogo")vCatalog()}})}

const FOCUS={hom:"https://homologacao.focusnfe.com.br",prod:"https://api.focusnfe.com.br"};
const FX=()=>{DB.fiscal=Object.assign({amb:"hom",tokH:"",tokP:"",ibge:"1501402",opSN:"2",regEsp:"0",trib:"1",serie:1,ndps:0,serv:[],nfe:{nat:"Venda de mercadoria",cfop:"5102",csosn:"102",orig:"0",pis:"",cofins:""}},DB.fiscal||{});return DB.fiscal};
const fxTok=()=>{const f=FX();return(f.amb==="prod"?f.tokP:f.tokH)||""};
const fxBase=()=>FOCUS[FX().amb==="prod"?"prod":"hom"];
const onlyNum=t=>String(t||"").replace(/\D/g,"");
function httpH(method,url,body,headers){headers=headers||{};
 if(window.ESMAndroid&&ESMAndroid.http2)return new Promise(res=>{const id=++httpSeq;HTTPCB[id]=res;ESMAndroid.http2(id,method,url,body==null?"":body,"application/json",JSON.stringify(headers))});
 if(window.ESMAndroid&&ESMAndroid.http)return Promise.resolve({code:-2,text:""});
 const h=Object.assign({},headers);if(body!=null)h["Content-Type"]="application/json";
 return fetch(url,{method,headers:h,body:body==null?undefined:body}).then(async r=>({code:r.status,text:await r.text()}),()=>({code:0,text:""}))}
async function focus(method,path,body){const t=fxTok();if(!t)throw new Error("Configure o token da Focus NFe em Empresa → Notas fiscais.");
 const r=await httpH(method,fxBase()+"/v2"+path,body==null?null:JSON.stringify(body),{Authorization:"Basic "+btoa(t+":"),Accept:"application/json"});
 if(r.code===-2)throw new Error("Esta versão do app no celular ainda não envia nota. Compile o app de novo (git pull + ▶) para liberar a emissão.");
 if(r.code===0)throw new Error("Sem conexão com a Focus NFe. No navegador a emissão é bloqueada por segurança; use o app no celular.");
 let j={};try{j=JSON.parse(r.text||"{}")}catch(_){j={mensagem:r.text}}
 if(r.code===401)throw new Error("Token recusado pela Focus NFe. Confira o token do ambiente "+(FX().amb==="prod"?"de produção":"de homologação")+".");
 return{code:r.code,j}}
const fxErr=j=>(j.erros||[]).map(e=>`${e.mensagem||""}${e.correcao?" — "+e.correcao:""}`).join(" | ")||j.mensagem||j.mensagem_sefaz||"";

function nfSave(n){n.ts=Date.now();upsert("notas",n)}
async function nfRefresh(n,silent){try{const{code,j}=await focus("GET",`/${n.tipo==="nfe"?"nfe":"nfsen"}/${encodeURIComponent(n.ref)}`);if(code===404){if(!silent)toast("A Focus NFe ainda não encontrou esta nota.");return n}
  Object.assign(n,{status:j.status||n.status,numero:j.numero||n.numero,cv:j.codigo_verificacao||n.cv,chave:j.chave_nfe||n.chave,url:j.url||n.url,pdf:j.url_danfse||j.caminho_danfe||n.pdf,xml:j.caminho_xml_nota_fiscal||n.xml,msg:fxErr(j)||(j.status==="autorizado"?"":n.msg)});nfSave(n);

async function nfPoll(n){for(let i=0;i<15&&n.status==="processando_autorizacao";i++){await new Promise(r=>setTimeout(r,4000));await nfRefresh(n,true)}
 if(window.ESMAndroid&&ESMAndroid.notify&&n.status!=="processando_autorizacao")try{ESMAndroid.notify(`Nota ${NFST[n.status]?NFST[n.status].n:n.status}`,`${n.tomador||""} · ${brl(n.valor)}${n.numero?" · Nº "+n.numero:""}`)}catch(_){}
 toast(n.status==="autorizado"?`Nota autorizada · Nº ${n.numero||""}`:n.status==="processando_autorizacao"?"Nota ainda em processamento. Toque em Atualizar daqui a pouco.":`Nota com problema: ${n.msg||n.status}`);if(tab==="empresa")render()}

const CT_SIN={computador:["informatica","maquinas","equipamentos","aparelhos"],notebook:["informatica","maquinas","equipamentos","aparelhos"],pc:["informatica","maquinas","equipamentos"],impressora:["maquinas","equipamentos","aparelhos"],formatacao:["informatica","programas"],formatar:["informatica","programas"],software:["programas","informatica"],sistema:["sistemas","programas"],site:["paginas","eletronicas"],rede:["informatica","instalacao"],camera:["instalacao","aparelhos","equipamentos","vigilancia","monitoramento"],cameras:["instalacao","aparelhos","equipamentos","vigilancia","monitoramento"],cftv:["instalacao","aparelhos","equipamentos","vigilancia","monitoramento"],alarme:["instalacao","aparelhos","equipamentos","vigilancia","monitoramento"],cerca:["instalacao","aparelhos","equipamentos"],interfone:["instalacao","aparelhos","equipamentos"],portao:["instalacao","aparelhos","equipamentos"],fechadura:["instalacao","aparelhos","equipamentos"],monitoramento:["monitoramento","vigilancia"],conserto:["conserto","assistencia","manutencao"],reparo:["conserto","assistencia","manutencao"],arrumar:["conserto","manutencao"],eletrica:["eletrica","obras","instalacao"],cabeamento:["instalacao","eletrica"],curso:["treinamento","instrucao"],treinamento:["treinamento","instrucao"]};
const CT_STOP=new Set(["de","da","do","das","dos","e","em","para","com","a","o","as","os","no","na","um","uma","por","servico","servicos"]);
function ctribSearch(q){const w=norm(q).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(t=>t.length>1&&!CT_STOP.has(t));if(!w.length)return[];const dg=onlyNum(q);
 return Object.entries(CTRIB).map(([c,t])=>{const words=norm(t).replace(/[^a-z0-9 ]/g," ").split(/\s+/);let sc=0;if(dg.length>=2&&c.startsWith(dg))sc+=10;
  w.forEach(x=>{if(words.some(y=>y.startsWith(x)||(x.length>4&&y.startsWith(x.slice(0,-1)))))sc+=3;else sc+=(CT_SIN[x]||[]).filter(z=>words.some(y=>y.startsWith(z))).length});if(sc&&c.startsWith("15")&&!w.some(x=>/^banc|^financ|^cart/.test(x)))sc-=2;return{c,t,sc}}).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc||a.c.localeCompare(b.c)).filter((o,i,L)=>o.sc>=Math.max(2,L[0].sc*.5)).slice(0,15)}

  m.querySelectorAll("[data-cnq]").forEach(b=>b.onclick=()=>{$("#ct_q",m).value=b.dataset.cnq;draw()})};
 $("#ct_q",m).oninput=draw;draw();drawC();setTimeout(()=>$("#ct_q",m).focus(),50);

 $("#nf_cp",m).value=v.comp;const dc=()=>$("#nf_dc",m).textContent=docCheck($("#nf_d",m).value);dc();$("#nf_d",m).oninput=dc;
 const ctd=()=>{const c=onlyNum($("#nf_ct",m).value),t=CTRIB[c];$("#nf_ctd",m).textContent=t?ctFmt(c)+" — "+t:c.length===6?"Código fora da lista nacional. Confira.":"";$("#nf_svw",m).style.display=t&&!f.serv.some(s=>s.ctn===c)?"flex":"none"};ctd();$("#nf_ct",m).oninput=ctd;
 $("#nf_cs",m).onclick=()=>ctribPick($("#nf_ds",m).value.split(/[—.;]/).pop().trim().slice(0,60),(c)=>{$("#nf_ct",m).value=c;ctd()});
 if($("#nf_sp",m))$("#nf_sp",m).onchange=e=>{const s=f.serv[+e.target.value];if(!s)return;$("#nf_ct",m).value=s.ctn;ctd();if(s.desc&&!$("#nf_ds",m).value.trim())$("#nf_ds",m).value=s.desc};

 $("#nf_go",m).onclick=async()=>{const doc=onlyNum($("#nf_d",m).value),ctn=onlyNum($("#nf_ct",m).value),val=num($("#nf_v",m).value),ds=$("#nf_ds",m).value.trim(),mu=onlyNum($("#nf_mu",m).value);

  if(ctn.length!==6){toast("O código de tributação nacional tem 6 dígitos.");return}if(!(val>0)){toast("Informe o valor do serviço.");return}if(!ds){toast("Descreva o serviço.");return}if(mu.length!==7){toast("O código IBGE do município tem 7 dígitos.");return}
  const fx=FX();if($("#nf_sv",m).checked&&$("#nf_svw",m).style.display!=="none"&&CTRIB[ctn])fx.serv.push({n:CTRIB[ctn].replace(/\.$/,"").slice(0,60),ctn});fx.ndps=(+fx.ndps||0)+1;ls("esmp.db",DB);const ref=`esm-nfse-${onlyNum(co.cnpj)}-${fx.serie}-${fx.ndps}`;
  const now=new Date(),tz=-now.getTimezoneOffset(),pad=x=>String(Math.abs(x)).padStart(2,"0"),iso=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}${tz>=0?"+":"-"}${pad(Math.floor(Math.abs(tz)/60))}${pad(Math.abs(tz)%60)}`;
  const body={data_emissao:iso,serie_dps:+fx.serie||1,numero_dps:fx.ndps,data_competencia:$("#nf_cp",m).value||today(),emitente_dps:1,codigo_municipio_emissora:+fx.ibge,cnpj_prestador:onlyNum(co.cnpj),codigo_opcao_simples_nacional:+fx.opSN,regime_especial_tributacao:+fx.regEsp,
   [doc.length===14?"cnpj_tomador":"cpf_tomador"]:doc,codigo_municipio_prestacao:+mu,codigo_tributacao_nacional_iss:ctn,descricao_servico:ds,valor_servico:Math.round(val*100)/100,tributacao_iss:+fx.trib};
  const b=$("#nf_go",m);b.disabled=true;b.textContent="Enviando…";
  try{const{code,j}=await focus("POST","/nfsen?ref="+encodeURIComponent(ref),body);
   if(code>=400){b.disabled=false;b.textContent="Emitir NFS-e";fx.ndps--;ls("esmp.db",DB);toast("Recusada: "+(fxErr(j)||"verifique os dados"));return}
   const n={id:newId("notas"),tipo:"nfse",ref,amb:fx.amb,status:j.status||"processando_autorizacao",tomador:$("#nf_t",m).value.trim(),doc,valor:val,desc:ds,ctn,cliId:v.cliId||0,quoteId:v.quoteId||0,osId:v.osId||0,data:today(),protocolo:j.protocolo||""};
   nfSave(n);m.remove();toast("NFS-e enviada. Aguardando autorização…");nfPoll(n)}catch(e){b.disabled=false;b.textContent="Emitir NFS-e";fx.ndps--;ls("esmp.db",DB);toast(e.message)}};
}

  const rd=()=>{m.querySelectorAll("[data-ed]").forEach(e=>it[+e.dataset.ed].d=e.value);m.querySelectorAll("[data-eq]").forEach(e=>it[+e.dataset.eq].q=num(e.value));m.querySelectorAll("[data-eu]").forEach(e=>it[+e.dataset.eu].un=e.value);m.querySelectorAll("[data-ep]").forEach(e=>it[+e.dataset.ep].p=num(e.value));m.querySelectorAll("[data-en]").forEach(e=>it[+e.dataset.en].ncm=onlyNum(e.value));
   ["n","d","cep","lg","nu","ba","mu","uf"].forEach(k=>pre[{n:"nome",d:"doc",cep:"cep",lg:"lg",nu:"nu",ba:"ba",mu:"mu",uf:"uf"}[k]]=$("#ne_"+k,m).value)};
  m.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{rd();it.splice(+b.dataset.ex,1);draw()});
  $("#ne_add",m).onclick=()=>{rd();catalogPick("i",c=>{it.push({d:c.nome,q:1,p:+c.preco||0,ncm:c.ncm||"",cod:c.cod||String(c.id),un:c.un||"un"});draw()})};
  $("#ne_pc",m).onclick=()=>{rd();clientPick(c=>{Object.assign(pre,{cliId:c.id,nome:c.nome,doc:c.doc||"",cep:c.cep||"",lg:c.end||"",nu:c.num||"",ba:c.bairro||"",mu:c.cidade||"",uf:c.uf||"PA"});draw()})};
  $("#ne_go",m).onclick=async()=>{rd();const doc=onlyNum(pre.doc);if(!N.pis||!N.cofins){toast("Preencha o CST de PIS e COFINS em Empresa → Notas fiscais (com seu contador).");return}
   if(!(doc.length===11||doc.length===14)){toast("CPF ou CNPJ do destinatário inválido.");return}if(!it.length){toast("Inclua ao menos um produto.");return}
   const sem=it.find(x=>onlyNum(x.ncm).length!==8);if(sem){toast(`Informe o NCM (8 dígitos) de: ${sem.d}`);return}
   if(!pre.lg||!pre.nu||!pre.ba||!pre.mu||onlyNum(pre.cep).length!==8){toast("Complete o endereço do destinatário (logradouro, número, bairro, município e CEP).");return}
   const fx=FX(),ref=`esm-nfe-${onlyNum(co.cnpj)}-${Date.now()}`,tot=it.reduce((a,x)=>a+x.q*x.p,0);

    items:it.map((x,i)=>({numero_item:i+1,codigo_produto:x.cod||String(i+1),descricao:x.d,cfop:N.cfop,unidade_comercial:x.un,quantidade_comercial:x.q,valor_unitario_comercial:x.p,valor_bruto:Math.round(x.q*x.p*100)/100,unidade_tributavel:x.un,quantidade_tributavel:x.q,valor_unitario_tributavel:x.p,codigo_ncm:onlyNum(x.ncm),icms_origem:+N.orig,icms_situacao_tributaria:N.csosn,pis_situacao_tributaria:N.pis,cofins_situacao_tributaria:N.cofins}))};

   try{const{code,j}=await focus("POST","/nfe?ref="+encodeURIComponent(ref),body);if(code>=400){b.disabled=false;b.textContent="Emitir NF-e";toast("Recusada: "+(fxErr(j)||"verifique os dados"));return}
    const n={id:newId("notas"),tipo:"nfe",ref,amb:fx.amb,status:j.status||"processando_autorizacao",tomador:pre.nome,doc,valor:tot,desc:it.map(x=>`${fx_(x.q)} ${x.d}`).join("; "),cliId:pre.cliId||0,quoteId:pre.quoteId||0,data:today(),itens:it};

 <div class="card stack"><h3>Logo</h3><div class="row"><img src="${co.logo||LOGO_DEF}" alt="Logo" style="height:56px;background:#fff;padding:6px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)"><button class="btn" id="lg">${co.logo?"Trocar logo":"Enviar outra logo (PNG)"}</button>${co.logo?`<button class="btn sm ghost" id="lgx">Usar a logo oficial</button>`:`<span class="muted" style="font-size:13px">Logo oficial da ESM aplicada.</span>`}</div><input type="file" id="lgf" accept="image/*" hidden></div>
