<style>
/* Layout: app claro e minimalista no estilo Apple — barra translúcida no topo, conteúdo em cartões arredondados, abas na base; documentos A4 claros */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --panel2:#f0f0f3; --line:rgba(0,0,0,.09); --line2:#d2d2d7;
  --fg:#1d1d1f; --muted:#6e6e73; --red:#F22B0C; --red2:#d42308; --graf:#262626;
  --ok:#2e8b45; --warn:#c77700; --info:#0a64c8;
  --f-body:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:18px; --sh:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.8); --field:#ffffff; --sheet:#ffffff; --hover:#e6e6ea; --canvas:#ebebef; --navc:#8e8e93; --onpress:#ffffff; --hatch:#ececf0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:rgba(255,255,255,.1);--line2:#3a3a3c;--fg:#f5f5f7;--muted:#98989d;--graf:#48484a;--sh:0 1px 2px rgba(0,0,0,.4);--glass:rgba(22,22,24,.82);--field:#1c1c1e;--sheet:#1c1c1e;--hover:#3a3a3c;--canvas:#121214;--navc:#8e8e93;--onpress:#636366;--hatch:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:rgba(255,255,255,.1);--line2:#3a3a3c;--fg:#f5f5f7;--muted:#98989d;--graf:#48484a;--sh:0 1px 2px rgba(0,0,0,.4);--glass:rgba(22,22,24,.82);--field:#1c1c1e;--sheet:#1c1c1e;--hover:#3a3a3c;--canvas:#121214;--navc:#8e8e93;--onpress:#636366;--hatch:#2c2c2e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(242,43,12,.25)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand img{height:26px}
.brand b{color:var(--red);font-weight:700}
.pname{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}

/* abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin:0 auto}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navc);font-size:10.5px;font-weight:700;letter-spacing:.01em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--red)}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.view{padding-block:22px}
.wrapc{max-width:1080px;margin:0 auto}

/* tipografia e base */
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.02em}
h2{font-size:32px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.in-f,select.in-f,textarea.in-f{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;min-width:0;transition:border-color .2s,box-shadow .2s}
.in-f:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(242,43,12,.12)}
textarea.in-f{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:0;border-radius:980px;padding:10px 18px;font-weight:700;font-size:14px;color:var(--fg);transition:background .2s,transform .1s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:none;color:var(--red)}
.btn.ghost:hover{background:rgba(242,43,12,.07)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:980px;background:var(--panel2);color:var(--muted)}
.tag.r{background:rgba(242,43,12,.1);color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:980px;font-weight:700;font-size:13.5px;z-index:90;max-width:90vw;text-align:center;backdrop-filter:blur(10px)}

/* projetos */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hero p{margin:8px 0 0;color:var(--muted);max-width:60ch;font-size:16px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pitem{text-align:left;background:var(--panel);border:0;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .2s}
.pitem:active{transform:scale(.98)}
.pitem.cur{box-shadow:0 0 0 2px var(--red),var(--sh)}
.pitem .t{font-weight:700;font-size:16px;letter-spacing:-.01em}
.pitem .m{font-size:13px;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px}
.feat div{background:var(--panel);border-radius:var(--r);padding:16px;font-size:13.5px;color:var(--muted);box-shadow:var(--sh)}
.feat b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}

/* folhas (modais) */
.sugbox{position:fixed;left:0;right:0;z-index:80;background:var(--sheet);border-top:1px solid var(--line,rgba(127,127,127,.25));box-shadow:0 -10px 30px rgba(0,0,0,.25);border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sugbox .sg-h{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;touch-action:none;cursor:ns-resize}
.sugbox .sg-g{width:44px;height:5px;border-radius:3px;background:var(--muted,#888);opacity:.5;margin:0 auto}
.sugbox .sg-n{font-size:12.5px;color:var(--muted,#888);flex:1}.sugbox .sg-x{background:none;border:0;color:var(--red);font:inherit;font-weight:700;padding:6px}
.sugbox .sg-l{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 8px 8px}
.sugbox .sg-l button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line,rgba(127,127,127,.18));color:var(--fg);font:inherit;font-size:15px;padding:12px 8px;line-height:1.3}
.sugbox .sg-l button:active{background:rgba(127,127,127,.15)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@media (min-width:700px){.modal{align-items:center}}
.sheet{background:var(--sheet);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{border-radius:22px}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.steps{display:flex;gap:6px;margin:8px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--panel2)}
.steps i.on{background:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.opt{text-align:left;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--panel)}
.opt b{font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.thumb{height:118px;border-radius:10px;background:#fff;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.thumb i{position:absolute;display:block;border-radius:2px}

/* planta */
.pl{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.pl{grid-template-columns:1fr 360px;height:calc(100vh - 132px)}}
.cvw{position:relative;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--glass);border-bottom:1px solid var(--line);scrollbar-width:none}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel2);border:0;border-radius:980px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--fg);transition:background .2s}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--graf);color:#fff}
.cvbox{position:relative;height:56vh;min-height:320px;touch-action:none;background:var(--canvas)}
@media (min-width:900px){.cvbox{height:auto;flex:1}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;border-radius:50%;background:var(--glass);color:var(--fg);backdrop-filter:blur(10px);border:0;box-shadow:var(--sh);font-size:18px;font-weight:700}
.hint{position:absolute;left:12px;top:12px;right:64px;font-size:12.5px;background:var(--glass);backdrop-filter:blur(10px);border-radius:14px;padding:8px 12px;pointer-events:none;box-shadow:var(--sh);color:var(--fg)}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}
.side .in{padding-block:18px;display:flex;flex-direction:column;gap:16px}
.dori{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dori div{background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center}
.dori small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.dori b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:0;border-radius:980px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--graf);color:#fff}
.camlist{display:flex;flex-direction:column;gap:6px}
.camrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.camrow .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.camrow .d{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--red)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--red);width:18px;height:18px}

/* orçamento */
.tblw{overflow-x:auto;background:var(--panel);border-radius:var(--r);box-shadow:var(--sh)}
table.bt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:660px}
.bt th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;padding:12px;border-bottom:1px solid var(--line)}
.bt td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.bt td.r,.bt th.r{text-align:right}
.bt input{width:96px;background:var(--bg);border:0;border-radius:9px;padding:7px 9px;text-align:right}
.bt input.q{width:66px}
.bt input.desc{width:100%;text-align:left;background:transparent}
.bt input.desc:focus{background:var(--bg)}
.bt .grp td{background:var(--bg);font-weight:700;font-size:12px;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tot div{background:var(--panel);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tot small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tot b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.tot .big{background:var(--graf);color:#fff}
.tot .big small{color:#c7c7cc}
.tot .big b{color:#fff}

/* documento */
.doctools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.prevwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.pgbox{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 36px rgba(0,0,0,.08);border-radius:4px;overflow:hidden}
.pgbox>.pg{transform-origin:0 0;position:absolute;left:0;top:0}
#exportArea{position:fixed;left:-12000px;top:0}

/* login */
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;background:#262626;color:#FFFFF0;overflow:auto;display:flex;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));font-family:var(--f-body)}
.lg-glow{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) - 30px);width:340px;height:340px;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,rgba(242,43,12,.25) 0,rgba(242,43,12,0) 70%);opacity:0;pointer-events:none}
.lg-col{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
.lg-logo{width:112px;height:auto;opacity:0;transform:scale(.7)}
.lg-brand{font-size:20px;font-weight:700;letter-spacing:.22em;padding:20px 0 4px;text-align:center}
.lg-sub{font-size:14px;color:#B9B9AD;padding-bottom:28px;text-align:center}
.lg-form{width:100%}
.lg-form input{width:100%;background:none;border:0;outline:none;color:#FFFFF0;font-size:16px;padding:14px 0 10px;font-family:inherit}
.lg-form input::placeholder{color:#B9B9AD}
.lg-ln{display:block;height:1px;background:#555;transition:background .2s,height .2s}
.lg-form input:focus+.lg-ln,.lg-pr:focus-within+.lg-ln{background:#F22B0C;height:2px}
.lg-pr{display:flex;align-items:center}
.lg-eye{background:none;border:0;color:#B9B9AD;font-size:12px;font-weight:700;padding:12px 0 12px 12px}
.lg-err{width:100%;color:#F22B0C;font-size:13px;padding-top:12px;opacity:0;transition:opacity .25s;min-height:1em}
.lg-err.on{opacity:1}
.lg-bw{position:relative;width:100%;margin-top:20px;overflow:hidden}
.lg-go{display:block;width:100%;height:52px;background:#F22B0C;color:#fff;border:0;font-size:15px;font-weight:700;letter-spacing:.12em;font-family:inherit}
.lg-prog{position:absolute;left:0;bottom:0;width:90px;height:3px;background:#FFFFF0;display:none}
.lg-prog.on{display:block;animation:lgprog 1s linear infinite}
@keyframes lgprog{from{transform:translateX(-90px)}to{transform:translateX(420px)}}
.lg-links{display:flex;align-items:center;justify-content:center}
.lg-links span{color:#B9B9AD}
.lg-links button,.lg-local,.lg-lk{background:none;border:0;color:#B9B9AD;font-size:13px;padding:14px 10px 10px;font-family:inherit;text-decoration:none;text-align:center}
.lg-status{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.lg-status.fade{animation:lgfade .35s ease}
.lg-stT{font-size:20px;font-weight:700;padding:4px 0 10px}
.lg-stM{font-size:14px;color:#B9B9AD;line-height:1.5;white-space:pre-line;margin-bottom:20px}
.lg-demo{font-size:12px;color:#8d8d84;text-align:center;margin-top:18px}
@keyframes lgfade{from{opacity:0}to{opacity:1}}
.shake{animation:lgshake .42s}
@keyframes lgshake{0%,100%{transform:none}14%{transform:translateX(-24px)}28%{transform:translateX(24px)}42%{transform:translateX(-18px)}57%{transform:translateX(18px)}71%{transform:translateX(-8px)}85%{transform:translateX(8px)}}
.lg-rv{opacity:0;transform:translateY(16px)}
#login.in .lg-logo{animation:lglogo .75s cubic-bezier(.34,1.56,.64,1) forwards}
#login.in .lg-glow{animation:lgglowin 1.1s ease forwards,lgglow 2.4s 1.1s ease-in-out infinite alternate}
#login.in .lg-rv{animation:lgrise .45s cubic-bezier(.2,.7,.3,1) forwards}
#login.in .lg-rv:nth-of-type(1),#login.in .lg-brand{animation-delay:.45s}
#login.in .lg-sub{animation-delay:.54s}#login.in .lg-form{animation-delay:.63s}#login.in .lg-bw{animation-delay:.72s}#login.in .lg-links{animation-delay:.81s}#login.in .lg-local{animation-delay:.9s}
@keyframes lglogo{to{opacity:1;transform:none}}
@keyframes lgglowin{to{opacity:1}}
@keyframes lgglow{from{opacity:1}to{opacity:.55}}
@keyframes lgrise{to{opacity:1;transform:none}}
#login.out{animation:loginOut .45s ease forwards}

 const dsc=Object.getOwnPropertyDescriptor(p,"plan");if(!dsc||!dsc.get){delete p.plan;delete p.cams;Object.defineProperty(p,"plan",{get(){return this.floors[this.fi].plan},set(v){this.floors[this.fi].plan=v},enumerable:false,configurable:true});Object.defineProperty(p,"cams",{get(){return this.floors[this.fi].cams},set(v){this.floors[this.fi].cams=v},enumerable:false,configurable:true})}return p}

/* ================= cálculos ================= */
const libOf=c=>LIB.find(l=>l.id===c.lib)||LIB[0];
function hfov(c){const l=libOf(c);if(l.type==="Fisheye")return 360;if(l.hfov&&!l.lenses.length&&!l.vf)return l.hfov;const f=c.lens||l.lens||2.8;return 2*Math.atan(l.sensorW/(2*f))*180/Math.PI}
const isWifi=c=>libOf(c).tech==="WiFi";
function resH(c){return RESH[libOf(c).mp]||1920}
function doriDist(c,ppm){const h=hfov(c);if(h>=360)return resH(c)/(ppm*Math.PI*2)*1.4;return resH(c)/(2*ppm*Math.tan(h*Math.PI/360))}
function camNo(c){return allCams().indexOf(c)+1}
function cableLen(c){if(isWifi(c))return 0;if(c.cable>0)return c.cable;const fp=floorOf(c).plan,d=fp.dvr;return(Math.abs(c.x-d.x)+Math.abs(c.y-d.y))/fp.scale*1.1+3}
function storage(){
 const cfg=S.cfg;let kbps=0;const per=allCams().map(c=>{if(isWifi(c))return 0;const b=(BITRATE[libOf(c).mp]||1280)*(cfg.codec==="H.265"?1:1.8)*(cfg.fps/15);kbps+=b;return b});
 const gb=kbps*1000/8*3600*cfg.hours*cfg.days*(cfg.motion/100)/1e9;
 const tb=gb*1.1/1000;const opts=[1,2,3,4,6,8,10,12];let hd=opts.find(o=>o>=tb)||12;
 return{per,kbps,mbps:kbps/1000,gb,tb,hd}
}
function bom(){
 const P=k=>S.prices[k]??PRICE_DEF[k];const items=[];const cams=allCams();
 const add=(key,grp,desc,qty,unit,price)=>{if(qty<=0)return;const q=S.qty[key]??qty;items.push({key,grp,desc:S.desc?.[key]||desc,qty:q,auto:qty,unit,price:S.prices[key]??price,base:price})};
 const g={};cams.forEach(c=>{g[c.lib]=(g[c.lib]||0)+1});
 Object.entries(g).forEach(([id,n])=>{const l=LIB.find(x=>x.id===id);add("cam_"+id,"Equipamentos",S.cfg.showBrand?`Câmera ${l.brand} ${l.model} (${TECHN[l.tech]} ${l.mp}MP ${l.type}${l.night!=="IR"?" "+NIGHTN[l.night]:""})`:`Câmera ${l.type} ${TECHN[l.tech]} ${l.mp}MP${l.night!=="IR"?" "+NIGHTN[l.night]:""}`,n,"un",l.price)});
 const wired=cams.filter(c=>!isWifi(c)),wifi=cams.filter(isWifi);
 const nHD=wired.filter(c=>libOf(c).tech==="HD").length,nIP=wired.length-nHD;
 if(wifi.length){add("sd","Equipamentos","Cartão microSD 128 GB para câmera Wi-Fi",wifi.length,"un",P("sd"));const wb=wifi.filter(c=>libOf(c).type==="Bullet").length;add("fonte1","Equipamentos","Fonte 12 V 1 A individual",wb,"un",P("fonte1"))}
 if(wired.length){const ch=[4,8,16,32].find(x=>x>=wired.length)||32;const k=(nHD?"dvr":"nvr")+ch;
  add(k,"Equipamentos",nHD?`Gravador DVR multi-HD ${ch} canais (aceita câmeras IP)`:`Gravador NVR ${ch} canais`,1,"un",P(k));
  const st=storage();add("hd"+st.hd,"Equipamentos",`HD para CFTV ${st.hd} TB (${S.cfg.days} dias de gravação)`,1,"un",P("hd"+st.hd));
 }
 if(nIP){const sw=[4,8,16].find(x=>x>=nIP)||16;add("sw"+sw,"Equipamentos",`Switch PoE ${sw} portas`,Math.ceil(nIP/16)||1,"un",P("sw"+sw))}
 if(nHD)add("fonte","Equipamentos","Fonte colmeia 12 V 10 A",Math.ceil(nHD/8),"un",P("fonte"));
 if(S.cfg.nobreak&&wired.length)add("nobreak","Equipamentos","Nobreak 1200 VA para gravador",1,"un",P("nobreak"));
 const mHD=Math.ceil(cams.filter(c=>libOf(c).tech==="HD").reduce((a,c)=>a+cableLen(c),0));
 const mIP=Math.ceil(cams.filter(c=>libOf(c).tech==="IP").reduce((a,c)=>a+cableLen(c),0));
 add("coax","Infraestrutura","Cabo coaxial bipolar 4 mm 80% malha",mHD,"m",P("coax"));
 add("utp","Infraestrutura","Cabo UTP Cat5e",mIP,"m",P("utp"));
 add("bnc","Infraestrutura","Conector BNC de mola",nHD*2,"un",P("bnc"));
 add("p4","Infraestrutura","Conector P4 macho",nHD,"un",P("p4"));
 add("rj45","Infraestrutura","Conector RJ45 Cat5e",nIP*2,"un",P("rj45"));
 add("caixa","Infraestrutura","Caixa de passagem para câmera",wired.length,"un",P("caixa"));
 add("labCam","Serviços","Instalação e ajuste de câmera",cams.length,"un",P("labCam"));
 add("labM","Serviços","Passagem e organização de cabeamento",mHD+mIP,"m",P("labM"));
 if(cams.length)add("labCfg","Serviços",wired.length?"Configuração do gravador e acesso remoto pelo app":"Configuração das câmeras Wi-Fi no app",1,"vb",P("labCfg"));
 S.extra.forEach(e=>items.push({key:"x_"+e.id,grp:e.grp||"Equipamentos",desc:e.desc,qty:+e.qty||0,unit:e.unit||"un",price:+e.price||0,extra:e}));
 const mk=1+S.cfg.markup/100;
 items.forEach(i=>{i.sale=i.grp==="Serviços"||i.extra?.fixed?i.price:i.price*mk;i.total=i.sale*i.qty;i.cost=i.price*i.qty});
 const mat=items.filter(i=>i.grp!=="Serviços").reduce((a,i)=>a+i.total,0);
 const srv=items.filter(i=>i.grp==="Serviços").reduce((a,i)=>a+i.total,0);
 const cost=items.reduce((a,i)=>a+(i.grp==="Serviços"?0:i.cost),0);
 const sub=mat+srv,disc=sub*S.cfg.discount/100,total=sub-disc;
 return{items,mat,srv,sub,disc,total,cost,margin:total-cost-srv,mHD,mIP}
}

function importDXF(txt){

  if(ent.t==="ARC"&&ent.r){const a0=(ent.a0||0)*Math.PI/180;let a1=(ent.a1||0)*Math.PI/180;if(a1<a0)a1+=Math.PI*2;const n=Math.max(4,Math.ceil((a1-a0)/(Math.PI/12)));for(let k=0;k<n;k++){const p=a0+(a1-a0)*k/n,q=a0+(a1-a0)*(k+1)/n;segs.push([ent.cx+ent.r*Math.cos(p),ent.cy+ent.r*Math.sin(p),ent.cx+ent.r*Math.cos(q),ent.cy+ent.r*Math.sin(q)])}}};

 for(const[c,v]of pairs){
  if(c==="0"){if(v==="VERTEX"&&poly){ent={t:"VERTEX"};continue}if(v==="SEQEND"&&poly){ent=poly;flush();poly=null;ent=null;pts=[];continue}flush();ent={t:v};pts=[];closed=false;if(v==="POLYLINE"){poly=ent}continue}
  if(!ent)continue;const n=parseFloat(v);
  if(ent.t==="LINE"){if(c==="10")ent.x1=n;if(c==="20")ent.y1=n;if(c==="11")ent.x2=n;if(c==="21")ent.y2=n}
  else if(ent.t==="LWPOLYLINE"){if(c==="10")pts.push([n,0]);if(c==="20"&&pts.length)pts[pts.length-1][1]=n;if(c==="70")closed=(parseInt(v)&1)===1}
  else if(ent.t==="POLYLINE"){if(c==="70")closed=(parseInt(v)&1)===1}
  else if(ent.t==="VERTEX"&&poly){if(c==="10")pts.push([n,0]);if(c==="20"&&pts.length)pts[pts.length-1][1]=n}
  else if(ent.t==="ARC"){if(c==="10")ent.cx=n;if(c==="20")ent.cy=n;if(c==="40")ent.r=n;if(c==="50")ent.a0=n;if(c==="51")ent.a1=n}
 }flush();
 const ok=segs.filter(q=>q.every(isFinite));if(!ok.length){toast("Não encontrei linhas neste DXF. Exporte como DXF ASCII com linhas e polilinhas.");return}
 let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;ok.forEach(([a,b,c,d])=>{x0=Math.min(x0,a,c);x1=Math.max(x1,a,c);y0=Math.min(y0,b,d);y1=Math.max(y1,b,d)});
 const ext=Math.max(x1-x0,y1-y0);const unit=ext>2000?0.001:ext>200?0.01:1; // mm, cm ou m
 const m=Math.max(4,ext*unit),ppm=Math.min(80,Math.max(8,1600/m)),pad=40;
 const P=S.plan;P.img="";P.scale=ppm;P.w=Math.round((x1-x0)*unit*ppm+pad*2);P.h=Math.round((y1-y0)*unit*ppm+pad*2);
 P.walls=ok.slice(0,4000).map(([a,b,c,d])=>({x1:pad+(a-x0)*unit*ppm,y1:pad+(y1-b)*unit*ppm,x2:pad+(c-x0)*unit*ppm,y2:pad+(y1-d)*unit*ppm})).filter(w=>Math.hypot(w.x2-w.x1,w.y2-w.y1)>1);
 P.dvr={x:P.w/2,y:P.h/2};planImgSrc="";fitPending=true;sizeCv();loadPlanImg();save();sideP();draw();
 toast(`DXF importado: ${P.walls.length} paredes, ${f1((x1-x0)*unit)} × ${f1((y1-y0)*unit)} m${unit===1?"":" (medidas em "+(unit===.001?"mm":"cm")+")"}. Confira a escala.`);
}

function cpfOk(d){if(/^(\d)\1{10}$/.test(d))return false;let s1=0,s2=0;for(let i=0;i<9;i++)s1+=(+d[i])*(10-i);const v1=(s1*10%11)%10;for(let i=0;i<10;i++)s2+=(+d[i])*(11-i);const v2=(s2*10%11)%10;return v1===+d[9]&&v2===+d[10]}
function cnpjOk(d){if(/^(\d)\1{13}$/.test(d))return false;const w1=[5,4,3,2,9,8,7,6,5,4,3,2],w2=[6,5,4,3,2,9,8,7,6,5,4,3,2];let s1=0,s2=0;for(let i=0;i<12;i++)s1+=(+d[i])*w1[i];const v1=s1%11<2?0:11-s1%11;for(let i=0;i<13;i++)s2+=(+d[i])*w2[i];const v2=s2%11<2?0:11-s2%11;return v1===+d[12]&&v2===+d[13]}

const HTTPCB={};let httpSeq=0;
window.__httpDone=(id,code,b64)=>{const f=HTTPCB[id];delete HTTPCB[id];let t="";try{t=b64?new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0))):""}catch(_){}f&&f({code:+code,text:t})};
function http(method,url,body,ctype="application/json"){
 if(window.ESMAndroid&&ESMAndroid.http)return new Promise(res=>{const id=++httpSeq;HTTPCB[id]=res;ESMAndroid.http(id,method,url,body==null?"":body,ctype)});
 return fetch(url,{method,headers:body!=null?{"Content-Type":ctype}:{},body:body==null?undefined:body}).then(async r=>({code:r.status,text:await r.text()}),()=>({code:0,text:""}));
}

/* ---------- Firebase (mesmo projeto e mesmas regras do app de orçamento) ---------- */
const FB={apiKey:"",dbUrl:"https://esm-orcamento-default-rtdb.firebaseio.com",adminWa:"5591996374849",brand:"ESM SECURITY",requireLogin:false,allowSignup:true};
try{if(window.ESMAndroid&&ESMAndroid.apiKey){FB.apiKey=ESMAndroid.apiKey()||"";FB.dbUrl=(ESMAndroid.dbUrl()||FB.dbUrl).replace(/\/+$/,"")}}catch(_){}
let AUTH=ls("esmp.auth")||{};
if(AUTH.approved&&AUTH.ok===undefined){AUTH={}} // sessões da versão anterior (login provisório) entram de novo
const saveAuth=()=>ls("esmp.auth",AUTH);
const authAllowed=()=>!!AUTH.ok||(!!AUTH.local&&!FB.requireLogin);
const authCloud=()=>!!AUTH.ok&&!!AUTH.uid&&!AUTH.demo&&!!FB.apiKey;
function friendly(m){m=String(m||"");
 if(/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(m))return"E-mail ou senha incorretos.";
 if(m.includes("EMAIL_EXISTS"))return"Este e-mail já tem cadastro.";if(m.includes("WEAK_PASSWORD"))return"A senha precisa ter ao menos 6 caracteres.";
 if(/INVALID_EMAIL|MISSING_EMAIL/.test(m))return"E-mail inválido.";if(m.includes("MISSING_PASSWORD"))return"Digite a senha.";
 if(m.includes("USER_DISABLED"))return"Este usuário foi desativado.";if(m.includes("TOO_MANY_ATTEMPTS"))return"Muitas tentativas. Aguarde alguns minutos.";
 if(m.includes("OPERATION_NOT_ALLOWED"))return"Login por e-mail e senha não está ativado no Firebase.";if(m.toLowerCase().includes("api key"))return"Chave da API inválida. Confira a configuração do servidor.";
 return m?"Erro: "+m:"Erro desconhecido."}
async function fbAuth(ep,body){const r=await http("POST",`https://identitytoolkit.googleapis.com/v1/${ep}?key=${FB.apiKey}`,JSON.stringify(body));if(!r.code)throw new AuthErr(NET);let o={};try{o=JSON.parse(r.text||"{}")}catch(_){}if(o.error)throw new AuthErr(friendly(o.error.message));return o}
async function refreshTok(){const r=await http("POST",`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`,"grant_type=refresh_token&refresh_token="+encodeURIComponent(AUTH.refresh||""),"application/x-www-form-urlencoded");if(!r.code)throw new AuthErr(NET);let o={};try{o=JSON.parse(r.text||"{}")}catch(_){}if(o.error)throw new AuthErr("Sessão expirada. Entre de novo.");AUTH.token=o.id_token;AUTH.refresh=o.refresh_token||AUTH.refresh;AUTH.exp=Date.now()+1000*(+o.expires_in||3600);saveAuth();return AUTH.token}
async function token(){if(Date.now()>(AUTH.exp||0)-60000)return refreshTok();return AUTH.token}
async function dbReq(method,path,body){const t=await token();const r=await http(method,`${FB.dbUrl}/${path}.json?auth=${encodeURIComponent(t)}`,body===undefined?null:JSON.stringify(body));
 if(!r.code)throw new AuthErr(NET);if(r.code===401||r.code===403)throw new AuthErr("Sem permissão no banco. Confira as regras do Firebase.");if(r.code===404)throw new AuthErr("Banco de dados não encontrado. Confira a URL.");if(r.code>=400)throw new AuthErr(`Erro no banco de dados (${r.code}).`);
 try{return JSON.parse(r.text||"null")}catch(_){return null}}
const errMsg=e=>e instanceof AuthErr?e.message:"Não foi possível concluir. Tente de novo.";
async function session(ep,email,pass){const r=await fbAuth(ep,{email,password:pass,returnSecureToken:true});
 AUTH={uid:r.localId,email:(r.email||email).toLowerCase(),token:r.idToken||"",refresh:r.refreshToken||"",exp:Date.now()+1000*(+r.expiresIn||3600),ok:false,admin:false};saveAuth()}
async function checkAccess(){
 const uid=AUTH.uid;
 if((await dbReq("GET","admins/"+uid))===true){AUTH.ok=true;AUTH.admin=true;saveAuth();return"ok"}
 const u=await fbAuth("accounts:lookup",{idToken:await token()});if(!u.users?.[0]?.emailVerified)return"verify";
 await refreshTok();
 if((await dbReq("GET","aprovados/"+uid))===true){AUTH.ok=true;saveAuth();return"ok"}
 if((await dbReq("GET","recusados/"+uid))===true)return"denied";
 if(AUTH.pend!==uid){await dbReq("PUT","pendentes/"+uid,{email:AUTH.email,criado:{".sv":"timestamp"}});AUTH.pend=uid;saveAuth()}
 return"pending";
}
function authLogout(){AUTH={email:AUTH.email};saveAuth()}

/* ---------- Sincronização (empresas/{uid}, mesmo formato do app de orçamento) ---------- */
const SYNC={running:false,again:false,t:null};
function syncChanged(){DB.dirty=true;ls("esmp.db",DB);if(authCloud()){clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>runSync(false),4000)}}
function syncPrepare(){const uid=AUTH.uid;if(!uid)return;if(DB.dataUid&&DB.dataUid!==uid)wipeData();if(!DB.dataUid){DB.col.catalog=DB.col.catalog.filter(o=>!o.seed);DB.catSeeded=false}DB.dataUid=uid;ls("esmp.db",DB)}
function wipeData(){COLS.forEach(k=>DB.col[k]=[]);Object.keys(DB.del).forEach(k=>DB.del[k]=[]);DB.projects={};DB.order=[];DB.company={...COMPANY_DEF};DB.opt={ask:true,lines:true,noseq:false,cur:0};DB.qseq=0;DB.cfgTs=0;DB.logoTs=0;DB.customCams=[];DB.libPrice={};DB.catSeeded=false;DB.syncLast=0;buildLib();ensureProject()}
function syncStatus(){if(!authCloud())return AUTH.demo?"Prévia: os dados ficam só neste aparelho.":"Seus dados ficam só neste aparelho.";if(SYNC.running)return"Sincronizando…";if(DB.dirty)return"Há alterações salvas no celular que ainda não foram para a nuvem.";if(!DB.syncLast)return"Ainda não sincronizado com a nuvem.";const d=new Date(DB.syncLast);return`Nuvem em dia. Última sincronização: ${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}.`}
async function runSync(manual){
 if(!authCloud()){if(manual)toast("Entre com sua conta para sincronizar.");return}
 if(SYNC.running){SYNC.again=true;return}
 SYNC.running=true;updSyncUI();
 try{const r=await doSync();DB.syncLast=Date.now();ls("esmp.db",DB);if(manual)toast(`Sincronizado: ${r.pushed} enviados, ${r.pulled} recebidos`);if(r.pulled)refreshAfterPull();checkResponses(true);checkSurveys()}
 catch(e){DB.dirty=true;ls("esmp.db",DB);if(manual)toast(errMsg(e))}
 finally{SYNC.running=false;updSyncUI();if(SYNC.again){SYNC.again=false;runSync(false)}}
}
function updSyncUI(){const e=$("#sync_st");if(e)e.textContent=syncStatus()}
function refreshAfterPull(){buildLib();if(!DB.projects[S?.id])ensureProject();else{S=DB.projects[S.id];migrate(S)}if(!document.querySelector(".modal")&&!(tab==="orcamentos"&&QF.open)&&!(tab==="servicos"&&SF.open)&&!(tab==="projetos"&&inProj&&ptab==="planta"))render()}
async function doSync(){
 syncPrepare();const uid=AUTH.uid,now=Date.now();DB.dirty=false;let pushed=0,pulled=0;
 for(const c of COLS){DB.col[c].forEach(o=>{if(!o.ts)o.ts=now});const r=await mergeCol(uid,c,DB.col[c],DB.del[c]);DB.col[c]=r.arr;DB.del[c]=r.del;pushed+=r.pushed;pulled+=r.pulled}
 // projetos de CFTV (exemplos não vão para a nuvem)
 const samples=Object.values(DB.projects).filter(p=>p.sample);
 const pr=await mergeCol(uid,"projetos",Object.values(DB.projects).filter(p=>!p.sample).map(p=>{if(!p.ts)p.ts=now;return p}),DB.del.projetos);
 const np={};pr.arr.forEach(p=>np[p.id]=p);samples.forEach(p=>np[p.id]=p);DB.projects=np;DB.del.projetos=pr.del;
 DB.order=[...DB.order.filter(id=>np[id]),...Object.keys(np).filter(id=>!DB.order.includes(id)).sort((a,b)=>(np[b].created||0)-(np[a].created||0))];
 pushed+=pr.pushed;pulled+=pr.pulled;
 const cr=await mergeCol(uid,"cameras",DB.customCams.map(c=>{if(!c.ts)c.ts=now;return c}),DB.del.cameras);DB.customCams=cr.arr;DB.del.cameras=cr.del;pushed+=cr.pushed;pulled+=cr.pulled;
 let r=await mergeCfg(uid);pushed+=r[0];pulled+=r[1];
 r=await mergeLogo(uid,now);pushed+=r[0];pulled+=r[1];
 ls("esmp.db",DB);return{pushed,pulled};
}
async function mergeCol(uid,col,arr,del){
 const base=`empresas/${uid}/colecoes/${col}`;const cloud=(await dbReq("GET",base))||{};
 const loc=new Map(arr.map(o=>[String(o.id),o])),dl=new Map(del.map(o=>[String(o.id),o]));
 const ids=new Set([...Object.keys(cloud),...loc.keys(),...dl.keys()]);let pushed=0,pulled=0;
 for(const id of ids){
  const c=cloud[id],l=loc.get(id),d=dl.get(id);const lts=l?(l.ts||0):-1,dts=d?(d.ts||0):-1;
  const lDel=!!d&&dts>=lts,lEff=lDel?dts:lts;if(lDel)loc.delete(id);
  const hasLocal=!!l||!!d,cts=c?(c.ts||0):-1,cDel=!!c&&!!c.del;
  if(!hasLocal){if(c&&!cDel&&c.d){try{loc.set(id,JSON.parse(c.d));pulled++}catch(_){}}continue}
  if(!c||lEff>cts){const put={ts:lEff,del:lDel};if(!lDel)put.d=JSON.stringify(l);await dbReq("PUT",`${base}/${id}`,put);pushed++}
  else if(cts>lEff){if(cDel){loc.delete(id);dl.set(id,{id:isNaN(+id)?id:+id,ts:cts})}else if(c.d){try{loc.set(id,JSON.parse(c.d));dl.delete(id)}catch(_){}}pulled++}
 }
 return{arr:[...loc.values()],del:[...dl.values()],pushed,pulled};
}
function localCfg(){const co=DB.company;return{nome:co.name,razao:co.razao,desc:co.desc,end:co.end,tel:co.phone,email:co.email,doc:co.cnpj,insc:co.insc,cab:co.site,insta:co.insta,cidade:co.city,resp:co.resp,ask:DB.opt.ask,lines:DB.opt.lines,noseq:DB.opt.noseq,cur:DB.opt.cur,seq:DB.qseq,libPrice:DB.libPrice,pix:co.pix,pixNome:co.pixNome,pixCidade:co.pixCidade,assin:co.assin,cond:co.cond,payLink:co.payLink,equipe:co.equipe,checklist:co.checklist,propUrl:co.propUrl,oseq:DB.oseq}}
function applyCfg(d){const co=DB.company,map={nome:"name",razao:"razao",desc:"desc",end:"end",tel:"phone",email:"email",doc:"cnpj",insc:"insc",cab:"site",insta:"insta",cidade:"city",resp:"resp",pix:"pix",pixNome:"pixNome",pixCidade:"pixCidade",assin:"assin",cond:"cond",payLink:"payLink",equipe:"equipe",checklist:"checklist",propUrl:"propUrl"};
 for(const k in map)if(d[k]!==undefined)co[map[k]]=d[k];["ask","lines","noseq"].forEach(k=>{if(d[k]!==undefined)DB.opt[k]=!!d[k]});if(d.cur!==undefined)DB.opt.cur=+d.cur||0;if(d.libPrice)DB.libPrice=d.libPrice;if(+d.oseq>DB.oseq)DB.oseq=+d.oseq}
async function mergeCfg(uid){
 const path=`empresas/${uid}/config`;const c=(await dbReq("GET",path))||{};const has=Object.keys(c).length>0;
 const cts=has?(c.ts||0):-1,lts=DB.cfgTs||0;let cd={};try{cd=has&&c.d?JSON.parse(c.d):{}}catch(_){}
 const cseq=+cd.seq||0,lseq=DB.qseq||0,seq=Math.max(cseq,lseq);let pushed=0,pulled=0;
 if(!has&&lts===0&&lseq===0)return[0,0];
 if(!has||lts>cts){const d=lts>0?localCfg():{};d.seq=seq;await dbReq("PUT",path,{ts:lts,d:JSON.stringify(d)});pushed++}
 else if(cts>lts){applyCfg(cd);DB.cfgTs=cts;pulled++;if(seq>cseq){cd.seq=seq;await dbReq("PUT",path,{ts:cts,d:JSON.stringify(cd)})}}
 else if(seq>cseq){cd.seq=seq;await dbReq("PUT",path,{ts:cts,d:JSON.stringify(cd)})}
 DB.qseq=seq;return[pushed,pulled];
}
async function mergeLogo(uid,now){
 const path=`empresas/${uid}/logo`;const c=(await dbReq("GET",path))||{};const has=Object.keys(c).length>0,cDel=!!c.del;
 const cts=has?(c.ts||0):-1;let lts=DB.logoTs||0;const file=!!DB.company.logo;
 if(file&&lts===0){lts=now;DB.logoTs=lts}
 if(!file&&lts===0){if(has&&!cDel&&c.d){DB.company.logo="data:image/png;base64,"+c.d;DB.logoTs=cts;return[0,1]}return[0,0]}
 const lDel=!file;
 if(!has||lts>cts){const put={ts:lts,del:lDel};if(!lDel)put.d=String(DB.company.logo).split(",")[1]||"";await dbReq("PUT",path,put);return[1,0]}
 if(cts>lts){DB.company.logo=cDel?"":(c.d?"data:image/png;base64,"+c.d:DB.company.logo);DB.logoTs=cts;return[0,1]}
 return[0,0];
}

function qBase(q){return(q.itens||[]).filter(o=>!o.o&&!(hasPk(q)&&o.pk>=0)).reduce((a,o)=>a+lineV(o),0)}
function qPk(q,i){return qBase(q)+(q.itens||[]).filter(o=>!o.o&&o.pk===i).reduce((a,o)=>a+lineV(o),0)}
function qSub(q){return hasPk(q)?qPk(q,q.pkRec||0):(q.itens||[]).filter(o=>!o.o).reduce((a,o)=>a+lineV(o),0)}

/* valor por extenso (recibo) */
function extenso(v){
 const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
 const t3=n=>{if(n===100)return"cem";const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r<20){if(r)p.push(U[r])}else{p.push(D[Math.floor(r/10)]+(r%10?" e "+U[r%10]:""))}return p.join(" e ")};
 const int=n=>{if(n===0)return"zero";const parts=[];const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000;if(mi)parts.push(t3(mi)+(mi===1?" milhão":" milhões"));if(mil)parts.push(mil===1?"mil":t3(mil)+" mil");if(r)parts.push(t3(r));let s=parts[0]||"";for(let i=1;i<parts.length;i++){const last=i===parts.length-1;s+=(last&&(r<100||r%100===0)?" e ":last&&r?" ":", ")+parts[i]}return s.replace(/\s+/g," ")};
 v=Math.round((+v||0)*100);const re=Math.floor(v/100),ce=v%100;let s="";
 if(re)s=int(re)+(re===1?" real":(re%1e6===0?" de reais":" reais"));if(ce)s+=(s?" e ":"")+int(ce)+(ce===1?" centavo":" centavos");return s||"zero real";
}

function nextQuoteNum(){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let n=+DB.qseq||0;if(n<10000)n=r(10200,13800);n+=r(3,19);if(n>99999)n=10000+(n%90000);DB.qseq=n;return String(n)}
function saveQuote(q){
 if(!String(q.cliente||"").trim()){toast("Informe o nome do cliente.");return false}
 q.itens=(q.itens||[]).filter(o=>String(o.d||"").trim());
 if(!q.itens.length){q.itens=[{d:"",t:"i",q:1,p:0}];toast("Preencha a descrição de ao menos um item.");return false}
 q.itens.sort((a,b)=>(a.t==="s")-(b.t==="s"));q.status=q.status||"rascunho";
 if(!q.id)q.id=newId("quotes");
 if(DB.opt.noseq)q.num="";else if(!q.num||(/^\d{1,4}$/.test(q.num)&&(q.status||"rascunho")==="rascunho"&&!(q.link&&q.link.t)&&!q.renum)){q.num=nextQuoteNum();q.renum=1}
 const ex=DB.col.quotes.find(x=>x.id===q.id)||{};const o=Object.assign({},ex,q);upsert("quotes",o);QF.q=q;return true;
}

 const m=modal(sheetHead("Gerar recibo")+`<div class="stack"><div class="grid2"><div><label class="lbl" for="rc_v">Valor recebido</label><input class="in-f num" id="rc_v" inputmode="decimal" value="${dec(Math.max(0,def))}"></div><div><label class="lbl" for="rc_f">Forma de pagamento</label><select class="in-f" id="rc_f">${["Pix","Dinheiro","Cartão de crédito","Cartão de débito","Transferência","Boleto"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label class="lbl" for="rc_d">Data</label><input class="in-f" id="rc_d" type="date" value="${today()}"></div>${fld("rc_r","Referente a",`${q.sinal>0&&!(q.recibos||[]).length?"Entrada do o":"O"}rçamento${q.num?" Nº "+q.num:""}`)}</div><div class="row" style="justify-content:flex-end"><button class="btn pri" id="rc_ok">Gerar recibo em PDF</button></div></div>`);wireClose(m);

/* Mede cada bloco numa página escondida e distribui sem sobrar página vazia.
   O bloco de assinatura nunca fica sozinho: leva junto o bloco anterior. */
function packPages(blocks,head,lay="exec"){
 const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none";
 const tb=t=>t.pre+t.head+t.rows.join("")+"</tbody></table>";
 host.innerHTML=`<div class="pg L-${lay}">${head}<div class="bd">${blocks.map(b=>`<div class="blk">${b.tbl?tb(b.tbl):b.html}</div>`).join("")}</div>${foot(1,1)}</div>`;
 document.body.appendChild(host);const bd=host.querySelector(".bd"),MAX=bd.clientHeight-8,GAP=14;
 const ms=[...bd.children].map((e,i)=>{const h=Math.ceil(e.getBoundingClientRect().height);if(!blocks[i].tbl)return{h};
  const trs=[...e.querySelectorAll("tbody tr")].map(r=>Math.ceil(r.getBoundingClientRect().height)),th=Math.ceil(e.querySelector("thead").getBoundingClientRect().height);
  const t=e.querySelector("table"),pre=Math.ceil(t.getBoundingClientRect().top-e.getBoundingClientRect().top);return{h,trs,th,pre}});
 host.remove();
 const pages=[[]];let used=0;const room=()=>MAX-used-(pages[pages.length-1].length?GAP:0);
 const put=(html,h,bot)=>{const pg=pages[pages.length-1];used+=(pg.length?GAP:0)+h;pg.push({html,h,bot})};
 const newPage=()=>{pages.push([]);used=0};
 blocks.forEach((b,i)=>{const m=ms[i];
  if(b.tbl){const t=b.tbl;let k=0,first=true;
   while(k<t.rows.length){const top=(first?m.pre:0)+m.th;let h=top,j=k;
    if(top+m.trs[k]>room()&&pages[pages.length-1].length){newPage();continue}
    while(j<t.rows.length&&h+m.trs[j]<=room()){h+=m.trs[j];j++}
    if(j===k){h+=m.trs[k];j=k+1}
    put((first?t.pre:"")+t.head+t.rows.slice(k,j).join("")+"</tbody></table>",h);k=j;first=false;if(k<t.rows.length)newPage()}
   return}
  const pg=pages[pages.length-1];
  if(pg.length&&m.h>room()){const r=room(),fh=b.fit&&b.fit(r,m.h,b.html);if(fh){put(fh,r);return}newPage()}
  put(b.html,m.h,b.bot)});
 return pages.filter(p=>p.length).map(p=>p.map(x=>`<div class="blk${x.bot?" bot":""}">${x.html}</div>`));
}
const qLay=q=>LAYOUTS[q&&q.layout]?q.layout:"min";
function quotePages(q){
 const co=DB.company,lines=DB.opt.lines,pk=hasPk(q),its=q.itens||[];
 const blocks=[];const H=(h,html)=>blocks.push({h,html});
 const meta=[q.num?`Nº ${q.num}`:"",`Data: ${new Date(+q.id||Date.now()).toLocaleDateString("pt-BR")}`,`Validade: ${q.val||7} dias`].filter(Boolean).join(" · ");
 H(150,`<div class="qhd"><div><small>Emitente</small><b>${esc(co.name)}</b>${[co.razao&&co.razao.toLowerCase()!==String(co.name).toLowerCase()?co.razao:"",co.cnpj&&"CPF/CNPJ: "+co.cnpj,co.insc&&"Inscrição: "+co.insc,co.end,[co.phone,co.email].filter(Boolean).join(" | ")].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div><div><small>Cliente</small><b>${esc(q.cliente)}</b>${[q.tel&&"Telefone: "+q.tel,q.end].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`);
 const rowH=o=>Math.max(o.img?52:0,22+Math.floor(String(o.d).length/62)*15);
 const table=(arr,title,sub)=>{if(!arr.length)return;let pre=title?`<h5 class="qsec" style="margin-bottom:10px">${title}</h5>`:"";
  const head=`<table class="t qt${lines?"":" nl"}"><thead><tr><th>Descrição</th><th class="r">Qtd</th><th class="r">Unitário</th><th class="r">Total</th></tr></thead><tbody>`;
  const rows=[];
  arr.forEach(o=>{rows.push(`<tr><td>${esc(o.d)}${o.t==="s"&&pk?` <span class="tg">serviço</span>`:""}</td><td class="r">${fx(o.q)}</td><td class="r">${brl(o.p)}</td><td class="r"><b>${brl(lineV(o))}</b></td></tr>`)});blocks.push({tbl:{pre,head,rows}});
  if(sub)H(28,`<div class="qsub">${sub}: <b>${brl(arr.reduce((a,o)=>a+lineV(o),0))}</b></div>`)};
 const com=its.filter(o=>!o.o&&!(pk&&o.pk>=0)),itI=com.filter(o=>o.t!=="s"),itS=com.filter(o=>o.t==="s"),both=itI.length&&itS.length;
 if(pk&&com.length)H(26,`<h5 class="qsec" style="color:#262626;margin-bottom:-8px">Incluído em todos os pacotes</h5>`);
 table(itI,both?"Itens":"",both?"Subtotal de itens":"");table(itS,both?"Serviços":"",both?"Subtotal de serviços":"");
 if(pk){q.pacotes.forEach((n,j)=>{const a=its.filter(o=>!o.o&&o.pk===j);if(a.length)table(a,`Pacote ${esc(n)}${j===(q.pkRec||0)?" · recomendado":""}`,`Adicional do pacote ${esc(n)}`)});
  H(60+q.pacotes.length*40,`<h5 class="qsec">Escolha o seu pacote</h5><div class="pkg">${q.pacotes.map((n,j)=>`<div class="${j===(q.pkRec||0)?"rec":""}">${j===(q.pkRec||0)?"<i>Recomendado</i>":""}<b>${esc(n)}</b><span>${brl(Math.max(0,qPk(q,j)-(+q.desc||0)))}</span></div>`).join("")}</div>`)}
 const op=its.filter(o=>o.o);if(op.length)table(op,"Opcionais · não incluídos no total","");
 const sub=qSub(q);
 H(118,`<div class="totbox"><div><span>Subtotal${pk?` (${esc(q.pacotes[q.pkRec||0])})`:""}</span><b>${brl(sub)}</b></div>${q.desc>0?`<div><span>Desconto</span><b>− ${brl(q.desc)}</b></div>`:""}<div class="qtotal"><span>TOTAL</span><span>${brl(qTotal(q))}</span></div></div>`);
 const t=qTotal(q),en=qEntrada(q),rest=t-en,showPix=q.pix&&pixReady();
 if(q.sinal>0||q.parc>1||showPix){const amt=en>0?en:t,code=showPix?pixPayload(co.pix,co.pixNome||co.razao||co.name,co.pixCidade||co.city||"Belem",amt,"ORC"+(q.num||"")):"",qr=code?qrData(code):"";
  H(qr?190:80,`<h5 class="qsec">Condições de pagamento</h5><div class="paybox"><div>${q.sinal>0?`<p>Entrada de <b>${q.sinal}%</b>: <b>${brl(en)}</b></p><p>Saldo: <b>${brl(rest)}</b>${q.parc>1?` em <b>${q.parc}× de ${brl(rest/q.parc)}</b>`:""}</p>`:q.parc>1?`<p>Em <b>${q.parc}× de ${brl(t/q.parc)}</b></p>`:`<p>À vista: <b>${brl(t)}</b></p>`}${showPix?`<p class="pixk">Chave Pix: <b>${esc(co.pix)}</b>${co.pixNome?` · ${esc(co.pixNome)}`:""}</p>`:""}</div>${qr?`<div class="qrw"><img src="${qr}" alt=""><span>Pix ${en>0?"da entrada":""}<br>${brl(amt)}</span></div>`:""}</div>`)}
 if(q.manut>0)H(70,`<div class="manbox"><b>Plano de manutenção mensal (opcional): ${brl(q.manut)}/mês</b>${q.manutD?`<span>${esc(q.manutD)}</span>`:""}</div>`);
 blocks.push({fit:(r,h,x)=>{const pt=44-(h-r)-2;return pt>=8?x.replace('class="sig qsig"',`class="sig qsig" style="padding-top:${pt}px"`):null},html:`<div class="sig qsig"><div>${co.assin?`<img src="data:image/png;base64,${co.assin}" alt="">`:""}<b>${esc(co.name)}</b>${co.resp?`<br>${esc(co.resp)}`:""}</div><div>${q.sig?`<img src="data:image/png;base64,${q.sig}" alt="">`:""}<b>Aceite do cliente</b><br>${esc(q.cliente)}</div></div>${co.desc?`<p class="qdesc">${esc(co.desc)}</p>`:""}`});
 const obsQ=quoteObs(q),gar=String(DB.company.cond||"").trim();
 if(obsQ)H(60,`<h5 class="qsec">Observações</h5><div class="note">${esc(obsQ)}</div>`);
 if(gar)H(60,`<h5 class="qsec">Garantia e condições</h5><div class="note">${esc(gar)}</div>`);
 const grid=(title,arr,cap)=>{const S=196;for(let k=0;k<arr.length;k+=3){const row=arr.slice(k,k+3);
  const html=`${k?"":`<h5 class="qsec" style="margin-bottom:10px">${title}</h5>`}<div class="sqrow">${row.map(x=>`<div class="sq"><div class="im"><img src="${x.img}" alt=""></div>${cap(x)?`<div class="cap">${cap(x)}</div>`:""}</div>`).join("")}</div>`;
  blocks.push({html,fit:(r,h)=>{const n=S-(h-r)-2;return n>=120?html.replace(/class="sq"/g,`class="sq" style="width:${n}px"`).replace(/class="im"/g,`class="im" style="height:${n}px"`):null}})}};
 grid("Fotos dos itens e serviços",its.filter(o=>o.img&&String(o.d||"").trim()),o=>`${o.t==="s"?"<b>Serviço:</b> ":""}${esc(o.d)}`);
 grid("Registro do local",q.fotos||[],f=>esc(f.cap||""));
 const pages=packPages(blocks,head2("Orçamento",meta),qLay(q));
 const lay=qLay(q),cv=lay!=="min",n=pages.length+(cv?1:0),out=[];
 if(cv)out.push(`<div class="pg L-${lay}">${coverPage(lay,{kicker:"Proposta comercial",title:"Orçamento",sub:co.desc||"",client:q.cliente,addr:q.end,meta:[["Nº",q.num||"—"],["Data",new Date(+q.id||Date.now()).toLocaleDateString("pt-BR")],["Validade",(q.val||7)+" dias"]]})}</div>`);
 pages.forEach((p,i)=>out.push(`<div class="pg L-${lay}">${head2("Orçamento",meta)}<div class="bd">${p.join("")}</div>${foot(i+(cv?2:1),n)}</div>`));return out;
}

const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300};
const STOPW=new Set("de do da dos das com para a o as os e em no na nos nas um uma uns umas metros metro m mt mts unidades unidade un und pecas peca pc pcs tipo modelo cada ate pra pro mais".split(" "));
const SYN={gravador:["gravador","dvr","nvr"],dvr:["dvr","gravador"],nvr:["nvr","gravador"],canai:["ch","canai","canal"],canal:["ch","canal","canai"],tera:["tb"],tb:["tb"],camera:["camera","cam"],cabo:["cabo"],coaxial:["coax","coaxial"],coax:["coax","coaxial"],hd:["hd"],caixa:["caixa","cx"],conector:["conector","conec"]};
const sing=w=>w.length>4&&w.endsWith("es")&&!w.endsWith("ses")?w.slice(0,-2):w.length>3&&w.endsWith("s")?w.slice(0,-1):w;
const toks=s=>norm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(sing);
function parseScope(text){
 const chunks=norm(text).replace(/\s+mais\s+/g,",").split(/[,;\n.]+|\s+e\s+(?=\d|um\b|uma\b|dois\b|duas\b|tres\b|quatro\b|cinco\b|seis\b|sete\b|oito\b|nove\b|dez\b)/).map(x=>x.trim()).filter(Boolean);
 const cat=DB.col.catalog.map(o=>({o,t:new Set(toks(o.nome))}));const out=[];
 for(const ch of chunks){let w=ch.split(/\s+/),q=1,i=0;
  const n0=w[0]&&w[0].replace(",",".");if(/^\d+([.,]\d+)?$/.test(w[0]||"")){q=parseFloat(n0);i=1}else if(NUMW[w[0]]){q=NUMW[w[0]];i=1;if(NUMW[w[1]]&&w[2]!=="metros"){}if(w[1]==="e"&&NUMW[w[2]]){q+=NUMW[w[2]];i=3}}
  const rest=w.slice(i).join(" ");const qt=toks(rest).filter(t=>!STOPW.has(t));if(!qt.length)continue;
  const serv=/instala|configura|mao de obra|servic|manutenc|visita|passagem|programac|ativac/.test(rest);
  // câmera do banco por modelo
  let best=null,bs=0;
  const lm=LIB.find(l=>{const mm=norm(l.model).replace(/[^a-z0-9]/g,"");return mm.length>4&&rest.replace(/[^a-z0-9]/g,"").includes(mm)});
  if(lm){out.push({d:`Câmera ${lm.brand} ${lm.model} (${TECHN[lm.tech]} ${lm.mp}MP ${lm.type})`,t:"i",q,p:Math.round(lm.price*1.5*100)/100,c:lm.price,ok:1});continue}
  const words=qt.filter(t=>!/^\d/.test(t)),nums=qt.filter(t=>/^\d+$/.test(t)).map(Number);
  const syn=t=>SYN[t]||[t];
  const tm=(t,x)=>x===t||(t.length>3&&x.length>3&&(x.startsWith(t)||t.startsWith(x)))||(x.endsWith(t)&&/^\d+$/.test(x.slice(0,x.length-t.length)));
  for(const c of cat){if(serv!==(c.o.tipo==="s"))continue;const nt=[...c.t];let hitN=0;for(const t of words)if(syn(t).some(v=>nt.some(x=>tm(v,x))))hitN++;if(!hitN)continue;
   let sc=hitN/words.length;if(syn(words[0]).some(v=>tm(v,nt[0])))sc+=.3;nums.forEach(n=>{if(nt.some(x=>parseInt(x)===n))sc+=.15});if(nt.length>9)sc-=.1;if(sc>bs){bs=sc;best=c.o}}
  if(best&&bs>=.6){const r={d:best.nome,t:best.tipo==="s"?"s":"i",q,p:+best.preco||0,ok:1};if(+best.custo)r.c=+best.custo;out.push(r)}
  else out.push({d:rest.charAt(0).toUpperCase()+rest.slice(1),t:serv?"s":"i",q,p:0,ok:0});
 }
 return out;
}

 DB.col.clients.forEach(c=>{const p=c.posv;if(p&&p.next){const at=new Date(p.next+"T09:00:00").getTime();if(at>now)L.push({id:"p"+c.id,at,title:"Hora do pós-venda",text:`${c.nome}${p.base?(m=>m>=1?` · serviço há ${m} ${m===1?"mês":"meses"}`:"")(Math.round((at-new Date(p.base+"T12:00:00").getTime())/2592e6)):""}. Ofereça a preventiva ou algo novo.`})}});
 (DB.col.ordens||[]).forEach(o=>{if(o.data&&o.status==="agendada"){const at=new Date(o.data+"T"+(o.hora||"08:00")+":00").getTime()-3600e3;if(at>now)L.push({id:"o"+o.id,at,title:`Visita às ${o.hora||"08:00"}`,text:`${o.cliente} · ${o.titulo||"Ordem de serviço"}${o.tecnico?" · "+o.tecnico:""}`})}});
 try{ESMAndroid.schedule(JSON.stringify(L.sort((a,b)=>a.at-b.at).slice(0,60)))}catch(_){}},800)}

function sgPlace(){

 SG.box.style.bottom=Math.max(0,window.innerHeight-(v.top+v.h))+"px";SG.box.style.height=h+"px";
 document.body.style.paddingBottom=(h+40)+"px";
 // leva o campo para logo acima da lista, para ver o que já está escrito

 if(r.bottom>lim||r.top<v.top+60){let el=SG.inp.parentElement;while(el&&el!==document.body){const cs=getComputedStyle(el);if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight)break;el=el.parentElement}
  const d=r.bottom-lim;(el&&el!==document.body?el:document.scrollingElement).scrollBy(0,d)}
}
function sgShow(){

 if(!SG.box){SG.box=document.createElement("div");SG.box.className="sugbox";SG.box.innerHTML=`<div class="sg-h"><span class="sg-n"></span><span class="sg-g" style="flex:0 0 44px"></span><span style="flex:1;text-align:right"><button type="button" class="sg-x">Fechar</button></span></div><div class="sg-l"></div>`;
  document.body.appendChild(SG.box);SG.box.addEventListener("mousedown",e=>e.preventDefault());
  $(".sg-x",SG.box).onclick=()=>{const i=SG.inp;sgHide();if(i)i.blur()};
  // arrastar a barrinha para cima ou para baixo muda a altura da lista
  const hd=$(".sg-h",SG.box);hd.addEventListener("pointerdown",e=>{if(e.target.closest(".sg-x"))return;e.preventDefault();const y0=e.clientY,h0=SG.box.offsetHeight;hd.setPointerCapture(e.pointerId);
   const mv=ev=>{SG.h=Math.max(120,Math.min(h0+(y0-ev.clientY),sgView().h-90));SG.box.style.height=SG.h+"px"};
   const up=()=>{hd.removeEventListener("pointermove",mv);try{localStorage.setItem("esmp.sugH",SG.h)}catch(_){}sgPlace()};
   hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",up,{once:true});hd.addEventListener("pointercancel",up,{once:true})})}
 $(".sg-n",SG.box).textContent=l.length+(l.length>=80?"+":"")+" sugest"+(l.length>1?"ões":"ão")+" · arraste a barra";
 const box=$(".sg-l",SG.box);box.innerHTML=l.map((n,i)=>`<button type="button" data-sg="${i}">${esc(n)}</button>`).join("");box.scrollTop=0;
 box.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{const i=SG.inp;i.value=l[+b.dataset.sg];sgHide();i.dispatchEvent(new Event("input",{bubbles:true}));i.dispatchEvent(new Event("change",{bubbles:true}));i.blur()});
 sgPlace();
}

 const id=t.dataset.sl||t.getAttribute("list");if(!id){if(SG.box)sgHide();return}

/* garantia da empresa: os orçamentos antigos tinham uma cópia dela nas observações; aqui ela é tirada
   (a garantia agora vem sempre da aba Empresa) */
function condKnown(){const h=DB.condHist||[];return[...new Set([DB.company.cond,COMPANY_DEF.cond,"Garantia de 90 dias no serviço.",GARANTIA_ESM,...h].map(x=>String(x||"").trim()).filter(Boolean))]}
function quoteObs(q){let t=String(q.obs||"").trim();if(!t)return"";for(const c of condKnown()){if(t===c)return"";if(t.startsWith(c))t=t.slice(c.length).trim();else if(t.endsWith(c))t=t.slice(0,-c.length).trim()}return t}
function syncGarantia(){let n=0;DB.col.quotes.forEach(q=>{const o=quoteObs(q);if(o!==String(q.obs||"").trim()){q.obs=o;q.ts=Date.now();n++}});persist();return n}
function rememberCond(old){old=String(old||"").trim();if(!old)return;DB.condHist=[...new Set([...(DB.condHist||[]),old])].slice(-10)}
const GARANTIA_ESM="1 – GARANTIA: A ESM SECURITY, CNPJ nº 43.067.742/0001-47, garante por 01 (um) ano os serviços por ela executados, contados a partir da data de conclusão. Os equipamentos fornecidos têm, além disso, a garantia do próprio fabricante, cujo acionamento a ESM SECURITY intermedia quando necessário.\n2 – COBERTURA: A garantia cobre defeitos decorrentes da instalação e da mão de obra que causem mau funcionamento em condições normais de uso, conforme os manuais dos fabricantes.\n3 – PERDA DA GARANTIA: A garantia é cancelada em caso de reparos ou alterações por pessoas não autorizadas, mau uso, quedas, acidentes, vandalismo, infiltração, descargas atmosféricas, variações ou sobrecarga na rede elétrica, ou danos não decorrentes da instalação.\n4 – NÃO COBERTOS: Itens de desgaste natural e consumíveis, configurações de internet e de aplicativos de terceiros, e serviços fora do escopo contratado.\n5 – MANUTENÇÃO PREVENTIVA (OPCIONAL): Recomendamos 03 (três) manutenções preventivas por ano, com custo à parte, mediante aceite do cliente.";
/* ================= NOVO (v2.4): pós-venda por cliente ================= */
const addMonths=(d,n)=>{const x=new Date(d+"T12:00:00");x.setMonth(x.getMonth()+ +n);return x.toISOString().slice(0,10)};
const haTxt=d=>{const n=Math.max(0,daysAgo(d));if(n<30)return n<=1?(n?"há 1 dia":"hoje"):`há ${n} dias`;const m=Math.round(n/30);return m===1?"há 1 mês":`há ${m} meses`};
const daysAgo=d=>Math.round((Date.now()-new Date(d+"T12:00:00").getTime())/864e5);
function posvDesc(c){const qs=DB.col.quotes.filter(q=>q.cliId===c.id&&["aprovado","concluido"].includes(qStatus(q))).sort((a,b)=>(b.stTs||b.id)-(a.stTs||a.id));const q=qs[0];if(!q)return"";const s=(q.itens||[]).find(o=>o.t==="s"&&String(o.d).trim());return s?s.d:(q.num?"o serviço do orçamento Nº "+q.num:"")}
function posvFromQuote(q){if(!["aprovado","concluido"].includes(q.status)||!q.cliId)return;const c=DB.col.clients.find(x=>x.id===q.cliId);if(!c||(c.posv&&c.posv.next))return;
 const ev=+(DB.company.posvMeses||3);c.posv={every:ev,base:today(),next:addMonths(today(),ev),hist:(c.posv&&c.posv.hist)||[]};upsert("clients",c);toast(`Pós-venda de ${c.nome} agendado para ${fmtDate(c.posv.next)}`)}
function posvCard(c){const p=c.posv||{},due=p.next&&p.next<=today();
 return`<div class="card stack" style="margin-top:16px;gap:10px${due?";border:1.5px solid var(--red)":""}"><div class="row" style="justify-content:space-between"><h3>Pós-venda ${NEW}</h3>${due?`<span class="tag" style="background:var(--red);color:#fff">Está na hora</span>`:""}</div>
 ${p.next?`<p style="margin:0">${due?`<b>Pós-venda vencido em ${fmtDate(p.next)}.</b>`:`Próximo pós-venda: <b>${fmtDate(p.next)}</b>`}${p.base?`<br><span class="muted" style="font-size:13px">Serviço feito ${haTxt(p.base)} (${fmtDate(p.base)})${p.every?` · repete a cada ${p.every} ${+p.every===1?"mês":"meses"}`:""}</span>`:""}</p>`:`<p class="muted" style="margin:0;font-size:13.5px">Sem pós-venda agendado. Escolha daqui a quanto tempo lembrar de visitar, fazer a preventiva ou oferecer algo novo.</p>`}
 <div class="chips">${[1,3,6,12].map(n=>`<button class="chip" data-pvm="${n}" aria-pressed="${+p.every===n&&!!p.next}">${n} ${n===1?"mês":"meses"}</button>`).join("")}<input class="in-f" type="date" id="pv_d" value="${esc(p.next||"")}" style="width:auto;padding:6px 10px;font-size:13px" aria-label="Data do pós-venda"></div>
 ${p.next?`<div class="row"><button class="btn sm pri" id="pv_w">Mensagem no WhatsApp</button><button class="btn sm" id="pv_ok">Feito</button><button class="btn sm" id="pv_ad">Adiar 7 dias</button><button class="btn sm ghost" id="pv_x">Desligar</button></div>`:""}
 ${(p.hist||[]).length?`<span class="muted" style="font-size:12.5px">Pós-vendas feitos: ${p.hist.slice(-5).map(fmtDate).join(", ")}</span>`:""}</div>`}
function posvWire(c,m,redo){const p=()=>c.posv=c.posv||{hist:[]},save=t=>{upsert("clients",c);if(t)toast(t);redo()};
 m.querySelectorAll("[data-pvm]").forEach(b=>b.onclick=()=>{const v=p(),n=+b.dataset.pvm;v.every=n;v.base=v.base||today();v.next=addMonths(today(),n);save(`Pós-venda em ${fmtDate(v.next)}`)});
 const d=$("#pv_d",m);if(d)d.onchange=()=>{if(!d.value)return;const v=p();v.next=d.value;v.base=v.base||today();save(`Pós-venda em ${fmtDate(v.next)}`)};
 const w=$("#pv_w",m);if(w)w.onclick=()=>posvWhats(c);
 const ok=$("#pv_ok",m);if(ok)ok.onclick=()=>{const v=p();v.hist=[...(v.hist||[]),today()];v.base=today();v.next=v.every?addMonths(today(),v.every):"";save(v.next?`Feito. Próximo em ${fmtDate(v.next)}`:"Pós-venda registrado")};
 const ad=$("#pv_ad",m);if(ad)ad.onclick=()=>{const v=p(),x=new Date(Math.max(Date.now(),new Date(v.next+"T12:00:00").getTime()));x.setDate(x.getDate()+7);v.next=x.toISOString().slice(0,10);save(`Adiado para ${fmtDate(v.next)}`)};
 const x=$("#pv_x",m);if(x)x.onclick=()=>{const v=p();v.next="";v.every=0;save("Pós-venda desligado")}}
function posvWhats(c){if(!c)return;const p=c.posv||{},mes=p.base?Math.round(daysAgo(p.base)/30):0,sv=posvDesc(c),n=String(c.nome||"").split(" ")[0];
 const t=`Olá, ${n}! Tudo bem? Aqui é da ${DB.company.name}.${mes?` Já faz ${mes} ${mes===1?"mês":"meses"} que fizemos ${sv?sv.toLowerCase():"o seu serviço"}.`:""} Queremos saber se está tudo funcionando bem e oferecer uma manutenção preventiva para manter o sistema em dia. Podemos agendar uma visita?`;
 const ph=String(c.tel||"").replace(/\D/g,"");if(ph.length>=10)openLink(`https://wa.me/${ph.startsWith("55")?ph:"55"+ph}?text=${encodeURIComponent(t)}`);else copy(t,"Mensagem copiada")}
function posvDue(){return DB.col.clients.filter(c=>c.posv&&c.posv.next&&c.posv.next<=today()).sort((a,b)=>a.posv.next.localeCompare(b.posv.next))}
function posvDueCard(){const l=posvDue();if(!l.length)return"";return`<div class="card stack" style="margin-bottom:14px;gap:8px;border:1.5px solid var(--red)"><h3>Pós-venda: está na hora (${l.length}) ${NEW}</h3>${l.slice(0,8).map(c=>`<div class="camrow"><span class="d" data-pvo="${c.id}" style="cursor:pointer"><b>${esc(c.nome)}</b><br><span class="muted">${c.posv.base?`serviço ${haTxt(c.posv.base)} · `:""}desde ${fmtDate(c.posv.next)}</span></span><button class="btn sm" data-pvw="${c.id}">WhatsApp</button></div>`).join("")}</div>`}
/* aviso ao abrir o app (uma vez por dia) */
setTimeout(()=>{try{const l=posvDue();if(!l.length||DB.posvAviso===today())return;DB.posvAviso=today();ls("esmp.db",DB);
 const t=l.length===1?`${l[0].nome}: ${l[0].posv.base?`serviço feito ${haTxt(l[0].posv.base)}. `:""}Hora do pós-venda.`:`${l.length} clientes esperando pós-venda.`;
 if(window.ESMAndroid&&ESMAndroid.notify)ESMAndroid.notify("Pós-venda",t);toast(t)}catch(_){}},2500);

function catEdit(ex,serv,done){
 const v=ex||{nome:"",preco:0,un:serv?"un":"un",tipo:serv?"s":"i"};
 const m=modal(sheetHead(ex?"Editar":(serv?"Novo serviço":"Novo item"))+`<div class="stack"><div><label class="lbl" for="ke_t">Tipo</label><select class="in-f" id="ke_t"><option value="i" ${v.tipo!=="s"?"selected":""}>Item (produto)</option><option value="s" ${v.tipo==="s"?"selected":""}>Serviço</option></select></div>${fld("ke_n","Nome",v.nome)}<div class="grid2"><div><label class="lbl" for="ke_p">Preço</label><input class="in-f num" id="ke_p" inputmode="decimal" value="${v.preco?dec(v.preco):""}" placeholder="0,00"></div>${fld("ke_u","Unidade (un, m, h...)",v.un)}<div><label class="lbl" for="ke_c">Custo (só você vê) ${NEW}</label><input class="in-f num" id="ke_c" inputmode="decimal" value="${v.custo?dec(v.custo):""}" placeholder="0,00"></div></div>
 <div class="row" style="justify-content:flex-end">${ex?`<button class="btn ghost" id="ke_x">Excluir</button>`:""}<button class="btn pri" id="ke_s">Salvar</button></div></div>`);wireClose(m);
 $("#ke_s",m).onclick=()=>{const n=$("#ke_n",m).value.trim();if(!n){toast("Informe o nome do item.");return}const o=Object.assign({},ex||{},{id:ex?ex.id:newId("catalog"),nome:n,preco:num($("#ke_p",m).value),un:$("#ke_u",m).value.trim(),tipo:$("#ke_t",m).value,custo:num($("#ke_c",m).value)});if(!o.custo)delete o.custo;delete o.seed;upsert("catalog",o);m.remove();toast("Salvo no catálogo");done&&done(o)};

}

 if($("#lgx"))$("#lgx").onclick=()=>{co.logo="";DB.logoTs=Date.now();persist();vCompany()};
 if($("#e_sync"))$("#e_sync").onclick=()=>runSync(true);
 $("#e_sig").onclick=()=>sigPad(b=>{co.assin=b;cfgChanged();vCompany()});if($("#e_sigx"))$("#e_sigx").onclick=()=>{co.assin="";cfgChanged();vCompany()};
 $("#e_bk").onclick=exportBackup;$("#e_csv").onclick=exportCSV;$("#e_rs").onclick=()=>$("#e_rsf").click();$("#e_rsf").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};
 [$("#e_news"),$("#e_news2")].forEach(b=>b&&(b.onclick=showNews));
 document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);document.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 if($("#e_acc"))$("#e_acc").onclick=adminUsers;
 if($("#e_out"))$("#e_out").onclick=()=>{if(AUTH.local&&!AUTH.ok){AUTH.local=false;saveAuth();showLogin()}else logout()};
}

/* ================= início ================= */
window.addEventListener("resize",()=>{if(tab==="projetos"&&inProj&&ptab==="documento"){clearTimeout(window._rz);window._rz=setTimeout(vDoc,300)}});
$("#brandlogo").src=LOGO_DEF;
initOrcData();if(!DB.garMig){try{syncGarantia()}catch(_){}DB.garMig=1}ls("esmp.db",DB);
applyTheme();
if(!FB.apiKey){AUTH.local=true;AUTH.preview=true}
if(authAllowed()){enterApp()}else{render();showLogin()}
window.addEventListener("online",()=>{if(authCloud()&&DB.dirty)runSync(false)});
// botão Voltar do Android: fecha janela aberta, sai do formulário/projeto e volta para Projetos
window.__back=()=>{const m=[...document.querySelectorAll(".modal")].pop();if(m){m.remove();return true}if($("#login"))return false;
 if(tab==="orcamentos"&&QF.open){QF.open=false;render();return true}if(tab==="servicos"&&SF.open){SF.open=null;render();return true}if(tab==="projetos"&&inProj){inProj=false;render();return true}if(tab!=="projetos"){setTab("projetos");return true}return false};
