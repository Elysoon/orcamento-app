 <div class="card stack"><h3>Cobrança online ${NEW}</h3><p class="muted" style="margin:0;font-size:13px">Cole aqui o seu link de pagamento (Mercado Pago, InfinitePay, PagBank, Asaas…). Ele aparece no link de aprovação e na mensagem de cobrança, junto com o Pix.</p>${fld("co_payLink","Link de pagamento (cartão ou boleto)",co.payLink,"https://")}</div>
 <div class="card stack"><h3>Equipe e checklist ${NEW}</h3>${area("co_equipe","Técnicos (um por linha)",co.equipe,3)}${area("co_checklist","Checklist padrão das ordens de serviço (um item por linha)",co.checklist,6)}</div>
 <div class="card stack"><h3>Aparência ${NEW}</h3><div class="chips">${[["auto","Automático"],["claro","Claro"],["escuro","Escuro"]].map(([k,n])=>`<button class="chip" data-th="${k}" aria-pressed="${(()=>{try{return(localStorage.getItem("esmp.theme")||"auto")===k}catch(_){return k==="auto"}})()}">${n}</button>`).join("")}</div><p class="muted" style="margin:0;font-size:12.5px">Os PDFs continuam sempre em fundo claro para impressão.</p></div>
 <div class="card stack"><h3>Página de aprovação ${NEW}</h3>${fld("co_propUrl","Endereço da página pública",co.propUrl,"https://elysoon.github.io/orcamento-app/proposta/")}<p class="muted" style="margin:0;font-size:12.5px">Deixe em branco para usar o padrão. Só mude se publicar a página em outro endereço, como o seu site.</p></div>
 <div class="card stack"><h3>Assinatura da empresa ${NEW}</h3><div class="row"><div id="e_sigi">${co.assin?`<img src="data:image/png;base64,${co.assin}" alt="Assinatura" style="max-height:70px;background:#fffff0;border-radius:10px;padding:6px">`:`<span class="muted" style="font-size:13px">Sem assinatura. Ela sai nos orçamentos e recibos.</span>`}</div><button class="btn sm" id="e_sig">${co.assin?"Refazer":"Desenhar assinatura"}</button>${co.assin?`<button class="btn sm ghost" id="e_sigx">Remover</button>`:""}</div></div>
 <div class="card stack"><h3>Cores do PDF ${NEW}</h3><p class="muted" style="margin:0;font-size:13px">As cores da empresa pintam as faixas, títulos e o total dos PDFs. O padrão é o da ESM.</p>
  <div class="row" style="flex-wrap:wrap">${BRAND_PAL.map(([a,b,n])=>`<button class="swatch" data-pal="${a}|${b}" title="${n}" aria-label="${n}" aria-pressed="${(co.cor||"").toLowerCase()===a.toLowerCase()&&(co.cor2||"").toLowerCase()===b.toLowerCase()}" style="background:linear-gradient(135deg,${a} 55%,${b} 55%)"></button>`).join("")}</div>
  <div class="grid2">${fld("co_cor","Cor principal",co.cor,"","color")}${fld("co_cor2","Cor secundária",co.cor2,"","color")}</div></div>
 <div class="card stack"><h3>Certificado de garantia ${NEW}</h3><p class="muted" style="margin:0;font-size:13px">Documento para o cliente com prazo, datas e condições. Se você não escrever um texto aqui, ele usa as Condições padrão (a garantia da empresa).</p>
  <div class="grid2">${fld("co_garMeses","Prazo padrão (meses)",co.garMeses,"12")}</div>${area("co_garCert","Condições do certificado (opcional)",co.garCert,5)}
  <div class="row"><button class="btn pri" id="gc_new">Emitir certificado de garantia</button><button class="btn sm" id="gc_def">Usar a garantia padrão da ESM</button></div>
  <div id="gc_list">${certListHtml()}</div></div>
 <div class="card stack"><h3>Condições padrão ${NEW}</h3>${area("co_cond","Texto que já entra em todo orçamento novo",co.cond,6)}<p class="muted" style="margin:0;font-size:12.5px">Vale para todos os orçamentos, inclusive rascunhos, salvos e já feitos. O que for só de um cliente vai nas observações do orçamento dele.</p><div class="row"><button class="btn sm" id="co_gar">Usar a garantia padrão da ESM</button><button class="btn sm pri" id="co_gsync">Sincronizar em todos os orçamentos</button></div></div>
 <div class="card stack"><h3>PDF</h3><label class="chk"><input type="checkbox" id="op_ask" ${o.ask?"checked":""}>Sempre escolher o nome do arquivo salvo</label><label class="chk"><input type="checkbox" id="op_lines" ${o.lines?"checked":""}>Linha entre os itens</label><label class="chk"><input type="checkbox" id="op_noseq" ${o.noseq?"checked":""}>Desabilitar sequência numérica do orçamento</label>
  <div class="grid2"><div><label class="lbl" for="op_cur">Moeda</label><select class="in-f" id="op_cur">${CUR_LBL.map((l,i)=>`<option value="${i}" ${o.cur===i?"selected":""}>${l}</option>`).join("")}</select></div><div><label class="lbl" for="op_seq">Último número de orçamento</label><input class="in-f" id="op_seq" inputmode="numeric" value="${DB.qseq}"></div></div></div>
 <div class="card stack"><h3>Backup e relatório ${NEW}</h3><div class="row"><button class="btn" id="e_bk">Exportar backup (.json)</button><button class="btn" id="e_rs">Restaurar backup</button><button class="btn" id="e_csv">Planilha dos orçamentos (.csv)</button></div><input type="file" id="e_rsf" accept=".json,application/json" hidden></div>
 <p class="muted" style="font-size:12.5px;text-align:center">ESM Projeta ${APP_VER} · Orçamentos e projetos de CFTV · <button class="btn sm ghost" id="e_news2">Novidades</button>${window.ESMAndroid&&/^https:/.test(location.protocol)?` <button class="btn sm ghost" id="e_upd">Buscar atualização</button>`:window.ESMAndroid?` <span class="muted">(cópia do aparelho, sem internet)</span>`:""}</p>
 </div></section>`;
 const map={cor:"cor",cor2:"cor2",garMeses:"garMeses",garCert:"garCert",name:"name",razao:"razao",cnpj:"cnpj",insc:"insc",phone:"phone",email:"email",site:"site",insta:"insta",city:"city",resp:"resp",end:"end",desc:"desc",pix:"pix",pixNome:"pixNome",pixCidade:"pixCidade",cond:"cond",payLink:"payLink",equipe:"equipe",checklist:"checklist",propUrl:"propUrl"};
 {const cc=$("#co_cond");let before=co.cond;cc.addEventListener("focus",()=>{before=co.cond});cc.addEventListener("change",()=>{if(before!==co.cond)rememberCond(before)})}
 document.querySelectorAll("[data-pal]").forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.pal.split("|");co.cor=x;co.cor2=y;$("#co_cor").value=x;$("#co_cor2").value=y;document.querySelectorAll("[data-pal]").forEach(z=>z.setAttribute("aria-pressed",z===b));cfgChanged()});
 $("#gc_new").onclick=()=>certForm(null);
 $("#gc_def").onclick=()=>{co.garCert=GARANTIA_ESM;$("#co_garCert").value=GARANTIA_ESM;cfgChanged();toast("Texto do certificado atualizado")};
 certListRefresh();
 $("#co_gsync").onclick=()=>{const n=syncGarantia();if(authCloud())runSync(true);toast(`Garantia sincronizada em ${DB.col.quotes.length} orçamento${DB.col.quotes.length===1?"":"s"}${n?`; ${n} tinham cópia antiga e foram atualizados`:""}`)};
 $("#co_gar").onclick=()=>{const t=GARANTIA_ESM;const go=()=>{rememberCond(co.cond);co.cond=t;$("#co_cond").value=t;cfgChanged();const n=syncGarantia();toast(`Garantia atualizada em todos os orçamentos${n?` (${n} limpos)`:""}`)};if(String(co.cond||"").trim()&&co.cond!==t)confirmSheet("Trocar as condições padrão?","O texto atual será substituído pela garantia padrão da ESM.","Trocar",go);else go()};
 if($("#e_upd"))$("#e_upd").onclick=async()=>{const b=$("#e_upd");b.disabled=true;b.textContent="Verificando…";const v=await remoteVer();
  if(!v){toast("Não consegui falar com o GitHub agora. Confira a internet e tente de novo.");b.disabled=false;b.textContent="Buscar atualização";return}
  if(v===APP_VER){toast(`Você já está na versão mais nova (${APP_VER}). Se eu acabei de publicar, o GitHub leva até 2 minutos: tente de novo daqui a pouco.`);b.disabled=false;b.textContent="Buscar atualização";return}
  toast(`Baixando a versão ${v}…`);if(saveT)saveNow();setTimeout(goLatest,600)};
 for(const k in map)$("#co_"+k).oninput=e=>{co[map[k]]=e.target.value;cfgChanged()};
 ["ask","lines","noseq"].forEach(k=>$("#op_"+k).onchange=e=>{o[k]=e.target.checked;cfgChanged()});
 $("#op_cur").onchange=e=>{o.cur=+e.target.value;cfgChanged()};$("#op_seq").onchange=e=>{DB.qseq=Math.max(0,parseInt(e.target.value)||0);persist()};
 $("#lg").onclick=()=>$("#lgf").click();
 $("#lgf").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,600,"image/png",.9).then(d=>{co.logo=d;DB.logoTs=Date.now();persist();vCompany()})};
 if($("#lgx"))$("#lgx").onclick=()=>{co.logo="";DB.logoTs=Date.now();persist();vCompany()};
 if($("#e_sync"))$("#e_sync").onclick=()=>runSync(true);
 $("#e_sig").onclick=()=>sigPad(b=>{co.assin=b;cfgChanged();vCompany()});if($("#e_sigx"))$("#e_sigx").onclick=()=>{co.assin="";cfgChanged();vCompany()};
 wireCoTabs();$("#e_bk").onclick=exportBackup;$("#e_csv").onclick=exportCSV;$("#e_rs").onclick=()=>$("#e_rsf").click();$("#e_rsf").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};
 [$("#e_news"),$("#e_news2")].forEach(b=>b&&(b.onclick=showNews));
 document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);document.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 if($("#e_acc"))$("#e_acc").onclick=adminUsers;
 if($("#e_out"))$("#e_out").onclick=()=>{if(AUTH.local&&!AUTH.ok){AUTH.local=false;saveAuth();showLogin()}else logout()};
}

/* ================= início ================= */
window.addEventListener("resize",()=>{if(tab==="projetos"&&inProj&&ptab==="documento"){clearTimeout(window._rz);window._rz=setTimeout(vDoc,300)}});
$("#brandlogo").src=LOGO_DEF;
applyBrand();initOrcData();if(!DB.garMig){try{syncGarantia()}catch(_){}DB.garMig=1}ls("esmp.db",DB);
applyTheme();
if(!FB.apiKey){AUTH.local=true;AUTH.preview=true}
if(authAllowed()){enterApp()}else{render();showLogin()}
window.addEventListener("online",()=>{if(authCloud()&&DB.dirty)runSync(false)});
// botão Voltar do Android: fecha janela aberta, sai do formulário/projeto e volta para Projetos
window.__back=()=>{const m=[...document.querySelectorAll(".modal")].pop();if(m){m.remove();return true}if($("#login"))return false;
 if(tab==="orcamentos"&&QF.open){QF.open=false;render();return true}if(tab==="servicos"&&SF.open){SF.open=null;render();return true}if(tab==="servicos"&&SF.colab){SF.colab=null;render();return true}if(tab==="projetos"&&inProj){if(saveT)saveNow();inProj=false;render();return true}if(tab!=="projetos"){setTab("projetos");return true}return false};
</script>
</body></html>
